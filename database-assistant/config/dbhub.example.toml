# Candidate only: pin the installed DBHub version and validate in isolated MySQL.
# Each DSN must use a DIFFERENT dedicated account restricted to approved views.
# This config illustrates two separate sources; a database-assistant deployment
# grants exact tools for ONLY ONE source. It does not support cross-source JOIN.
# Sample tables named orders/payments in docs must coexist within one authorized
# source for JOIN/EXISTS examples to be valid.
[[sources]]
id = "orders"
dsn = "${ORDERS_DSN}"
query_timeout = 15
connection_timeout = 10

[[sources]]
id = "payments"
dsn = "${PAYMENTS_DSN}"
query_timeout = 15
connection_timeout = 10

[[tools]]
name = "execute_sql"
source = "orders"
readonly = true
max_rows = 100

[[tools]]
name = "execute_sql"
source = "payments"
readonly = true
max_rows = 100

[[tools]]
name = "search_objects"
source = "orders"

[[tools]]
name = "search_objects"
source = "payments"
