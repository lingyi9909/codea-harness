version: 1
rules:
  - id: MYBATIS-SQL-001
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [MapperXml]
    requiredEvidence: [CHANGED_RANGE, RESOURCE_RELATION]
    prompt: >-
      检查本次 Mapper XML 中 UPDATE/DELETE 变更是否删除、遗漏或显著弱化 WHERE 条件；只有变更范围和资源关系证据足以支持问题成立时才提出 Finding。

  - id: MYBATIS-ISOLATION-001
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [MapperXml]
    requiredEvidence: [CHANGED_RANGE, RESOURCE_RELATION]
    prompt: >-
      检查本次 SQL 变更是否删除或弱化 tenant、org、user 等数据隔离条件；必须基于当前 ReviewUnit 的真实 SQL 变更与资源关系判断，不得仅凭命名推断。

  - id: MYBATIS-BIND-001
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [MapperXml]
    requiredEvidence: [CHANGED_RANGE]
    prompt: >-
      检查本次 Mapper XML 变更是否新增或扩大使用 ${} 进行 SQL 动态拼接，并判断输入是否可能形成注入或越权风险；matcher 命中本身不等于 Finding。

  - id: MYBATIS-CONTRACT-001
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [Mapper, MapperXml]
    requiredEvidence: [RESOURCE_RELATION, SYMBOL]
    prompt: >-
      检查本次 Mapper Java 方法与 XML statement id、parameter、result contract 的变更是否不一致；必须引用已验证的 Mapper symbol 与资源关系证据。

  - id: SPRING-TX-001
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [Service]
    requiredEvidence: [CHAIN, SYMBOL]
    prompt: >-
      检查本次 Service 变更中的 @Transactional 是否存在同 Bean 自调用导致代理事务不生效的候选风险；必须结合 verified chain 与真实 symbol 判断。

  - id: SPRING-TX-002
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [Service]
    requiredEvidence: [CHAIN, SYMBOL]
    prompt: >-
      检查本次 Service 变更中的 checked exception、捕获与重新抛出路径是否与事务 rollback 语义不一致；只有 verified chain 和源码证据充分时才提出 Finding。

  - id: SPRING-TX-003
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [Service]
    requiredEvidence: [CHAIN, SYMBOL]
    prompt: >-
      检查本次 Service 变更是否在 readOnly transaction 语义下进入写路径；必须沿 verified chain 证明写操作候选，不能仅凭方法名判断。

  - id: SPRING-AUTH-001
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [Controller]
    requiredEvidence: [CHAIN, SYMBOL]
    prompt: >-
      检查 changed/new endpoint 的鉴权或权限约束是否相对已验证业务模式缺失或弱化；不得仅因为缺少某个固定注解名就提出 Finding。

  - id: SPRING-VALIDATION-001
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [Controller]
    requiredEvidence: [CHAIN, SYMBOL]
    prompt: >-
      检查 changed/new request handling 是否缺少关键输入约束，并能沿 verified chain 到达高风险写操作或敏感操作；必须同时具备入口与链路证据。

  - id: SPRING-CONFIG-001
    version: 1
    kind: AGENT
    severityDefault: high
    roles: [YamlConfig]
    requiredEvidence: [CHANGED_RANGE]
    prompt: >-
      检查本次配置变更中的 datasource、连接池、timeout、retry、log-level 或 feature-switch key 是否可能造成高风险运行行为；仅针对真实 changed config 范围判断。
