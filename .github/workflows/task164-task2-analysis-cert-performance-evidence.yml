name: task164-task2-analysis-cert-performance-evidence

on:
  workflow_dispatch:
  push:
    branches: [hotfix/1.6.4-analysis-cert-performance-task2]
    paths:
      - '.code-harness/tools-runtime/internal/analysis/**'
      - '.code-harness/tools-runtime/internal/nav/**'
      - '.github/workflows/task164-task2-analysis-cert-performance-evidence.yml'
      - 'docs/superpowers/plans/2026-09-08-codea-harness-1.6.4-task2-analysis-certify-performance-evidence-plan.md'

permissions:
  contents: read

jobs:
  task2-telemetry-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Vendor pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep-164-task2.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep-164-task2'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $env:CODEA_AST_GREP_TEST_PATH = (Join-Path $dir 'ast-grep.exe')
          "CODEA_AST_GREP_TEST_PATH=$env:CODEA_AST_GREP_TEST_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $env:CODEA_AST_GREP_TEST_PATH --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Task 2 telemetry contract gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 -v ./internal/analysis -run '^Test164CertifyPerformance'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact HEAD evidence
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "workflow checkout drift: head=$head github.sha=${{ github.sha }}" }
          Write-Output "TASK164_TASK2_CONTRACT_EXACT_HEAD PASS head=$head"
