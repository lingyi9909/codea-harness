name: task164-task2-analysis-cert-performance-evidence

on:
  workflow_dispatch:
  push:
    branches: [hotfix/1.6.4-analysis-cert-performance-task2]
    paths:
      - '.code-harness/tools-runtime/internal/analysis/**'
      - '.code-harness/tools-runtime/internal/nav/**'
      - '.github/workflows/task164-task2-analysis-cert-performance-evidence.yml'
      - 'docs/superpowers/plans/2026-09-08-codea-harness-1.6.4-task2-analysis-certify-performance-evidence-plan.md'

permissions:
  contents: read

jobs:
  task2-telemetry-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Task 2 telemetry contract gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 -v ./internal/analysis -run '^Test164CertifyPerformance'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact HEAD evidence
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "workflow checkout drift: head=$head github.sha=${{ github.sha }}" }
          Write-Output "TASK164_TASK2_CONTRACT_EXACT_HEAD PASS head=$head"
