name: task164-closure-strictmode-fix

on:
  push:
    branches: [release/1.6.4-final-certification]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.6.4-final-certification
          fetch-depth: 0
      - name: Patch StrictMode-safe model log filters
        shell: pwsh
        run: |
          $path = '.github/scripts/task164-task4-packaged-plain-review-e2e.ps1'
          $text = [IO.File]::ReadAllText((Resolve-Path $path))
          $old1 = '$toolResponses = @($modelEntries | Where-Object { $_.responseType -eq ''tool'' })'
          $new1 = '$toolResponses = @($modelEntries | Where-Object { $_.PSObject.Properties.Name -contains ''responseType'' -and [string]$_.responseType -eq ''tool'' })'
          $old2 = '$finalTextCount = @($modelEntries | Where-Object { $_.responseType -eq ''text'' -and ([string]$_.content).Contains($display) }).Count'
          $new2 = '$finalTextCount = @($modelEntries | Where-Object { $_.PSObject.Properties.Name -contains ''responseType'' -and [string]$_.responseType -eq ''text'' -and ([string]$_.content).Contains($display) }).Count'
          foreach ($pair in @(@($old1,$new1),@($old2,$new2))) {
            if (-not $text.Contains($pair[0])) { throw "StrictMode audit patch anchor missing: $($pair[0])" }
            $text = $text.Replace($pair[0],$pair[1])
          }
          [IO.File]::WriteAllText((Resolve-Path $path),$text,[Text.UTF8Encoding]::new($false))
          $tokens=$null; $errors=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { throw $errors }
      - name: Commit fix and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/task164-task4-packaged-plain-review-e2e.ps1
          git rm .github/workflows/task164-closure-strictmode-fix.yml
          git commit -m 'test: make product E2E model audit StrictMode-safe'
          git push origin HEAD:release/1.6.4-final-certification
