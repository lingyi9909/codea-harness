name: task162-hotfix-task3-certification

on:
  push:
    branches: [hotfix/1.6.2-task3-real-plain-review-e2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task3-certification:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Active Agent Runtime invocation contract
        shell: pwsh
        run: ./.github/scripts/task162-hotfix-task2-invocation-contract-regression.ps1

      - name: Task 2 invocation contract focused tests
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 -run 'Test162HotfixTask2' -v ./cmd/codea-dcep-tools

      - name: Task 1 canonical authority focused tests
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 -run 'Test162Hotfix' -v ./internal/changeset ./internal/analysis ./cmd/codea-dcep-tools

      - name: Full Go regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./...

      - name: Go vet
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go vet ./...

      - name: Build Windows x64 Runtime
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go build -trimpath -ldflags '-s -w' -o ../bin/codea-dcep-tools.exe ./cmd/codea-dcep-tools

      - name: Real Runtime invocation contract
        shell: pwsh
        run: |
          ./.github/scripts/task162-hotfix-task2-runtime-invocation-regression.ps1
          $global:LASTEXITCODE = 0

      - name: Agent snapshot request Runtime contract
        shell: pwsh
        run: |
          ./.github/scripts/task162-hotfix-task1-agent-snapshot-request-contract.ps1
          $global:LASTEXITCODE = 0

      - name: Canonical ChangeSet authority scenarios
        shell: pwsh
        run: |
          ./.github/scripts/task162-hotfix-task1-canonical-changeset-regression.ps1
          $global:LASTEXITCODE = 0

      - name: Install pinned ast-grep 0.42.1
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep-162-hotfix-task3-certification.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep-162-hotfix-task3-certification'
          Invoke-WebRequest -Uri "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          New-Item -ItemType Directory -Force '.code-harness/bin' | Out-Null
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe' -Force
          & '.code-harness/bin/ast-grep.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retained 1.6 Review Precision regression
        shell: pwsh
        run: ./.github/scripts/task160-real-review-precision-regression.ps1

      - name: Retained 1.6.1 Runtime rename regression
        shell: bash
        run: |
          set -euo pipefail
          test -d .code-harness/tools-runtime/cmd/codea-dcep-tools
          test ! -d .code-harness/tools-runtime/cmd/codea-harness-tools
          test -f .code-harness/bin/codea-dcep-tools.exe
          test ! -f .code-harness/bin/codea-harness-tools.exe
          scopes=(.code-harness .github/scripts .github/workflows README.md)
          refs=$(git grep -l 'codea-harness-tools\.exe' -- "${scopes[@]}" \
            ':!.code-harness/tools-runtime/internal/upgrade/task161_release_upgrade_test.go' \
            ':!.github/scripts/task161-release.ps1' \
            ':!.github/scripts/task161-real-160-upgrade.ps1' \
            ':!.github/scripts/task162-release-certification.ps1' \
            ':!.github/scripts/task162-hotfix-task3-real-plain-review-e2e.ps1' \
            ':!.github/workflows/task161-runtime-rename-audit.yml' \
            ':!.github/workflows/task162-task1-maven-multimodule.yml' \
            ':!.github/workflows/task162-hotfix-task1-canonical-changeset.yml' \
            ':!.github/workflows/task162-hotfix-task2-invocation-contract.yml' \
            ':!.github/workflows/task162-hotfix-task3-certification.yml' || true)
          cmdrefs=$(git grep -l 'cmd/codea-harness-tools' -- "${scopes[@]}" \
            ':!.github/scripts/task161-real-160-upgrade.ps1' \
            ':!.github/scripts/task162-release-certification.ps1' \
            ':!.github/workflows/task161-runtime-rename-audit.yml' \
            ':!.github/workflows/task162-task1-maven-multimodule.yml' \
            ':!.github/workflows/task162-hotfix-task1-canonical-changeset.yml' \
            ':!.github/workflows/task162-hotfix-task2-invocation-contract.yml' \
            ':!.github/workflows/task162-hotfix-task3-certification.yml' || true)
          if [ -n "$refs" ] || [ -n "$cmdrefs" ]; then
            printf 'Unexpected legacy Runtime refs:\n%s\n%s\n' "$refs" "$cmdrefs"
            exit 1
          fi
          echo 'TASK161_RUNTIME_RENAME_AUDIT PASS'

      - name: Retained 1.6.2 Maven multi-module regression
        shell: pwsh
        run: ./.github/scripts/task162-real-multimodule-regression.ps1

      - name: Retained 1.6.2 duplicate-symbol authority regression
        shell: pwsh
        run: ./.github/scripts/task162-duplicate-symbol-authority-regression.ps1

      - name: Install pinned OpenCode Agent Host
        shell: pwsh
        run: |
          npm install --global opencode-ai@1.18.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (& opencode --version | Out-String).Trim()
          Write-Output "OpenCode $version"
          if ($version -notmatch '1\.18\.25') { throw "unexpected OpenCode version: $version" }

      - name: Validate committed Task 3 test sources
        shell: pwsh
        run: |
          $psPath = '.github/scripts/task162-hotfix-task3-real-plain-review-e2e.ps1'
          $source = Get-Content $psPath -Raw
          [void][scriptblock]::Create($source)
          foreach ($stale in @('$opencodeExit:', 'Invoke-Git add -A', "@('schemaVersion','runId','optionsHash','mode','selectionIds')")) {
            if ($source.Contains($stale)) { throw "Task 3 source still contains pre-materialization diagnostic form: $stale" }
          }
          python -m py_compile .github/scripts/task162-hotfix-task3/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK162_HOTFIX_TASK3_COMMITTED_TEST_SOURCES PASS'

      - name: Real plain harness review E2E
        shell: pwsh
        run: ./.github/scripts/task162-hotfix-task3-real-plain-review-e2e.ps1

      - name: Task 3 exact-head certification marker
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "checkout is not exact head: $head" }
          Write-Output "TASK162_HOTFIX_TASK3_EXACT_HEAD PASS head=$head"
