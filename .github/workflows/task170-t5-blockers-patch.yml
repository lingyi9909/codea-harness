name: task170-t5-blockers-patch
on:
  push:
    branches: [feature/1.7-integrated-t5]
    paths:
      - '.code-harness/tools-runtime/task170_t5_blockers_patch.py'
      - '.code-harness/tools-runtime/task170_t5_blockers_patch2.py'
      - '.code-harness/tools-runtime/task170_t5_blockers_patch3.py'
      - '.github/workflows/task170-t5-blockers-patch.yml'
permissions:
  contents: write
  actions: read
jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.10'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Download accepted 1.6.4.final release candidate
        uses: actions/download-artifact@v4
        with:
          name: codea-harness-1.6.4-release-candidate-439d9618591657b80d4670f1d9f3b5909d378447
          path: ${{ runner.temp }}/task170-accepted-rc
          github-token: ${{ github.token }}
          repository: lingyi9909/codea-harness
          run-id: 34561342970
      - name: Provision pinned ast-grep
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'task170-accepted-rc/codea-harness-1.6.4-windows-x64-install.zip'
          $stage = Join-Path $env:RUNNER_TEMP 'task170-approved-install'
          Expand-Archive -Path $zip -DestinationPath $stage -Force
          $source = Join-Path $stage '.code-harness/bin/ast-grep.exe'
          $target = Join-Path $env:GITHUB_WORKSPACE '.code-harness/bin/ast-grep.exe'
          New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
          Copy-Item -LiteralPath $source -DestinationPath $target -Force
          "CODEA_AST_GREP=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Apply blocker repair
        shell: pwsh
        run: |
          python .code-harness/tools-runtime/task170_t5_blockers_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .code-harness/tools-runtime/task170_t5_blockers_patch2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .code-harness/tools-runtime/task170_t5_blockers_patch3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format touched Go files
        shell: pwsh
        run: |
          $files = @(
            '.code-harness/tools-runtime/internal/reviewprogress/progress.go',
            '.code-harness/tools-runtime/internal/reviewcontext/model_170.go',
            '.code-harness/tools-runtime/internal/reviewcontext/build_170.go',
            '.code-harness/tools-runtime/internal/reviewcontext/build_170_test.go',
            '.code-harness/tools-runtime/internal/reviewcontext/build_budget_170_test.go',
            '.code-harness/tools-runtime/internal/reviewcontext/verify_170.go',
            '.code-harness/tools-runtime/internal/nav/context_discovery_170.go',
            '.code-harness/tools-runtime/internal/nav/spring_resolution_170.go',
            '.code-harness/tools-runtime/internal/analysis/base_source_170.go',
            '.code-harness/tools-runtime/cmd/codea-dcep-tools/review_context_command_170.go',
            '.code-harness/tools-runtime/cmd/codea-dcep-tools/review_context_entry_170.go',
            '.code-harness/tools-runtime/cmd/codea-dcep-tools/review_precision_command.go'
          )
          foreach ($f in $files) { if (Test-Path $f) { gofmt -w $f } }
          git diff --check
      - name: Focused T5 blocker tests
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env: { GOTOOLCHAIN: local, GOPROXY: off, GOSUMDB: off }
        run: go test ./internal/nav ./internal/reviewcontext ./internal/reviewprogress ./cmd/codea-dcep-tools -run Test170 -count=1
      - name: Smoke codea-dcep-tools full
        id: cmd-smoke
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env: { GOTOOLCHAIN: local, GOPROXY: off, GOSUMDB: off }
        run: |
          go test ./cmd/codea-dcep-tools -count=1 -v 2>&1 | Tee-Object -FilePath task170-t5-cmd-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve cmd failure log
        if: failure() && steps.cmd-smoke.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.name codea-t5-ci
          git config user.email codea-t5-ci@example.invalid
          git add -f .code-harness/tools-runtime/task170-t5-cmd-smoke.log
          git commit -m 'debug(t5): capture cmd regression failure'
          git push origin HEAD:feature/1.7-integrated-t5
      - name: Commit repair
        if: success()
        shell: pwsh
        run: |
          git config user.name codea-t5-ci
          git config user.email codea-t5-ci@example.invalid
          git add .code-harness/tools-runtime/internal .code-harness/tools-runtime/cmd/codea-dcep-tools
          git diff --cached --check
          git commit -m 'fix(t5): close context authority and evidence blockers'
          git push origin HEAD:feature/1.7-integrated-t5
