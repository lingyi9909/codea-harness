name: t8-gofmt-once

on:
  push:
    branches: [feature/1.7-integrated-t8]
    paths:
      - '.github/workflows/t8-gofmt-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.10'
      - name: Format T8 Go changes and remove formatter workflow
        shell: pwsh
        run: |
          git config core.autocrlf false
          $changed = @(git diff --name-only 4c77b80ef68d4c419b6c015d06910d83eea4f01c HEAD -- '*.go')
          $files = @($changed | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE ($_ -replace '/', [IO.Path]::DirectorySeparatorChar) })
          if ($files.Count -gt 0) { gofmt -w $files }
          git rm .github/workflows/t8-gofmt-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'style(review): apply Windows gofmt for task 8'
          git push origin HEAD:feature/1.7-integrated-t8
