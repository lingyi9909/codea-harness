name: task164-closure-final-patch-v2

on:
  push:
    branches: [release/1.6.4-final-certification]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.6.4-final-certification
          fetch-depth: 0
      - name: Apply robust Closure patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.UTF8Encoding]::new($false)

          foreach ($path in @(
            '.github/scripts/task164-task4-packaged-plain-review-e2e.ps1',
            '.github/scripts/task164-task4-progress-interruption-e2e.ps1'
          )) {
            $resolved = (Resolve-Path $path).Path
            $text = [IO.File]::ReadAllText($resolved)
            $old = "models = @{ 'task4' = @{ name = 'Task 4 Deterministic'; limit = @{ context = 200000; output = 4096 } } }"
            $new = "models = @{ 'task4' = @{ name = 'Task 4 Deterministic'; tool_call = `$true; limit = @{ context = 200000; output = 4096 } } }"
            if (-not $text.Contains($old)) { throw "tool_call anchor missing: $path" }
            [IO.File]::WriteAllText($resolved, $text.Replace($old,$new), $utf8)
          }

          $finalPath = '.github/scripts/task164-final-certification.ps1'
          $final = [IO.File]::ReadAllText((Resolve-Path $finalPath)).Replace("`r`n","`n")
          $oldBase = "`$base = 'ffedb2a273dc714db080dc2115f189f20d55b227'"
          if (-not $final.Contains($oldBase)) { throw 'old base missing' }
          $final = $final.Replace($oldBase,"`$base = '6605916b4929434ea3362ab5b4fc6325ca117a2f'")
          if (-not $final.Contains('        acceptedTask3Baseline = $base')) { throw 'old checklist baseline missing' }
          $final = $final.Replace('        acceptedTask3Baseline = $base','        closureHotfixBase = $base')

          $allowedPattern = '(?s)    \$allowed = @\(\n.*?\n    \)\n    foreach \(\$path in \$changed\) \{'
          $allowedLines = @(
            '    $allowed = @(',
            "        '.code-harness/AGENTS.md',",
            "        '.code-harness/bootstrap.md',",
            "        '.code-harness/agents/orchestrator.md',",
            "        '.code-harness/contracts/reviewer-host-contract.md',",
            "        '.github/scripts/task164-closure-opencode-resolved-contract.ps1',",
            "        '.github/scripts/task164-closure-install-e2e.ps1',",
            "        '.github/scripts/task164-closure-agent-contract.ps1',",
            "        '.github/scripts/task164-install.ps1',",
            "        '.github/scripts/task164-release-package.ps1',",
            "        '.github/scripts/task164-release-blocker-task2-e2e.ps1',",
            "        '.github/scripts/task164-task4-packaged-plain-review-e2e.ps1',",
            "        '.github/scripts/task164-task4-plain-review-server.py',",
            "        '.github/scripts/task164-task4-progress-interruption-e2e.ps1',",
            "        '.github/workflows/task164-closure-product-e2e.yml',",
            "        '.github/workflows/task164-final-certification.yml',",
            "        '.github/scripts/task164-final-certification-contract.py',",
            "        '.github/scripts/task164-final-certification.ps1',",
            "        'README.md',",
            "        'docs/superpowers/plans/2026-09-11-codea-harness-1.6.4-final-certification-closure-hotfix-plan.md'",
            '    )',
            '    foreach ($path in $changed) {'
          ) -join "`n"
          $allowedRegex = [regex]::new($allowedPattern)
          if ($allowedRegex.Matches($final).Count -ne 1) { throw 'scope allowlist anchor not unique' }
          $final = $allowedRegex.Replace($final,$allowedLines,1)

          $guardPattern = '(?s)    \$acceptedProductChanges = @\(\$changed \| Where-Object \{ \$_ -like ''\.code-harness/\*'' \}\)\n    if \(\$acceptedProductChanges\.Count -ne 0\) \{.*?\n    \}\n    Write-Output "TASK164_FINAL_SCOPE PASS head=\$head files=\$\(\$changed\.Count\) acceptedTask3=\$base"'
          $guardLines = @(
            '    $runtimeGoChanges = @($changed | Where-Object {',
            "        `$_ -like '.code-harness/tools-runtime/*' -and ([string]`$_).EndsWith('.go',[StringComparison]::OrdinalIgnoreCase)",
            '    })',
            '    if ($runtimeGoChanges.Count -ne 0) {',
            '        throw "Runtime Go implementation changed during Closure: $($runtimeGoChanges -join '','')"',
            '    }',
            '    Write-Output "TASK164_FINAL_SCOPE PASS head=$head files=$($changed.Count) closureHotfixBase=$base"'
          ) -join "`n"
          $guardRegex = [regex]::new($guardPattern)
          if ($guardRegex.Matches($final).Count -ne 1) { throw 'Runtime freeze guard anchor not unique' }
          $final = $guardRegex.Replace($final,$guardLines,1)

          $packageEnd = "    } @('TASK164_RELEASE_PACKAGE_BUILD PASS version=1.6.4')"
          if (-not $final.Contains($packageEnd)) { throw 'package gate end line missing' }
          $packageReplacement = @(
            '    } @(',
            "        'TASK164_RELEASE_PACKAGE_BUILD PASS version=1.6.4',",
            "        'INSTALL_SAFE_ENTRYPOINT_PACKAGED PASS file=install.ps1'",
            '    )',
            '',
            "    Invoke-Gate 'closureResolvedReviewerHost' {",
            "        Invoke-Script '.github/scripts/task164-closure-opencode-resolved-contract.ps1'",
            '    } @(',
            "        'OPENCODE_11825_REVIEWER_PERMISSION_RESOLVED PASS',",
            "        'OPENCODE_11825_REVIEWER_COMMAND_SUBTASK_RESOLVED PASS',",
            "        'REVIEWER_BASH_DENIED PASS',",
            "        'REVIEWER_TASK_DENIED PASS',",
            "        'REVIEWER_RUNTIME_ARTIFACT_WRITE_DENIED PASS',",
            "        'REVIEWER_SUBMIT_TOOL_ALLOWED PASS'",
            '    )',
            '',
            "    Invoke-Gate 'closureInstallSafety' {",
            "        Invoke-Script '.github/scripts/task164-closure-install-e2e.ps1'",
            '    } @(',
            "        'INSTALL_REVIEWER_HOST_RESOURCES PASS',",
            "        'INSTALL_EXISTING_OPENCODE_CONFLICT_FAIL_CLOSED PASS'",
            '    )',
            '',
            "    Invoke-Gate 'closureAgentContract' {",
            "        Invoke-Script '.github/scripts/task164-closure-agent-contract.ps1'",
            "    } @('HARNESS_164_AGENT_CONTRACT_CONSISTENT PASS')"
          ) -join "`n"
          $final = $final.Replace($packageEnd,$packageReplacement)

          $positive = "        'TASK164_TASK4_PACKAGED_PLAIN_REVIEW_8_OF_8 PASS',"
          if (-not $final.Contains($positive)) { throw 'positive marker anchor missing' }
          $positiveReplacement = @(
            "        'OPENCODE_RUNTIME_PROGRESS_RENDERED PASS',",
            "        'OPENCODE_RUNTIME_PROGRESS_1_TO_8 PASS',",
            "        'PROMPT_ONLY_PROGRESS_NOT_AUTHORITY PASS',",
            $positive
          ) -join "`n"
          $final = $final.Replace($positive,$positiveReplacement)

          $interrupt = "        'TASK164_TASK4_INTERRUPTION_CHANGE_ANALYSIS PASS',"
          if (-not $final.Contains($interrupt)) { throw 'interruption marker anchor missing' }
          $interruptReplacement = @(
            "        'OPENCODE_INTERRUPTION_STAGE_VISIBLE PASS',",
            "        'OPENCODE_INTERRUPTION_LATER_STAGES_BLOCKED PASS',",
            $interrupt
          ) -join "`n"
          $final = $final.Replace($interrupt,$interruptReplacement)
          [IO.File]::WriteAllText((Resolve-Path $finalPath),$final,$utf8)

          $contractPath = '.github/scripts/task164-final-certification-contract.py'
          $contract = [IO.File]::ReadAllText((Resolve-Path $contractPath))
          $anchor = '    forbid(task4_review, "TASK4_STAGE_", "prompt-only positive progress", failures)'
          if (-not $contract.Contains($anchor)) { throw 'contract anchor missing' }
          $insert = @(
            '    require(task4_review, "tool_call = $true", "positive custom model tool capability", failures)',
            '    require(interruption, "tool_call = $true", "interruption custom model tool capability", failures)',
            $anchor
          ) -join "`n"
          [IO.File]::WriteAllText((Resolve-Path $contractPath),$contract.Replace($anchor,$insert),$utf8)
      - name: Verify, self-delete, and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.github/scripts/task164-final-certification.ps1',
            '.github/scripts/task164-task4-packaged-plain-review-e2e.ps1',
            '.github/scripts/task164-task4-progress-interruption-e2e.ps1'
          )) {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -ne 0) { throw "PowerShell parse failed: $path $errors" }
          }
          python -m py_compile .github/scripts/task164-final-certification-contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/task164-final-certification-contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rm .github/workflows/task164-closure-final-patch.yml .github/workflows/task164-closure-final-patch-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/task164-final-certification.ps1 .github/scripts/task164-final-certification-contract.py .github/scripts/task164-task4-packaged-plain-review-e2e.ps1 .github/scripts/task164-task4-progress-interruption-e2e.ps1
          git commit -m 'fix: close 1.6.4 final certification gates'
          git push origin HEAD:release/1.6.4-final-certification
