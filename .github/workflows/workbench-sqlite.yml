name: Workbench SQLite standalone (no MySQL)
on:
  pull_request:
    paths: ['web-workbench/**', '.github/workflows/workbench-sqlite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web-workbench/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run web:build
      - run: npm run test:sqlite
      - run: node --experimental-strip-types --test tests/api/shared-workspace.test.ts tests/api/execution-isolation.test.ts
      - if: matrix.os == 'ubuntu-24.04' && matrix.node == '24'
        run: npx playwright install chromium
      - if: matrix.os == 'ubuntu-24.04' && matrix.node == '24'
        run: node --experimental-strip-types --test tests/ui/anonymous-institution.test.ts tests/ui/unified-config.test.ts
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.node == '24'
        with:
          name: sqlite-shared-workspace-browser-${{ github.run_id }}
          path: |
            web-workbench/screenshots/anonymous-institution-*.png
            web-workbench/screenshots/unified-*.png
          if-no-files-found: ignore
