name: task164-final-certification

on:
  push:
    branches: [release/1.6.4-final-certification]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-certification:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify final certification scripts parse
        shell: pwsh
        run: |
          foreach ($path in @(
            '.github/scripts/task164-final-certification.ps1',
            '.github/scripts/task164-release-package.ps1',
            '.github/scripts/task164-task4-packaged-plain-review-e2e.ps1',
            '.github/scripts/task164-task4-progress-interruption-e2e.ps1',
            '.github/scripts/task163-task3-active-contract-regression.ps1',
            '.github/scripts/task163-task3-negative-control.ps1',
            '.github/scripts/task163-task3-real-multi-chain-same-session-e2e.ps1',
            '.github/scripts/task163-task4-package-regression.ps1'
          )) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -ne 0) { throw "PowerShell parse failed: $path $errors" }
          }
          python -m py_compile .github/scripts/task164-final-certification-contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task164-task4-plain-review-server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task163-task3/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-review-reliability-task1/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-review-reliability-task2/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-hotfix-task3/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK164_FINAL_SCRIPT_PARSE PASS'

      - name: Task 4 final certification contract
        shell: pwsh
        run: |
          python ./.github/scripts/task164-final-certification-contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK164_FINAL_CONTRACT PASS'

      - name: Run Codea Harness 1.6.4 Final Certification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File ./.github/scripts/task164-final-certification.ps1

      - name: Upload complete certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task164-final-evidence-${{ github.sha }}
          path: |
            task164-final-evidence/**
            codea-harness-1.6.4-release-checklist.json
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload official 1.6.4 release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.4-release-candidate-${{ github.sha }}
          path: |
            codea-harness-1.6.4-windows-x64-install.zip
            codea-harness-1.6.4-windows-x64-upgrade.zip
            codea-harness-1.6.4-release-checklist.json
            codea-dcep-tools-whitelist.txt
          if-no-files-found: error
