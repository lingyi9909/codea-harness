name: task160-task3-blockers-verification

on:
  pull_request:

jobs:
  task3-blockers-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: Task 3 blocker regression gate
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./internal/finding
