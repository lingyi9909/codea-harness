name: task164-closure-doc-apply

on:
  push:
    branches: [release/1.6.4-final-certification]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-doc-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.6.4-final-certification
          fetch-depth: 0
      - name: Apply exact 1.6.4 agent contract and install UX patch
        shell: pwsh
        run: pwsh -NoProfile -File ./.github/scripts/task164-closure-doc-contract-apply.ps1
      - name: Verify and commit patch
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-closure-agent-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (git status --porcelain)) {
            Write-Output 'TASK164_CLOSURE_DOC_ALREADY_APPLIED PASS'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .code-harness/AGENTS.md .code-harness/bootstrap.md .code-harness/agents/orchestrator.md .code-harness/contracts/reviewer-host-contract.md README.md
          git commit -m 'fix: align 1.6.4 review agent authority and install UX'
          git push origin HEAD:release/1.6.4-final-certification
