# Semantic Chain Editing

## 用户意图

```text
harness chain edit <id|Controller|Controller.method>
```

只允许 exact id / exact Controller / exact Controller.method 解析目标；多条命中必须报告歧义，不得 fuzzy 选择。EntryPoint identity 在 1.5.3 Task 5 不允许通过 edit 改写。

## Authority boundary

Generic Agent / Orchestrator **只能写**同 run 的：

```text
.code-harness/runs/<runId>/requests/**
```

Agent 不得直接创建、覆盖或修改：

```text
.code-harness/runs/<runId>/analysis/**
.code-harness/runs/<runId>/analysis/edit-candidates/**
.code-harness/chains/**
```

`.code-harness/chains/*.yaml` 是 Project State，不是 Agent 可直接编辑的文本文件。任何代码事实编辑都必须由 same-run Certified ChangeAnalysis 证明；dependency workspace 只能用于 navigation，不能成为 current Project State 的写 authority。

## 允许的语义操作

Task 5 只允许以下 operation：

```text
REPLACE_NODE
ADD_NODE
REMOVE_NODE
REORDER_NODE
RENAME_CHAIN
UPDATE_NOTES
```

- `REPLACE_NODE / ADD_NODE / REMOVE_NODE / REORDER_NODE`：Runtime 必须验证最终完整 ordered core path 与 Certified ChangeAnalysis 的 confirmed callChains / symbolLocations / roles 一致；不能逐 operation 放行后拼出未验证关系。
- `RENAME_CHAIN / UPDATE_NOTES`：只改变描述性元数据；不得改变 EntryPoint、代码 symbol/path/role 或调用事实。
- 不支持 `ADD_ENTRYPOINT / REMOVE_ENTRYPOINT / REPLACE_ENTRYPOINT` 等 EntryPoint 编辑。

## 固定流程

```text
现有 ACCEPTED Project State Chain
→ 当前 source 的 same-run Certified ChangeAnalysis
→ Agent 创建 requests/chain-edit.json proposal
→ Controlled Runtime chain edit
→ Runtime 验证六类 operation + 最终完整 Chain 代码事实
→ .code-harness/runs/<runId>/analysis/edit-candidates/<id>.yaml
→ 同目录 Runtime provenance certificate（kind=EDIT）
→ 展示 deterministic edit diff
→ 用户明确表示要保存该 candidate
→ chain seal-persist
→ 展示 exact preview + planId
→ 用户明确确认当前 exact planId
→ chain persist(runId + planId only)
→ atomic 写入 .code-harness/chains/<id>.yaml
```

Controlled Runtime 调用：

```text
codea-harness-tools chain edit --input .code-harness/runs/<runId>/requests/chain-edit.json
codea-harness-tools chain seal-persist --input .code-harness/runs/<runId>/requests/chain-seal-persist.json
codea-harness-tools chain persist --input .code-harness/runs/<runId>/requests/chain-persist.json
```

`chain edit` 只生成 Runtime-certified EDIT candidate，**不得直接**修改 `.code-harness/chains/**`。首次“保存/更新”只授权 `chain seal-persist` 封存 exact candidate；最终 Project State write 仍要求用户明确确认当前 `planId` 后调用 `chain persist`。

## Fail closed

以下任一情况必须拒绝且产生 0 Project State writes：

- request 不在 same-run `requests/**`；
- raw / stale / tampered / uncertified ChangeAnalysis；
- operation 类型不在六类 allowlist；
- 新 node/reorder/replace 后的完整调用顺序没有 confirmed evidence；
- symbol/path/role 不是 current workspace 的 exact certified fact；
- EDIT candidate/provenance/analysis 在 seal 前后被篡改；
- sealed plan 后 existing Project State 发生变化；
- 最终确认不是当前 exact `planId`。

不得使用 YAML `status=ACCEPTED`、类名后缀、basename、字符串包含、相似度或 dependency workspace 关系来补足代码事实。
''', encoding='utf-8')

