          skill.parent.mkdir(parents=True, exist_ok=True)
          skill.write_text('''---
name: edit-chain
description: 对已确认 Business Chain 执行受控语义编辑；Agent 只提交 operation proposal，代码事实由 same-run Certified ChangeAnalysis 证明，Runtime 生成 EDIT candidate，最终保存复用不可变 write plan。
version: 1
agent: orchestrator
tools:
  - read_code
