name: task5-agent-contract-sync-once

on:
  push:
    branches:
      - docs/1.5.3-chain-reliability-editing-design
    paths:
      - '.github/workflows/task5-agent-contract-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-task5-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/1.5.3-chain-reliability-editing-design
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Create edit-chain skill
        run: |
          mkdir -p .code-harness/skills/edit-chain
          cat > .code-harness/skills/edit-chain/SKILL.md <<'EOF'
          ---
          name: edit-chain
          description: 对已确认 Business Chain 执行受控语义编辑；Agent 只提交 operation proposal，Runtime 基于 same-run Certified ChangeAnalysis 生成 EDIT candidate，最终保存复用不可变 write plan。
          version: 1
          agent: orchestrator
          tools:
            - read_code
          ---

          # Semantic Chain Editing

          ## 用户意图

          ```text
          harness chain edit <id|Controller|Controller.method>
          ```

          只允许 exact id / exact Controller / exact Controller.method 解析目标；多条命中必须报告歧义，不得 fuzzy 选择。EntryPoint identity 在 1.5.3 Task 5 不允许通过 edit 改写。

          ## Authority boundary

          Generic Agent / Orchestrator 只能写同 run 的 `requests/**` proposal。Agent 不得直接创建、覆盖或修改 `.code-harness/runs/<runId>/analysis/**`、`.code-harness/runs/<runId>/analysis/edit-candidates/**` 或 `.code-harness/chains/**`。

          代码事实必须来自 same-run Certified ChangeAnalysis；dependency workspace 只能用于 navigation，不能成为 current Project State 写 authority。

          ## 允许的 operation

          ```text
          REPLACE_NODE
          ADD_NODE
          REMOVE_NODE
          REORDER_NODE
          RENAME_CHAIN
          UPDATE_NOTES
          ```

          `REPLACE_NODE / ADD_NODE / REMOVE_NODE / REORDER_NODE` 必须由 Runtime 验证最终完整 ordered core path；不能逐 operation 放行后拼出未验证关系。`RENAME_CHAIN / UPDATE_NOTES` 只能改变描述性元数据。禁止 ADD/REMOVE/REPLACE EntryPoint。

          ## 固定流程

          ```text
          现有 ACCEPTED Project State Chain
          → same-run Certified ChangeAnalysis
          → requests/chain-edit.json
          → codea-harness-tools chain edit --input ...
          → Runtime 验证六类 operation + 最终完整 Chain
          → analysis/edit-candidates/<id>.yaml + provenance(kind=EDIT)
          → 展示 deterministic diff
          → 用户首次保存意图
          → chain seal-persist
          → 展示 exact preview + planId
          → 用户明确确认当前 planId
          → chain persist(runId + planId only)
          → atomic 写入 .code-harness/chains/<id>.yaml
          ```

          `chain edit` 本身不得直接修改 `.code-harness/chains/**`。candidate / Certified Analysis / sealed plan / existing Project State 任一变化都使旧 planId 失效，必须重新 seal 并重新确认。

          ## Fail closed

          request 不在 same-run `requests/**`、ChangeAnalysis 未认证/已变化、operation 不在 allowlist、最终 node/order/symbol/path/role 没有 exact certified fact、dependency workspace 被当成写 authority、EDIT candidate 被篡改、或最终确认不是当前 exact planId 时，必须拒绝并产生 0 Project State writes。
          EOF

      - name: Patch orchestrator Task 5 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.code-harness/agents/orchestrator.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('version: 7', 'version: 8', 1)
          old = '| `harness chain refresh <id>` | Orchestrator → discover-chain → validate-chain | 否 |\n| `harness chain validate [id]` | Orchestrator → validate-chain | 否 |'
          new = '| `harness chain refresh <id>` | Orchestrator → discover-chain → validate-chain | 否 |\n| `harness chain edit <id|Controller|Controller.method>` | Orchestrator → edit-chain → validate-chain | 否 |\n| `harness chain validate [id]` | Orchestrator → validate-chain | 否 |'
          if old not in s: raise SystemExit('orchestrator route marker missing')
          s = s.replace(old, new, 1)
          old = 'harness chain refresh <id>\nharness chain validate [id]'
          new = 'harness chain refresh <id>\nharness chain edit <id|Controller|Controller.method>\nharness chain validate [id]'
          if old not in s: raise SystemExit('orchestrator intent marker missing')
          s = s.replace(old, new, 1)
          old = '不得新增 `chain accept/merge/split/edit/ignore` 用户命令；保存/更新 Chain 是上述流程中的用户确认动作，不是新的用户 CLI。'
          new = '除 Task 5 明确定义的 `harness chain edit <id|Controller|Controller.method>` 外，不得新增 `chain accept/merge/split/ignore` 等用户命令；保存/更新仍必须经过 Runtime candidate 与不可变 write plan。'
          if old not in s: raise SystemExit('old edit prohibition marker missing')
          s = s.replace(old, new, 1)
          section = '''\n\n### Semantic Chain Editing（1.5.3 Task 5）\n\n`harness chain edit <id|Controller|Controller.method>` 固定路由到 `edit-chain`。Orchestrator 只能在同 run `requests/**` 提交 `REPLACE_NODE / ADD_NODE / REMOVE_NODE / REORDER_NODE / RENAME_CHAIN / UPDATE_NOTES` proposal。\n\n```text\n现有 ACCEPTED Chain\n→ same-run Certified ChangeAnalysis\n→ Controlled Runtime chain edit\n→ analysis/edit-candidates/<id>.yaml + provenance(kind=EDIT)\n→ 展示 deterministic diff\n→ 用户首次保存意图\n→ chain seal-persist\n→ exact preview + planId\n→ 用户明确确认当前 planId\n→ chain persist(runId + planId only)\n→ atomic Project State write\n```\n\n`chain edit` 本身不得直接写 `.code-harness/chains/**`；不得改 EntryPoint；不得用 dependency workspace、类名后缀、basename、字符串包含或 fuzzy relation 获得写 authority。candidate/analysis/plan/existing Project State 任一变化都使旧 planId 失效。\n'''
          if '### Semantic Chain Editing（1.5.3 Task 5）' not in s:
              s += section
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch AGENTS Task 5 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.code-harness/AGENTS.md')
          s = p.read_text(encoding='utf-8')
          old = '- 1.5 Chain Management 只管理 Business Chain 的发现、读取、验证、刷新和用户确认后的 Project State 持久化；Task 3 不把 Chain 接入 Review/Test/Debug/Fix/Verify。'
          new = '- 1.5 Chain Management 管理 Business Chain 的发现、读取、验证、刷新和用户确认后的 Project State 持久化；Task 5 新增 `harness chain edit <id|Controller|Controller.method>` 语义编辑，但不得把 Chain 扩成 Review/Test/Debug/Fix/Verify 的写边界。\n- Task 5 的 edit 只允许六类 semantic operation；代码事实必须来自 same-run Certified ChangeAnalysis，Runtime 只输出 `analysis/edit-candidates/<id>.yaml` + provenance，edit 本身不得直接写 `.code-harness/chains/**`。'
          if old not in s: raise SystemExit('AGENTS chain marker missing')
          s = s.replace(old, new, 1)
          old = '`harness init`、`harness review`、`harness api-doc`、`harness chain list/show/discover/refresh/validate`、`harness upgrade` 不要求 READY。'
          new = '`harness init`、`harness review`、`harness api-doc`、`harness chain list/show/discover/refresh/edit/validate`、`harness upgrade` 不要求 READY。'
          if old not in s: raise SystemExit('AGENTS ready marker missing')
          s = s.replace(old, new, 1)
          old = 'codea-harness-tools chain refresh --input .code-harness/runs/<runId>/requests/<file>.json\ncodea-harness-tools chain seal-persist'
          new = 'codea-harness-tools chain refresh --input .code-harness/runs/<runId>/requests/<file>.json\ncodea-harness-tools chain edit --input .code-harness/runs/<runId>/requests/<file>.json\ncodea-harness-tools chain seal-persist'
          if old not in s: raise SystemExit('AGENTS runtime allowlist marker missing')
          s = s.replace(old, new, 1)
          section = '''\n\n### Chain edit authority（1.5.3 Task 5）\n\n`harness chain edit` 只能生成 same-run `requests/**` proposal。Controlled Runtime `codea-harness-tools chain edit --input ...` 基于 Certified ChangeAnalysis 验证后，只能生成 `analysis/edit-candidates/<id>.yaml` + `kind=EDIT` provenance；不得直接修改 `.code-harness/chains/**`。EDIT candidate 的最终保存继续走 `chain seal-persist → exact planId confirmation → chain persist`。\n'''
          if '### Chain edit authority（1.5.3 Task 5）' not in s:
              s += section
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch validate-chain Task 5 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.code-harness/skills/validate-chain/SKILL.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('version: 2', 'version: 3', 1)
          old = 'harness chain refresh <id>\nharness chain validate [id]'
          new = 'harness chain refresh <id>\nharness chain edit <id|Controller|Controller.method>\nharness chain validate [id]'
          if old not in s: raise SystemExit('validate-chain intent marker missing')
          s = s.replace(old, new, 1)
          section = '''\n\n## Semantic edit（1.5.3 Task 5）\n\n`harness chain edit <id|Controller|Controller.method>` 路由到 `edit-chain`。Runtime 对六类 operation 做最终完整 Chain 事实验证，成功后只输出：\n\n```text\n.code-harness/runs/<runId>/analysis/edit-candidates/<id>.yaml\n.code-harness/runs/<runId>/analysis/edit-candidates/<id>.cert.json  # kind=EDIT\n```\n\nEDIT candidate 不是 Project State，不得直接写 `.code-harness/chains/**`。保存继续固定复用 `chain seal-persist → exact planId → 用户确认当前 planId → chain persist`；候选、分析或 existing Project State 变化后旧 plan 必须失效。\n'''
          if '## Semantic edit（1.5.3 Task 5）' not in s:
              s += section
          p.write_text(s, encoding='utf-8')
          PY

      - name: Task 5 exact semantic Chain edit gate
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./internal/chain ./cmd/codea-harness-tools -run 'Test153.*Edit|Test153ChainEditAgentContract'

      - name: Full Go test
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./...

      - name: Go vet
        working-directory: .code-harness/tools-runtime
        run: go vet ./...

      - name: Commit Task 5 contract GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .code-harness/AGENTS.md .code-harness/agents/orchestrator.md .code-harness/skills/edit-chain/SKILL.md .code-harness/skills/validate-chain/SKILL.md
          git commit -m "docs: finalize task5 semantic chain edit contract"
          git push origin HEAD:docs/1.5.3-chain-reliability-editing-design
