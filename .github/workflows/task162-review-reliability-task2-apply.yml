name: task162-review-reliability-task2-apply

on:
  push:
    branches: [hotfix/1.6.2-review-reliability-task2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-minimal-green:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.6.2-review-reliability-task2
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Apply and verify Task 2 minimal GREEN
        shell: pwsh
        run: python ./.github/scripts/task162-review-reliability-task2-apply.py
      - name: Commit verified implementation
        shell: pwsh
        run: |
          git config user.name 'lingyi9909'
          git config user.email 'zhanhui9909@gmail.com'
          git add .code-harness/AGENTS.md .code-harness/tools/README.md .code-harness/agents/orchestrator.md .code-harness/tools-runtime/cmd/codea-dcep-tools/review_precision_command.go .code-harness/tools-runtime/cmd/codea-dcep-tools/review_reliability_task2_fresh_lifecycle_test.go
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix: implement Task 2 fresh review lifecycle'
            git push origin HEAD:hotfix/1.6.2-review-reliability-task2
          }
