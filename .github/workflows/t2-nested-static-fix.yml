name: t2-nested-static-fix

on:
  push:
    branches: [feature/1.7-integrated-t2]
    paths:
      - '.github/workflows/t2-nested-static-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add static member type AST patterns
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('.code-harness/tools-runtime/internal/nav/java_resolution_170.go')
          text = path.read_text(encoding='utf-8')
          old = 'mods := []string{"", "public ", "protected ", "private ", "abstract ", "public abstract ", "final ", "public final "}'
          new = 'mods := []string{"", "public ", "protected ", "private ", "abstract ", "public abstract ", "final ", "public final ", "static ", "public static ", "protected static ", "private static ", "static abstract ", "abstract static ", "static final ", "final static ", "public static final ", "protected static final ", "private static final "}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one javaAllTypePatterns170 modifier list, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\t2_nested_static_fix.py" -Encoding utf8
          python "$env:RUNNER_TEMP\t2_nested_static_fix.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gofmt -w .code-harness/tools-runtime/internal/nav/java_resolution_170.go
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit nested type fix
        shell: pwsh
        run: |
          git config user.name "codea-harness-ci"
          git config user.email "codea-harness-ci@users.noreply.github.com"
          git add .code-harness/tools-runtime/internal/nav/java_resolution_170.go
          git commit -m "fix(nav): index static nested Java types"
          git push origin HEAD:feature/1.7-integrated-t2
