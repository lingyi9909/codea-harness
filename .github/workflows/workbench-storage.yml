name: Workbench storage and Fastify contract
on:
  pull_request:
    paths: ['web-workbench/**', '.github/workflows/workbench-storage.yml']
permissions: { contents: read }
jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-workbench/package-lock.json
      - name: Install exact lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Static DDL contract test
        run: npm run test:schema-static
      - name: Git committed-scope tests
        run: npm run test:git
      - name: Immutable Git snapshots and API ownership
        run: npm run test:snapshot
      - name: Task idempotency and validation contract
        run: npm run test:tasks
      - name: Persisted event sequence and replay contract
        run: npm run test:events
      - name: T06 lease and stop regression
        run: npm run test:lease
      - name: T09 native interaction authorization regression
        run: npm run test:interactions
      - name: T08 scoped continuation tests
        run: npm run test:continuations
      - name: T01 regression
        run: npm test
