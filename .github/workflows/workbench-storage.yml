name: Workbench storage and Fastify contract
on:
  pull_request:
    paths: ['web-workbench/**', '.github/workflows/workbench-storage.yml']
permissions: { contents: read }
jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact initial backend dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lock for checked-in content
        run: |
          node -e "const fs=require('fs'); const b=fs.readFileSync('package-lock.json').toString('base64'); for(let i=0;i<b.length;i+=1200) console.log('LOCKCHUNK:'+b.slice(i,i+1200))"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Static DDL contract test
        run: npm run test:schema-static
      - name: T01 regression
        run: npm test
