func reviewContextArtifactPath170(runID, phase string) string {
	name := "review-call-context.json"
	if strings.EqualFold(strings.TrimSpace(phase), "RULES") { name = "review-rule-context.json" }
	return filepath.ToSlash(filepath.Join(".code-harness", "runs", runID, "analysis", name))
}

func loadFreshChangeSet170(runID string) (changeset.Snapshot, error) {
	path, _, err := reviewContextAuthority170(runID, "DISCOVERY")
	if err != nil { return changeset.Snapshot{}, err }
	raw, err := os.ReadFile(filepath.FromSlash(path))
	if err != nil { return changeset.Snapshot{}, fmt.Errorf("REVIEW_CONTEXT_CHANGESET_UNAVAILABLE: %w", err) }
	var snap changeset.Snapshot
	dec := json.NewDecoder(bytes.NewReader(raw)); dec.DisallowUnknownFields()
	if err := dec.Decode(&snap); err != nil { return snap, fmt.Errorf("REVIEW_CONTEXT_CHANGESET_INVALID: %w", err) }
	var extra any
	if err := dec.Decode(&extra); !errors.Is(err, io.EOF) { return snap, fmt.Errorf("REVIEW_CONTEXT_CHANGESET_INVALID: trailing JSON") }
	fresh, err := changeset.Compute(".", snap.RequestedBaseRef, snap.IncludeWorkingTree)
	if err != nil { return snap, fmt.Errorf("REVIEW_CONTEXT_CHANGESET_STALE: %w", err) }
	if fresh.SnapshotSHA256 != snap.SnapshotSHA256 || fresh.HeadCommit != snap.HeadCommit || fresh.MergeBase != snap.MergeBase || fresh.ResolvedBaseCommit != snap.ResolvedBaseCommit {
		return snap, fmt.Errorf("REVIEW_CONTEXT_CHANGESET_STALE: current ChangeSet identity changed")
	}
	return snap, nil
}

func currentJavaChangePaths170(snap changeset.Snapshot) []string {
	out := []string{}
	seen := map[string]bool{}
	for _, file := range snap.Files {
		p := filepath.ToSlash(filepath.Clean(file.Path))
		if !strings.HasSuffix(strings.ToLower(p), ".java") { continue }
		if _, err := os.Stat(filepath.FromSlash(p)); err != nil { continue }
		key := strings.ToLower(p); if seen[key] { continue }; seen[key]=true; out=append(out,p)
	}
	sort.Strings(out)
	return out
}

func resourcesForSeeds170(ctx context.Context, n nav.Navigator, seeds []nav.ReviewRef170) ([]nav.SourceRange170, error) {
	paths := []string{}; seenPath:=map[string]bool{}; wanted:=map[string]bool{}
	for _, seed := range seeds {
		key, err := nav.ReviewRefKey170(seed); if err != nil { return nil, err }; wanted[key]=true
		p:=filepath.ToSlash(seed.Path); if !seenPath[strings.ToLower(p)] { seenPath[strings.ToLower(p)]=true; paths=append(paths,p) }
	}
	refs, ranges, err := n.DiscoverMethods170(ctx, paths); if err != nil { return nil, err }
	out:=[]nav.SourceRange170{}
	for i, ref := range refs { key,_:=nav.ReviewRefKey170(ref); if wanted[key] && i<len(ranges) { out=append(out,ranges[i]) } }
	return out,nil
}

func runReviewContext170(args []string) error {
	fs := flag.NewFlagSet("review context", flag.ContinueOnError)
	inputPath := fs.String("input", "", "same-run review context request under .code-harness/runs/<runId>/requests")
	if err := fs.Parse(args); err != nil { return err }
	if fs.NArg() != 0 || strings.TrimSpace(*inputPath) == "" { return errors.New("review context requires --input") }
	runID, cleanInput, err := validateAnalysisRequestPath153(*inputPath)
	if err != nil { return errors.New("review context input must be under .code-harness/runs/<runId>/requests") }
	if err := verifyReviewTransportPath153(runID, cleanInput); err != nil { return err }
	raw, err := os.ReadFile(cleanInput); if err != nil { return fmt.Errorf("REVIEW_CONTEXT_REQUEST_READ_FAILED: %w", err) }
	req, err := decodeReviewContextRequest170(runID, raw); if err != nil { return err }
	state, err := reviewprogress.Read(".", runID); if err != nil { return err }
	if err := validateReviewContextProgress170(state, req.Phase); err != nil { return err }
	resolver, err := newRuntimeResolver170("."); if err != nil { return err }
	buildInput := reviewcontext.BuildInput170{RunID:runID, Phase:req.Phase, Budget:reviewcontext.DefaultBudget170()}
	var unitsPath, dispatchPath string

	if req.Phase == "DISCOVERY" {
		snap, err := loadFreshChangeSet170(runID); if err != nil { return err }
		methods, ranges, err := resolver.navigators["current"].DiscoverMethods170(context.Background(), currentJavaChangePaths170(snap)); if err != nil { return fmt.Errorf("REVIEW_CONTEXT_DISCOVERY_METHODS_FAILED: %w", err) }
		buildInput.Seeds = methods
		buildInput.Resources = ranges
	} else {
		discoveryPath := filepath.FromSlash(reviewContextArtifactPath170(runID,"DISCOVERY"))
		if _, err := os.Stat(discoveryPath); err != nil { return fmt.Errorf("REVIEW_CONTEXT_DISCOVERY_UNAVAILABLE: %w",err) }
		analysisPath, _, _ := reviewContextAuthority170(runID,"RULES")
		analysisValue, _, err := analysisruntime.LoadCertified(".", analysisPath); if err != nil { return fmt.Errorf("REVIEW_CONTEXT_ANALYSIS_UNAVAILABLE: %w",err) }
		buildInput.Seeds = seedsFromAnalysis170(analysisValue)
		buildInput.Resources, err = resourcesForSeeds170(context.Background(), resolver.navigators["current"], buildInput.Seeds); if err != nil { return fmt.Errorf("REVIEW_CONTEXT_RULE_RESOURCES_FAILED: %w",err) }
		unitsPath = filepath.ToSlash(filepath.Join(".code-harness","runs",runID,"analysis","review-units.json"))
		dispatchPath = filepath.ToSlash(filepath.Join(".code-harness","runs",runID,"analysis","rule-dispatch.json"))
		units, err := reviewunit.Load(reviewunit.BuildInput{RunID:runID,CertifiedRunID:runID,RepoRoot:"."}); if err != nil { return fmt.Errorf("REVIEW_CONTEXT_RULES_UNITS_UNAVAILABLE: %w",err) }
		dispatch, err := loadRuleDispatch170(dispatchPath); if err != nil { return err }
		if dispatch.RunID != runID || dispatch.ReviewUnitsSHA256 != units.SHA256 { return fmt.Errorf("REVIEW_CONTEXT_RULES_DISPATCH_STALE") }
		buildInput.Needs = needsFromDispatch170(units,dispatch,analysisValue)
	}

	built, err := reviewcontext.Build170(context.Background(), buildInput, resolver); if err != nil { return err }
	if err := reviewcontext.VerifyRelations170(context.Background(), built, buildInput, resolver); err != nil { return err }
	encoded, err := json.MarshalIndent(built,"","  "); if err != nil { return fmt.Errorf("REVIEW_CONTEXT_ENCODE_FAILED: %w",err) }; encoded=append(encoded,'\n')
	artifactPath := reviewContextArtifactPath170(runID,req.Phase)
	if err := atomicReviewWrite153(filepath.FromSlash(artifactPath),encoded); err != nil { return fmt.Errorf("REVIEW_CONTEXT_WRITE_FAILED: %w",err) }
	if req.Phase == "RULES" {
		if err := advanceReviewProgressStage164(runID,reviewprogress.StageReviewPlanning,unitsPath,dispatchPath,artifactPath); err != nil { return err }
	}
	return writeJSONAndStatus(map[string]any{"status":"READY","runId":runID,"phase":req.Phase,"artifactPath":artifactPath,"context":built},true)
}
'''
