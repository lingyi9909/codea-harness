name: task170-t5-green-patch
on:
  push:
    branches: [feature/1.7-integrated-t5]
    paths: ['.github/workflows/task170-t5-green-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/1.7-integrated-t5
      - name: Apply exact T5 wiring fixes
        shell: pwsh
        run: |
          $main = '.code-harness/tools-runtime/cmd/codea-dcep-tools/main.go'
          $text = Get-Content $main -Raw
          $old = 'case "review":`r`n`t`treturn runReview160(args[1:])'
          if (-not $text.Contains($old)) { $old = "case `"review`":`n`t`treturn runReview160(args[1:])" }
          if (-not $text.Contains($old)) { throw 'main.go review route pattern missing' }
          $new = $old.Replace('runReview160(args[1:])','runReview170(args[1:])')
          $text = $text.Replace($old,$new)
          [IO.File]::WriteAllText((Resolve-Path $main),$text,(New-Object Text.UTF8Encoding($false)))

          $cmd = '.code-harness/tools-runtime/cmd/codea-dcep-tools/review_context_command_170.go'
          $text = Get-Content $cmd -Raw
          $text = $text.Replace('"flag"'+"`r`n"+'`t"fmt"', '"flag"'+"`r`n"+'`t"fmt"'+"`r`n"+'`t"io"')
          if (-not $text.Contains('"io"')) { $text = $text.Replace('"flag"'+"`n"+'`t"fmt"', '"flag"'+"`n"+'`t"fmt"'+"`n"+'`t"io"') }
          $bad = 'if err := dec.Decode(&extra); !errors.Is(err, os.ErrClosed) && err == nil { return req, fmt.Errorf("REVIEW_CONTEXT_REQUEST_INVALID: trailing JSON") }'
          $good = 'if err := dec.Decode(&extra); !errors.Is(err, io.EOF) { return req, fmt.Errorf("REVIEW_CONTEXT_REQUEST_INVALID: trailing JSON") }'
          if (-not $text.Contains($bad)) { throw 'decode trailing pattern missing' }
          $text = $text.Replace($bad,$good)
          $marker = 'if _, err := os.Stat(reviewContextMarker170(runID)); err != nil { return fmt.Errorf("REVIEW_CONTEXT_RUN_NOT_170: %w", err) }'
          if (-not $text.Contains($marker)) { throw 'marker pattern missing' }
          $text = $text.Replace("`t$marker`r`n",'')
          $text = $text.Replace("`t$marker`n",'')
          $rulesNeedle = 'if req.Phase == "RULES" {'
          $rulesReplacement = @'
if req.Phase == "RULES" {
		discoveryPath := filepath.Join(".code-harness", "runs", runID, "analysis", "review-context-discovery.json")
		if _, err := os.Stat(discoveryPath); err != nil { return fmt.Errorf("REVIEW_CONTEXT_DISCOVERY_UNAVAILABLE: %w", err) }
'@
          $idx = $text.IndexOf($rulesNeedle)
          if ($idx -lt 0) { throw 'RULES branch pattern missing' }
          $text = $text.Substring(0,$idx) + $rulesReplacement + $text.Substring($idx + $rulesNeedle.Length)
          $text = [regex]::Replace($text,'(?ms)\nfunc reviewContextMarker170\(runID string\) string \{.*?\}\s*$','`n')
          [IO.File]::WriteAllText((Resolve-Path $cmd),$text,(New-Object Text.UTF8Encoding($false)))

          gofmt -w $main $cmd
          git diff --check
          git diff --exit-code -- .code-harness/tools-runtime/go.mod .code-harness/tools-runtime/go.sum
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'lingyi9909'
          git config user.email 'zhanhui9909@gmail.com'
          git add .code-harness/tools-runtime/cmd/codea-dcep-tools/main.go .code-harness/tools-runtime/cmd/codea-dcep-tools/review_context_command_170.go
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'T5 wiring patch produced no changes' }
          git commit -m 'feat(review): wire bounded context into review runtime'
          git push origin HEAD:feature/1.7-integrated-t5
