name: task170-t5-green-patch

on:
  push:
    branches: [feature/1.7-integrated-t5]
    paths:
      - '.github/workflows/task170-t5-green-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/1.7-integrated-t5
      - name: Apply relation isolation fix
        shell: pwsh
        run: |
          $path = '.code-harness/tools-runtime/internal/reviewcontext/build_170.go'
          $text = Get-Content $path -Raw
          $needle = "`taddRelation := func(rel nav.Relation170) error {`r`n"
          if (-not $text.Contains($needle)) { $needle = "`taddRelation := func(rel nav.Relation170) error {`n" }
          if (-not $text.Contains($needle)) { throw 'addRelation pattern missing' }
          $replacement = $needle + "`t`trel = cloneRelation170(rel)`r`n"
          $text = $text.Replace($needle, $replacement)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object Text.UTF8Encoding($false)))
          gofmt -w $path
          git diff --check
          git diff --exit-code -- .code-harness/tools-runtime/go.mod .code-harness/tools-runtime/go.sum
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name lingyi9909
          git config user.email zhanhui9909@gmail.com
          git add .code-harness/tools-runtime/internal/reviewcontext/build_170.go
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'relation isolation patch produced no changes' }
          git commit -m 'fix(review): clone resolved relations before publication'
          git push origin HEAD:feature/1.7-integrated-t5
