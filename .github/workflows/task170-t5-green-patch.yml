name: task170-t5-green-patch
on:
  push:
    branches: [feature/1.7-integrated-t5]
    paths:
      - '.github/workflows/task170-t5-green-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited T5 fixes
        run: python3 .code-harness/tools-runtime/task170_t5_patch.py
      - name: Format and commit
        run: |
          gofmt -w .code-harness/tools-runtime/internal/reviewcontext/build_170.go .code-harness/tools-runtime/internal/nav/context_discovery_170.go .code-harness/tools-runtime/cmd/codea-dcep-tools/review_context_command_170.go .code-harness/tools-runtime/cmd/codea-dcep-tools/review_context_entry_170.go
          git diff --check
          git config user.name codea-t5-ci
          git config user.email codea-t5-ci@example.invalid
          git add .code-harness/tools-runtime/internal/reviewcontext/build_170.go .code-harness/tools-runtime/internal/nav/context_discovery_170.go .code-harness/tools-runtime/cmd/codea-dcep-tools/review_context_command_170.go .code-harness/tools-runtime/cmd/codea-dcep-tools/review_context_entry_170.go .github/workflows/task170-t5-context.yml
          git commit -m 'fix(t5): derive bounded context from runtime authority'
          git push origin HEAD:feature/1.7-integrated-t5
