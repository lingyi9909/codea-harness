name: Workbench V1.1 multi-user
on:
  pull_request:
    paths: ['web-workbench/**', '.github/workflows/workbench-multi-user.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: harness_ci_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: web-workbench
    env:
      HARNESS_MYSQL_HOST: 127.0.0.1
      HARNESS_MYSQL_DATABASE: harness_ci_test
      HARNESS_MYSQL_USER: root
      HARNESS_MYSQL_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-workbench/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run web:typecheck && npm run web:build
      - run: node --test tests/api/*.test.ts tests/capabilities/*.test.ts tests/events/*.test.ts tests/git/*.test.ts tests/reports/*.test.ts tests/workers/*.test.ts tests/ui/chat-history-storage.test.ts tests/ui/progressive-messages.test.ts tests/ui/user-storage-auth.test.ts tests/mysql/migration.test.ts
      - run: node --test tests/mysql/multi-user.test.ts

      - run: npm run test:embed && npm run test:embed:mysql
      - run: npx playwright install --with-deps chromium
      - run: npm run test:embed:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-message-browser-${{ github.run_id }}
          path: web-workbench/screenshots/embedded-message-*.png
          if-no-files-found: ignore
