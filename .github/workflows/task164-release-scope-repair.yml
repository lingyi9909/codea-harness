name: 1.6.4 Release Scope Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task164-release-scope-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch 1.6.4 release scope and retire diagnostics
        shell: pwsh
        run: |
          $workflow = '.github/workflows/package-windows-x64.yml'
          $text = Get-Content $workflow -Raw
          $anchor = "            '.github/workflows/package-windows-x64.yml',"
          $add1 = "            '.code-harness/tools-runtime/cmd/codea-dcep-tools/workspace_task5_real_e2e_contract_152_test.go',"
          $add2 = "            '.code-harness/tools-runtime/internal/finding/task6_blocker_regression_test.go',"
          if (-not $text.Contains($anchor)) { throw 'release scope allowlist anchor missing' }
          if (-not $text.Contains($add1)) { $text = $text.Replace($anchor, "$anchor`n$add1") }
          if (-not $text.Contains($add2)) { $text = $text.Replace($add1, "$add1`n$add2") }
          [IO.File]::WriteAllText($workflow, $text, [Text.UTF8Encoding]::new($false))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $workflow
          if (Test-Path '.github/workflows/task164-package-go-diagnostic.yml') {
            git rm '.github/workflows/task164-package-go-diagnostic.yml'
          }
          git rm '.github/workflows/task164-release-scope-repair.yml'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix(1.6.4): align release regression scope'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
