name: task4-contract-sync-once

on:
  push:
    branches:
      - docs/1.5.3-chain-reliability-editing-design
    paths:
      - '.github/workflows/task4-contract-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/1.5.3-chain-reliability-editing-design
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
      - name: Patch Task 4 contracts and regression
        shell: python
        run: |
          from pathlib import Path
          import re

          orchestrator = Path('.code-harness/agents/orchestrator.md')
          text = orchestrator.read_text(encoding='utf-8')
          old = '''1.4 Review intent 规范：

          ```text
          harness review` → FULL
          harness review list` → LIST
          harness review <Class>` → TARGETED CLASS
          harness review <Class.method>` → TARGETED METHOD
          ```'''.replace('          ', '')
          new = '''1.5.3 Review intent 规范（覆盖 1.4 的 plain review 默认 FULL 语义）：

          ```text
          harness review                → Runtime ReviewOptions 决策（AUTO_FULL / AUTO_SINGLE / USER_SELECTION）
          harness review list           → LIST
          harness review <Class>        → direct TARGETED CLASS；自动包含该 Controller 全部机器要求分支，不展示 Controller/Chain 选择
          harness review <Class.method> → direct TARGETED METHOD；自动包含该 method 全部机器要求分支，不展示 Controller/Chain 选择
          ```

          只有 plain `harness review` 和显式 Service/其他下游 target 的多上游场景使用 ReviewOptions 选择。显式 Controller/Controller.method 不进入 2+ Chain 菜单；最终 direct TARGETED scope 仍必须通过 Runtime `reviewscope.Verify` 的 Controller 防漏链校验。'''.replace('          ', '')
          if old not in text:
              raise SystemExit('orchestrator review intent block not found')
          text = text.replace(old, new, 1)

          pattern = r"## `harness review`\n\n默认 `harness review` 始终是 FULL.*?\n用户可见顺序固定为："
          replacement = '''## `harness review`（1.5.3 ReviewOptions）

          plain `harness review` 不再预先固定为 FULL。它必须以同 run Certified ChangeAnalysis 和完整 EntrypointInventory 为事实基线，由 Controlled Runtime 决定本次 Review 模式：

          ```text
          1. 解析并校验 effectiveBaseRef
          2. Reviewer.analyze-change 形成 proposal → Runtime analysis certify → Certified ChangeAnalysis
          3. EntrypointInventory 必须 COMPLETE；不完整 → MANUAL_ACTION_REQUIRED / STOP
          4. Runtime `review options` 生成并持久化 Runtime-owned review-options.json
          5. decision=AUTO_FULL（0 valid Chains）→ 不询问用户，立即 `review select`：mode=FULL、无 selectionIds、current optionsHash
          6. decision=AUTO_SINGLE（1 valid Chain）→ 不询问用户，立即 `review select`：mode=TARGETED、exact autoSelectionIds、current optionsHash
          7. decision=USER_SELECTION（2+ valid Chains）→ 此时才展示一级选择：
             1) 全部评审
             2) 按业务链评审
             3) 仅查看调用链
             - 选择“全部评审” → `review select` mode=FULL、无 Chain IDs
             - 选择“按业务链评审” → 再展示 Runtime 生成的 C1..Cn，多选/编号 fallback；不得默认 ALL
             - 选择“仅查看调用链” → `review select` mode=LIST；不授权 Finding Review
             - 空选择/取消 → STOP
          8. Runtime `review select` 必须校验 current optionsHash、Runtime-bound selection IDs，并生成 FULL/TARGETED verified scope；stale/forged/invalid scope 全部 fail closed
          9. FULL 使用完整 Change Set machine coverage；TARGETED 使用 Runtime verified scopedFiles/selectedCallChains coverage
          10. Coverage 不完整或 Runtime validation 失败 → MANUAL_ACTION_REQUIRED review.md → STOP
          11. COMPLETE 后才允许 Reviewer.review-code；findings 为空 → PASSED，非空 → FAILED
          12. Controlled Runtime Renderer 生成唯一正式 `.code-harness/runs/<runId>/review.md`，最终摘要使用中文结果并展示 report path
          ```

          `AUTO_SINGLE` 是机器执行规则，不得出现“请选择唯一 Controller/Chain”的冗余提示。`USER_SELECTION` 只是说明存在 2+ valid Chain options；用户仍可明确选择 FULL 或 LIST，只有选择“按业务链评审”时才提交 TARGETED Runtime Chain IDs。

          显式 `harness review <Class>` / `<Class.method>` 不走上述 plain ReviewOptions 一级菜单，继续使用下文 direct TARGETED 流程，并由 Runtime 强制包含 Controller target 的全部 required confirmed branches。

          用户可见顺序固定为：'''.replace('          ', '')
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'orchestrator plain review section replacements={count}')
          orchestrator.write_text(text, encoding='utf-8')

          reviewer = Path('.code-harness/agents/reviewer.md')
          text = reviewer.read_text(encoding='utf-8')
          pattern = r"## 多调用链选择\n\n.*?\n## `harness review list`"
          replacement = '''## Review Selection Authority（1.5.3 Task 4）

          Reviewer 不拥有 Review mode/Chain option 的最终选择权。所有选择必须基于同 run Certified ChangeAnalysis，并服从 Controlled Runtime 生成的 `review-options.json` / `optionsHash` / `selectionId`：

          ```text
          plain harness review:
            0 valid Chains  → AUTO_FULL，直接 FULL，不询问
            1 valid Chain   → AUTO_SINGLE，直接 TARGETED，不询问
            2+ valid Chains → USER_SELECTION；先由用户选择“全部评审 / 按业务链评审 / 仅查看调用链”
          ```

          当用户在 2+ 场景选择“按业务链评审”时，Reviewer 只能展示 Runtime 的 C1..Cn，并把用户选中的 exact selectionIds + current optionsHash 交回 Runtime；不得自己构造 ID、根据名称 fuzzy 匹配、默认 ALL 或在 optionsHash 变化后复用旧选择。用户选择“全部评审”时由 Runtime 生成 FULL scope；选择“仅查看调用链”时不得调用 `review-code`。

          显式 target 固定如下：

          ```text
          Controller CLASS  → direct TARGETED；自动包含该 Controller 当前 Change Set 中全部 machine-required confirmed chains；不展示 Chain 菜单
          Controller METHOD → direct TARGETED；自动包含该 method 当前 Change Set 中全部 machine-required confirmed branches；不展示 Chain 菜单
          Service/其他下游 target → 1 条上游 Chain 自动继续；2+ 条上游 Chain 才进入 Runtime-bound 用户选择
          ```

          Controller direct TARGETED 最终必须经过 Runtime `reviewscope.Verify`；任何漏掉 required Controller branch 的 scope 都必须拒绝。Review Scope Selection 仍不等于 Test/Fix Approval。

          ## `harness review list`'''.replace('          ', '')
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'reviewer selection section replacements={count}')
          reviewer.write_text(text, encoding='utf-8')

          skill = Path('.code-harness/skills/analyze-change/SKILL.md')
          text = skill.read_text(encoding='utf-8')
          marker = '## E. TARGETED Review\n\n'
          override = '''### 1.5.3 Review Selection Authority Override

          本节旧的 1.4 target 解析规则继续定义“如何构造/验证 TARGETED scope”，但不再授权 Agent 自己决定 plain `harness review` 的模式。1.5.3 固定为：plain review 先 `analysis certify → completeness gate → review options`；0 Chain=AUTO_FULL、1 Chain=AUTO_SINGLE、2+ Chain=USER_SELECTION。只有 2+ 且用户选择“按业务链评审”时才展示 Runtime C1..Cn。显式 Controller/Controller.method 继续 direct TARGETED，自动包含全部 machine-required branches，不展示 Controller/Chain 选择；显式 Service/其他下游 target 仅在 2+ 上游 Chain 时选择。所有最终 TARGETED scope 仍必须通过 Runtime `reviewscope.Verify`，Agent 不得发明 selectionId/optionsHash 或绕过 Controller 防漏链。

          '''.replace('          ', '')
          if override.strip() not in text:
              if marker not in text:
                  raise SystemExit('analyze-change TARGETED marker not found')
              text = text.replace(marker, marker + override, 1)
          skill.write_text(text, encoding='utf-8')

          regression = Path('.code-harness/tools-runtime/internal/reviewscope/controller_branches_153_test.go')
          regression.write_text(r'''package reviewscope_test

          import (
          	"strings"
          	"testing"

          	"codea-harness-tools/internal/reviewscope"
          )

          func Test153ExplicitControllerMethodRequiresAllConfirmedBranches(t *testing.T) {
          	analysis := []byte(`{
          	  "changedFiles":[
          	    {"path":"src/main/java/OrderController.java"},
          	    {"path":"src/main/java/OrderService.java"},
          	    {"path":"src/main/java/AuditService.java"}
          	  ],
          	  "callChains":[
          	    {"entryPoint":"OrderController.approve","chain":["OrderController.approve","OrderService.approve"]},
          	    {"entryPoint":"OrderController.approve","chain":["OrderController.approve","AuditService.record"]}
          	  ],
          	  "symbolLocations":[
          	    {"symbol":"OrderController.approve","path":"src/main/java/OrderController.java","role":"Controller","source":"FIND_SYMBOL"},
          	    {"symbol":"OrderService.approve","path":"src/main/java/OrderService.java","role":"Service","source":"FIND_SYMBOL"},
          	    {"symbol":"AuditService.record","path":"src/main/java/AuditService.java","role":"Service","source":"FIND_SYMBOL"}
          	  ],
          	  "reviewCoverage":{
          	    "reviewedFiles":[
          	      {"path":"src/main/java/OrderController.java"},
          	      {"path":"src/main/java/OrderService.java"},
          	      {"path":"src/main/java/AuditService.java"}
          	    ],
          	    "unresolvedSymbols":[]
          	  }
          	}`)

          	partial := []byte(`{
          	  "mode":"TARGETED",
          	  "target":{"symbol":"OrderController.approve","kind":"METHOD"},
          	  "selectedCallChains":[
          	    {"entryPoint":"OrderController.approve","chain":["OrderController.approve","OrderService.approve"]}
          	  ],
          	  "scopedFiles":["src/main/java/OrderController.java","src/main/java/OrderService.java"]
          	}`)
          	if _, err := reviewscope.Verify(partial, analysis); err == nil || !strings.Contains(err.Error(), "must include all confirmed Controller chains") {
          		t.Fatalf("explicit Controller method must reject omitted branch, err=%v", err)
          	}

          	complete := []byte(`{
          	  "mode":"TARGETED",
          	  "target":{"symbol":"OrderController.approve","kind":"METHOD"},
          	  "selectedCallChains":[
          	    {"entryPoint":"OrderController.approve","chain":["OrderController.approve","OrderService.approve"]},
          	    {"entryPoint":"OrderController.approve","chain":["OrderController.approve","AuditService.record"]}
          	  ],
          	  "scopedFiles":["src/main/java/AuditService.java","src/main/java/OrderController.java","src/main/java/OrderService.java"]
          	}`)
          	if _, err := reviewscope.Verify(complete, analysis); err != nil {
          		t.Fatalf("explicit Controller method with every confirmed branch must pass: %v", err)
          	}
          }
          '''.replace('          ', ''), encoding='utf-8')
      - name: Task 4 exact gate
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./internal/reviewselection ./internal/reviewscope ./internal/coverage ./internal/chain ./internal/report ./cmd/codea-harness-tools -run 'Test153|Test152'
      - name: Full Go test
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./...
      - name: Go vet
        working-directory: .code-harness/tools-runtime
        run: go vet ./...
      - name: Commit Task 4 contract sync and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/task4-contract-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .code-harness/agents/orchestrator.md \
                  .code-harness/agents/reviewer.md \
                  .code-harness/skills/analyze-change/SKILL.md \
                  .code-harness/tools-runtime/internal/reviewscope/controller_branches_153_test.go \
                  .github/workflows/task4-contract-sync-once.yml
          git commit -m "docs: finalize task4 review selection contract"
          git push origin HEAD:docs/1.5.3-chain-reliability-editing-design
