name: task163-final-certification

on:
  push:
    branches: [release/1.6.3-final-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-certification:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify certification scripts parse
        shell: pwsh
        run: |
          foreach ($path in @(
            '.github/scripts/task163-final-certification.ps1',
            '.github/scripts/task163-release-package.ps1',
            '.github/scripts/task163-final-contract-regression.ps1'
          )) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -ne 0) { throw "PowerShell parse failed: $path $errors" }
          }
          python -m py_compile .github/scripts/task163-task3/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-review-reliability-task1/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-review-reliability-task2/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-hotfix-task3/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Detached HEAD and fail-closed scope regression
        shell: pwsh
        run: pwsh -NoProfile -File ./.github/scripts/task163-final-contract-regression.ps1

      - name: Replay final certification RED on rejected HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $evidence = Join-Path $root 'task163-final-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $baseline = 'd0d094cfaccc19bef19eaa03349db30500b98f8d'
          $redRoot = Join-Path $env:RUNNER_TEMP ('task163-final-red-' + [guid]::NewGuid().ToString('N'))
          git worktree add --detach $redRoot $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check out rejected certification HEAD' }
          try {
            Copy-Item '.github/scripts/task163-final-contract-regression.ps1' (Join-Path $redRoot '.github/scripts/task163-final-contract-regression.ps1') -Force
            $gateLog = Join-Path $evidence 'rejected-head-gate-red.log'
            & pwsh -NoProfile -File (Join-Path $redRoot '.github/scripts/task163-final-contract-regression.ps1') *> $gateLog
            $gateExit = $LASTEXITCODE
            $gateText = Get-Content $gateLog -Raw
            if ($gateExit -eq 0 -or $gateText -notmatch 'Silent successful command must PASS with an initialized log') {
              throw "Gate RED did not fail for the expected silent-log cause: $gateText"
            }
            Push-Location (Join-Path $redRoot '.code-harness/tools-runtime')
            try {
              $goLog = Join-Path $evidence 'rejected-head-go-red.log'
              & go test -count=1 -v ./cmd/codea-dcep-tools -run 'Test151ChainDiscoverBootstrapContractIsSelfContained|TestTask160ReleaseMetadataAndPackageWorkflow|Test152RealDualProjectWorkspaceBusiness' *> $goLog
              $goExit = $LASTEXITCODE
            } finally { Pop-Location }
            $goText = Get-Content $goLog -Raw
            if ($goExit -eq 0 -or $goText -match '\[build failed\]|undefined:|syntax error:') { throw 'Go RED was not a valid runtime assertion failure' }
            foreach ($test in @('Test151ChainDiscoverBootstrapContractIsSelfContained','TestTask160ReleaseMetadataAndPackageWorkflow','Test152RealDualProjectWorkspaceBusinessRegression','Test152RealDualProjectWorkspaceBusinessFailureRegressions')) {
              if (-not $goText.Contains("--- FAIL: $test")) { throw "Missing rejected-HEAD RED: $test" }
            }
            Write-Output "TASK163_FINAL_REJECTED_HEAD_RED PASS baseline=$baseline"
          } finally {
            git worktree remove --force $redRoot
            if ($LASTEXITCODE -ne 0) { throw 'Cannot remove disposable RED checkout' }
          }

      - name: Full final certification
        shell: pwsh
        run: pwsh -NoProfile -File ./.github/scripts/task163-final-certification.ps1

      - name: Upload complete certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task163-final-evidence-${{ github.sha }}
          path: |
            task163-final-evidence/**
            codea-harness-1.6.3-release-checklist.json
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload official release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.3-release-candidate-${{ github.sha }}
          path: |
            codea-harness-1.6.3-windows-x64-install.zip
            codea-harness-1.6.3-windows-x64-upgrade.zip
            codea-harness-1.6.3-release-checklist.json
            codea-dcep-tools-whitelist.txt
          if-no-files-found: error
