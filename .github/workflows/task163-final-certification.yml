name: task163-final-certification

on:
  push:
    branches: [release/1.6.3-final-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-certification:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify certification scripts parse
        shell: pwsh
        run: |
          foreach ($path in @(
            '.github/scripts/task163-final-certification.ps1',
            '.github/scripts/task163-release-package.ps1',
            '.github/scripts/task163-final-contract-regression.ps1'
          )) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -ne 0) { throw "PowerShell parse failed: $path $errors" }
          }
          python -m py_compile .github/scripts/task163-task3/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-review-reliability-task1/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-review-reliability-task2/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .github/scripts/task162-hotfix-task3/mock_openai_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Detached HEAD and fail-closed scope regression
        shell: pwsh
        run: pwsh -NoProfile -File ./.github/scripts/task163-final-contract-regression.ps1

      - name: Full final certification
        shell: pwsh
        run: pwsh -NoProfile -File ./.github/scripts/task163-final-certification.ps1

      - name: Upload complete certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task163-final-evidence-${{ github.sha }}
          path: |
            task163-final-evidence/**
            codea-harness-1.6.3-release-checklist.json
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload official release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.3-release-candidate-${{ github.sha }}
          path: |
            codea-harness-1.6.3-windows-x64-install.zip
            codea-harness-1.6.3-windows-x64-upgrade.zip
            codea-harness-1.6.3-release-checklist.json
            codea-dcep-tools-whitelist.txt
          if-no-files-found: error
