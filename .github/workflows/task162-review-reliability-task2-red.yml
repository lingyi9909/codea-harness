name: task162-review-reliability-task2-red

on:
  push:
    branches: [hotfix/1.6.2-review-reliability-task2-red]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: RED fresh Runtime lifecycle
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 -run 'Test162ReviewReliabilityTask2Begin' -v ./cmd/codea-dcep-tools

  contract-red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: RED active fresh lifecycle contract
        shell: pwsh
        run: ./.github/scripts/task162-review-reliability-task2-contract-regression.ps1
