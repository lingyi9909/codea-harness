name: Web Workbench UI compile
on:
  pull_request:
    paths: ['web-workbench/**', '.github/workflows/workbench-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-workbench/package-lock.json
      - name: Install from committed lock only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck contracts and adapter
        run: npm run typecheck
      - name: UI TypeScript typecheck
        run: npm run web:typecheck
      - name: Build production web assets
        run: npm run web:build
