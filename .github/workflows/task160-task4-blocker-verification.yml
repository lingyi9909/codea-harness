name: task160-task4-blocker-verification

on:
  pull_request:

jobs:
  task4-blocker-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: Task 4 GREEN gate
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./internal/finding ./internal/report ./cmd/codea-harness-tools ./internal/reviewscope ./internal/reviewselection
      - name: Full regression
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./...
      - name: Vet
        working-directory: .code-harness/tools-runtime
        run: go vet ./...
