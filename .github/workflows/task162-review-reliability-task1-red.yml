name: task162-review-reliability-task1-red

on:
  push:
    branches: [hotfix/1.6.2-review-reliability-task1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task1-red:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - name: Focused RED Go contract tests
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 -run 'Test162ReviewReliabilityTask1' -v ./cmd/codea-dcep-tools

      - name: Active review contract RED regression
        shell: pwsh
        run: ./.github/scripts/task162-review-reliability-task1-contract-regression.ps1

      - name: Exact-head marker
        if: always()
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "checkout is not exact head: $head" }
          Write-Output "TASK162_REVIEW_RELIABILITY_TASK1_RED_EXACT_HEAD PASS head=$head"
