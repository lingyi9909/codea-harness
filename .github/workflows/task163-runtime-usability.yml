name: task163-runtime-usability

on:
  push:
    branches:
      - hotfix/1.6.3-runtime-usability
  workflow_dispatch:

jobs:
  task163:
    runs-on: windows-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Task 1 workspace AST focused tests
        shell: pwsh
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 -run 'Test163Workspace' -v ./internal/nav

      - name: Task 1 workspace navigation regression
        shell: pwsh
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./internal/nav

      - name: Exact head verification
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "HEAD $actual != ${{ github.sha }}" }
          Write-Host "EXACT_HEAD $actual"
