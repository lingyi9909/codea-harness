name: T3 Package Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  reviewrun-t3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Bootstrap pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep-152.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep-152'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          New-Item -ItemType Directory -Force '.code-harness/bin' | Out-Null
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe' -Force
      - name: T3 finish regressions
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:CODEA_AST_GREP_TEST_PATH = (Resolve-Path '../bin/ast-grep.exe').Path
          go test -v -count=1 ./internal/reviewrun -run '^Test180Finish(RejectsReadOutsideSelectedScope|CompleteScopeRequiresSelectedReads|RejectsFindingWithoutEvidence|SelectedPartialScopeIsUndeterminedAndKeepsKnownGap)$'

  reviewrun-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Bootstrap pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep-152.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep-152'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          New-Item -ItemType Directory -Force '.code-harness/bin' | Out-Null
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe' -Force
      - name: Full reviewrun package
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:CODEA_AST_GREP_TEST_PATH = (Resolve-Path '../bin/ast-grep.exe').Path
          go test -v -count=1 ./internal/reviewrun

  cmd-entry:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: T3 entry contract tests
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -v -count=1 ./cmd/codea-dcep-tools -run '^(Test180PrimaryReview|Test180HostSmoke)'

  cmd-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Bootstrap pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep-152.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep-152'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          New-Item -ItemType Directory -Force '.code-harness/bin' | Out-Null
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe' -Force
      - name: Full command package
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:CODEA_AST_GREP_TEST_PATH = (Resolve-Path '../bin/ast-grep.exe').Path
          go test -v -count=1 ./cmd/codea-dcep-tools
