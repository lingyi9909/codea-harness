name: TEMP Codea Review 2.0 template final regression
on:
  push:
    branches: [feature/codea-review-2-0-usability]
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python --version
      - run: git --version
      - run: python tests/test_codea_review_2_0_hardening.py
