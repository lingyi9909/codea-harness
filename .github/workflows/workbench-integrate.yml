name: Workbench full-stack Windows integration
on:
  pull_request:
    paths: ['web-workbench/**', '.github/workflows/workbench-integrate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare combined lock (initial one-time integration)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit merged exact lock for repository commit
        run: |
          node -e "const fs=require('fs'); const b=fs.readFileSync('package-lock.json').toString('base64'); for(let i=0;i<b.length;i+=1200) console.log('LOCKCHUNK:'+b.slice(i,i+1200))"
      - name: Install complete dependency set
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Backend contracts and server compile
        run: npm run typecheck
      - name: Frontend TS compile
        run: npm run web:typecheck
      - name: Frontend production assets
        run: npm run web:build
      - name: T01 and backend regressions
        run: |
          npm test
          npm run test:git
          npm run test:snapshot
          npm run test:tasks
          npm run test:events
          npm run test:lease

  native-event-storage:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: harness_ci_test
          MYSQL_USER: harness_ci
          MYSQL_PASSWORD: disposable-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: web-workbench
    env:
      HARNESS_MYSQL_DATABASE: harness_ci_test
      HARNESS_MYSQL_USER: harness_ci
      HARNESS_MYSQL_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:mysql
      - run: npm run web:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
