name: Runtime Regression - Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.code-harness/tools-runtime/**'
      - '.github/workflows/runtime-regression-windows-x64.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.code-harness/tools-runtime/**'
      - '.github/workflows/runtime-regression-windows-x64.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - name: Review regression tests
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/reviewauthority ./internal/reviewselection

      - name: Go test
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./...

      - name: Go vet
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go vet ./...
