name: task170-t6-auto-chain
# Final exact-head certification after legacy contract compatibility repair.

on:
  workflow_dispatch:
  push:
    branches: [feature/1.7-integrated-t6]
    paths:
      - '.code-harness/tools-runtime/internal/reviewscope/**'
      - '.code-harness/tools-runtime/internal/chain/**'
      - '.code-harness/tools-runtime/cmd/codea-dcep-tools/**'
      - '.code-harness/skills/review-code/SKILL.md'
      - '.code-harness/agents/orchestrator.md'
      - '.code-harness/AGENTS.md'
      - 'README.md'
      - '.github/workflows/task170-t6-auto-chain.yml'

permissions:
  contents: read
  actions: read

jobs:
  t6-auto-chain:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize checkout line endings for deterministic Go format checks
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
          $status = @(git status --short)
          if ($status.Count -ne 0) { throw "canonical checkout normalization left dirty state: $($status -join '; ')" }
          Write-Output 'TASK170_T6_CANONICAL_LF PASS'
      - name: Verify no temporary T6 repair residue and aligned policy docs
        shell: pwsh
        run: |
          $forbidden = @(
            '.github/workflows/task170-t6-doc-format.yml',
            '.github/workflows/task170-t6-patch.yml',
            '.github/workflows/task170-t6-diagnose.yml',
            '.github/task170-t6-subsystem-diagnosis.txt',
            '.code-harness/tools-runtime/task170-t6-patch.py',
            '.code-harness/tools-runtime/task170-t6-debug.log'
          )
          $present = @($forbidden | Where-Object { Test-Path $_ })
          $dynamic = @(Get-ChildItem '.code-harness/tools-runtime' -File -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -like 'task170*t6*patch*' -or $_.Name -like 'task170*t6*debug*'
          } | ForEach-Object { $_.FullName })
          $present += $dynamic
          if ($present.Count -ne 0) { throw "temporary T6 residue remains: $($present -join '; ')" }
          $orchestrator = Get-Content '.code-harness/agents/orchestrator.md' -Raw
          $skill = Get-Content '.code-harness/skills/review-code/SKILL.md' -Raw
          $agents = Get-Content '.code-harness/AGENTS.md' -Raw
          $readme = Get-Content 'README.md' -Raw
          if (-not $orchestrator.Contains('FULL / TARGETED 固定流程（1.7 T6 覆盖旧 STALE 交互）')) { throw 'T6 orchestrator policy missing' }
          if ($orchestrator.Contains('### STALE 决策门禁')) { throw 'obsolete Review stale-maintenance prompt remains authoritative' }
          if (-not $skill.Contains('### 1.7 T6 AUTO_TEMPORARY Chain 约束')) { throw 'T6 review-code policy missing' }
          if (-not $agents.Contains('## 1.7 T6 Review 自动临时 Chain')) { throw 'T6 AGENTS policy missing' }
          if (-not $readme.Contains('## 1.7.0（Task 6：Review 自动临时 Chain）')) { throw 'T6 README policy missing' }
          Write-Output 'TASK170_T6_TEMP_RESIDUE_AND_DOCS PASS'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.10'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Bootstrap existing locked modules for hosted CI
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env:
          GOTOOLCHAIN: local
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git restore --source=HEAD -- go.mod go.sum
          $moduleStatus = @(git status --short -- go.mod go.sum)
          if ($moduleStatus.Count -ne 0) { throw "module bootstrap left locked files dirty: $($moduleStatus -join '; ')" }
          Write-Output 'TASK170_T6_MODULE_BOOTSTRAP PASS'
      - name: Verify accepted T5 lineage and clean baseline
        shell: pwsh
        run: |
          git merge-base --is-ancestor 8abefb2973cc3e989c3f324fe8bb8076467a1ee8 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'T6 branch is not based on accepted T5 exact HEAD' }
          $status = @(git status --short)
          if ($status.Count -ne 0) { throw "baseline working tree is not clean: $($status -join '; ')" }
          Write-Output "TASK170_T6_BASELINE PASS head=$((git rev-parse HEAD).Trim()) status=clean"
      - name: Download accepted 1.6.4.final release candidate
        uses: actions/download-artifact@v4
        with:
          name: codea-harness-1.6.4-release-candidate-439d9618591657b80d4670f1d9f3b5909d378447
          path: ${{ runner.temp }}/task170-accepted-rc
          github-token: ${{ github.token }}
          repository: lingyi9909/codea-harness
          run-id: 34561342970
      - name: Provision approved pinned ast-grep test fixture
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'task170-accepted-rc'
          $installZip = Join-Path $artifactRoot 'codea-harness-1.6.4-windows-x64-install.zip'
          if (-not (Test-Path $installZip -PathType Leaf)) { throw "accepted install ZIP missing: $installZip" }
          $stage = Join-Path $env:RUNNER_TEMP 'task170-approved-install'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          Expand-Archive -Path $installZip -DestinationPath $stage -Force
          $manifestPath = Join-Path $stage '.code-harness/RELEASE-MANIFEST.json'
          $source = Join-Path $stage '.code-harness/bin/ast-grep.exe'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ([string]$manifest.buildCommit -cne '439d9618591657b80d4670f1d9f3b5909d378447') { throw 'accepted RC build commit mismatch' }
          $actualHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne [string]$manifest.astGrepSha256) { throw 'accepted ast-grep hash mismatch' }
          if ($actualHash -cne '61bb00d4dbac70f9c61748bf48431f6d42d557e321fc02839c7192eb237d11e4') { throw 'pinned ast-grep hash changed' }
          $target = Join-Path $env:GITHUB_WORKSPACE '.code-harness/bin/ast-grep.exe'
          New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
          Copy-Item -LiteralPath $source -Destination $target -Force
          "CODEA_AST_GREP=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "TASK170_T6_APPROVED_AST_GREP PASS sha256=$actualHash"
      - name: T6 targeted auto-chain gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env: { GOTOOLCHAIN: local, GOPROXY: off, GOSUMDB: off }
        run: go test ./internal/reviewscope ./cmd/codea-dcep-tools -run Test170AutoChain -count=1
      - name: T6 subsystem regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env: { GOTOOLCHAIN: local, GOPROXY: off, GOSUMDB: off }
        run: go test ./internal/reviewscope ./internal/chain ./cmd/codea-dcep-tools -count=1
      - name: Verify zero dependency drift
        shell: pwsh
        run: |
          git diff --exit-code -- .code-harness/tools-runtime/go.mod .code-harness/tools-runtime/go.sum
          if ($LASTEXITCODE -ne 0) { throw 'offline T6 gates changed go.mod/go.sum' }
          git diff --exit-code 8abefb2973cc3e989c3f324fe8bb8076467a1ee8 HEAD -- .code-harness/tools-runtime/go.mod .code-harness/tools-runtime/go.sum
          if ($LASTEXITCODE -ne 0) { throw 'T6 committed changes to go.mod/go.sum' }
          Write-Output 'TASK170_T6_DEPENDENCY_DRIFT PASS working-tree=clean committed=unchanged'
      - name: Go format guard
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $files = @(git diff --name-only 8abefb2973cc3e989c3f324fe8bb8076467a1ee8 HEAD -- '*.go' | ForEach-Object { $_ -replace '^.code-harness/tools-runtime/', '' })
          if ($files.Count -gt 0) {
            $bad = @(gofmt -l $files)
            if ($bad.Count -gt 0) { throw "gofmt required: $($bad -join '; ')" }
          }
          Write-Output 'TASK170_T6_GOFMT PASS'
      - name: Full Go regression
        id: full-regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env: { GOTOOLCHAIN: local, GOPROXY: off, GOSUMDB: off }
        run: |
          go test ./... -count=1 2>&1 | Tee-Object -FilePath task170-t6-full-go-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload full regression evidence
        if: always() && steps.full-regression.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: task170-t6-full-go-regression
          path: .code-harness/tools-runtime/task170-t6-full-go-regression.log
          if-no-files-found: error
      - name: Go vet
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env: { GOTOOLCHAIN: local, GOPROXY: off, GOSUMDB: off }
        run: go vet ./...
