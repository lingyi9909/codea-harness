name: TEMP Codea Review 2.0 hardening regression
on:
  push:
    branches: [feature/codea-review-2-0-hardening]
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Display versions
        run: |
          python --version
          git --version
      - name: Run deterministic Git and permission tests
        run: python tests/test_codea_review_2_0_hardening.py
