name: task160-task3-verification

on:
  pull_request:
    branches: [develop]
    paths:
      - '.code-harness/**'
      - '.github/workflows/task160-task3-verification.yml'

permissions:
  contents: write

jobs:
  task3-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task160-task3-finding-proposal-verify
          fetch-depth: 0
      - name: Bind Reviewer to Finding Proposal authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $skillPath = '.code-harness/skills/review-code/SKILL.md'
          $agentPath = '.code-harness/agents/reviewer.md'
          $skill = Get-Content -Raw -Encoding UTF8 $skillPath
          $agent = Get-Content -Raw -Encoding UTF8 $agentPath

          $skill = $skill.Replace('description: 在 FULL 或 Runtime 已验证的 TARGETED Review Scope 完整后执行 Finding Review；Java/Mapper/YML 生产变更按证据评审，测试代码只执行 Test Validity Gate。', 'description: 在 FULL 或 Runtime 已验证的 TARGETED Review Scope 完整后执行 Finding Proposal Review；Java/Mapper/YML 生产变更按证据评审，测试代码只执行 Test Validity Gate。')
          $skill = $skill.Replace('version: 4', 'version: 5')
          $skill = $skill.Replace('output_schema: .code-harness/contracts/review-output.schema.json', 'output_schema: .code-harness/contracts/finding-proposals.schema.json')
          if (-not $skill.Contains('## 1.6 Finding Proposal Authority')) {
            $skill += @'

## 1.6 Finding Proposal Authority

本节优先于本文中沿用的“Finding”术语：

```text
Reviewer 只提出 Finding Proposal。
Proposal 不等于正式 Finding。
只有后续 Runtime certification 产生的 Certified Finding 才能进入最终 Review Report。
```

Reviewer 输出固定写入 `.code-harness/runs/<runId>/requests/finding-proposals.json`，并必须通过 `.code-harness/contracts/finding-proposals.schema.json`。每条 Proposal 必须绑定当前 Runtime `reviewUnitId` 与该 Unit 已分发的 `ruleId`，anchor/evidence 只能引用当前 ReviewUnit 允许的事实；不得创造 scope 外 path/symbol/line，也不得把 confidence 或 Proposal 本身表述成已经由 Runtime 证明成立的正式 Finding。

Controlled Runtime 必须对同 run 的 ReviewUnit、RuleDispatch、Certified ChangeAnalysis、源码与 changed hunk 独立验证 rule/scope/path/symbol/line/range/evidence/introducedByChange；任一验证失败都必须拒绝 Proposal。

本文既有 Java、Mapper.xml、YML 与 Test Validity Gate 的评审边界保持不变；这些边界现在约束“允许提出什么 Proposal”，而不是赋予 Agent 正式 Finding 权威。
'@
          }

          $agent = $agent.Replace('description: 基于完整 Git Change Set 建立可验证调用链与资源关系，并按 FULL 或 TARGETED Scope 完成只读评审；只有机器 Coverage 完整后才输出有证据支持的 Finding。', 'description: 基于完整 Git Change Set 建立可验证调用链与资源关系，并按 FULL 或 TARGETED Scope 完成只读评审；只有机器 Coverage 完整后才输出有证据支持的 Finding Proposal。')
          $agent = $agent.Replace('version: 6', 'version: 7')
          if (-not $agent.Contains('## 1.6 Finding Proposal Authority')) {
            $agent += @'

## 1.6 Finding Proposal Authority

1.6 Task 3 起，Reviewer 不拥有正式 Finding 权威，`review-code` 只能形成 Finding Proposal：

```text
Reviewer 只提出 Finding Proposal。
Proposal 不等于正式 Finding。
只有后续 Runtime certification 产生的 Certified Finding 才能进入最终 Review Report。
```

Reviewer 必须消费 Runtime-owned ReviewUnit 与 RuleDispatch，并把候选问题写到 `.code-harness/runs/<runId>/requests/finding-proposals.json`。Proposal 中的 `reviewUnitId / ruleId / anchor / evidenceRefs` 只能引用当前 Runtime authority；Reviewer 不得自行认证 line、symbol、scope、evidence 或 introducedByChange，也不得把类名后缀、模糊行号、dependency workspace 或 confidence 当成证明。

Controlled Runtime 必须独立验证 rule/scope/path/symbol/line/range/evidence/introducedByChange。验证失败的 Proposal 必须拒绝；Proposal 验证通过也仍不等于正式 Finding。

本文前述 Review Report transport 是后续 Runtime Certified Finding 的展示边界，不授权 Reviewer 直接构造正式 `findings[]`。Java、Mapper.xml、YML、TEST_VALIDITY 与 workspace dependency 的既有边界全部保持不变。
'@
          }

          Set-Content -Path $skillPath -Value $skill -Encoding UTF8 -NoNewline
          Set-Content -Path $agentPath -Value $agent -Encoding UTF8 -NoNewline
          git config user.name 'lingyi9909'
          git config user.email 'zhanhui9909@gmail.com'
          git add -- $skillPath $agentPath
          if (-not (git diff --cached --quiet)) {
            git commit -m 'docs: bind reviewer to finding proposals'
            git push origin HEAD:task160-task3-finding-proposal-verify
          }
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: Task 3 finding gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/finding
      - name: Task 3 exact integration gate
        if: success()
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/finding ./internal/reviewunit ./internal/reviewrules ./cmd/codea-harness-tools
      - name: Full regression
        if: success()
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./...
      - name: Vet
        if: success()
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go vet ./...
