name: t3-dtd-fix

on:
  push:
    branches: [feature/1.7-integrated-t3]
    paths:
      - '.github/workflows/t3-dtd-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow inert canonical MyBatis mapper DTD
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('.code-harness/tools-runtime/internal/reviewcontext/mybatis_170.go')
          text = path.read_text(encoding='utf-8')
          old = '''\t\tcase xml.Directive:\n\t\t\tif strings.HasPrefix(strings.ToUpper(strings.TrimSpace(string(value))), "DOCTYPE") {\n\t\t\t\treturn nil, fmt.Errorf("MYBATIS_XML_DTD_UNSUPPORTED: %s", path)\n\t\t\t}\n'''
          new = '''\t\tcase xml.Directive:\n\t\t\tdirective := strings.TrimSpace(string(value))\n\t\t\tif strings.HasPrefix(strings.ToUpper(directive), "DOCTYPE") && !myBatisKnownMapperDTD170(directive) {\n\t\t\t\treturn nil, fmt.Errorf("MYBATIS_XML_DTD_UNSUPPORTED: %s", path)\n\t\t\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'DTD directive block match count={text.count(old)}')
          text = text.replace(old, new, 1)
          marker = 'func myBatisNodeTag170(tag string) bool {'
          helper = '''func myBatisKnownMapperDTD170(directive string) bool {\n\tnormalized := strings.Join(strings.Fields(directive), " ")\n\treturn strings.Contains(normalized, `-//mybatis.org//DTD Mapper 3.0//EN`) &&\n\t\t(strings.Contains(normalized, `http://mybatis.org/dtd/mybatis-3-mapper.dtd`) ||\n\t\t\tstrings.Contains(normalized, `https://mybatis.org/dtd/mybatis-3-mapper.dtd`))\n}\n\n'''
          if marker not in text:
              raise SystemExit('helper insertion marker missing')
          if 'func myBatisKnownMapperDTD170(' in text:
              raise SystemExit('DTD helper already exists')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\t3_dtd_fix.py" -Encoding utf8
          python "$env:RUNNER_TEMP\t3_dtd_fix.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gofmt -w .code-harness/tools-runtime/internal/reviewcontext/mybatis_170.go
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit DTD fix
        shell: pwsh
        run: |
          git config user.name "codea-harness-ci"
          git config user.email "codea-harness-ci@users.noreply.github.com"
          git add .code-harness/tools-runtime/internal/reviewcontext/mybatis_170.go
          git commit -m "fix(review): allow inert canonical MyBatis mapper DTD"
          git push origin HEAD:feature/1.7-integrated-t3
