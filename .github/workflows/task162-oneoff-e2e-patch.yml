name: task162-oneoff-e2e-patch

on:
  push:
    branches: [hotfix/1.6.2-task1-maven-multimodule]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.6.2-task1-maven-multimodule
          fetch-depth: 0

      - name: Patch E2E fixture only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/scripts/task162-real-multimodule-regression.ps1'
          $text = [IO.File]::ReadAllText($path)
          $oldCaller = @'
        $callers = Invoke-Runtime nav find-callers --symbol OrderService.createOrder --scope order-api/src/main/java
        if ($callers -notmatch 'order-api[/\\]src[/\\]main[/\\]java') { throw "module caller navigation lost path prefix: $callers" }
        Write-Output 'TASK162_CODE_NAVIGATION PASS'
'@
          $newCaller = @'
        $callers = Invoke-Runtime nav find-callers --symbol OrderService.createOrder --scope order-api/src/main/java
        if ($callers -notmatch 'order-api[/\\]src[/\\]main[/\\]java') { throw "module Service caller navigation lost path prefix: $callers" }
        $mapperCallers = Invoke-Runtime nav find-callers --symbol OrderMapper.insertOrder --scope order-service/src/main/java
        if ($mapperCallers -notmatch 'order-service[/\\]src[/\\]main[/\\]java') { throw "module Mapper caller navigation lost path prefix: $mapperCallers" }
        Write-Output 'TASK162_CODE_NAVIGATION PASS'
'@
          if (-not $text.Contains($oldCaller)) { throw 'caller patch target not found exactly once' }
          $text = $text.Replace($oldCaller, $newCaller)
          $oldJson = "Write-Utf8NoBom (Join-Path `$requestDir 'finding-proposals.json') (`$proposal | ConvertTo-Json -Depth 20)"
          $newJson = "Write-Utf8NoBom (Join-Path `$requestDir 'finding-proposals.json') (ConvertTo-Json -InputObject `$proposal -Depth 20)"
          if (-not $text.Contains($oldJson)) { throw 'proposal serialization patch target not found' }
          $text = $text.Replace($oldJson, $newJson)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Commit exact fixture patch
        shell: pwsh
        run: |
          git diff --check
          git diff -- .github/scripts/task162-real-multimodule-regression.ps1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/task162-real-multimodule-regression.ps1
          git commit -m 'test(task162): fix real multi-module finding fixture'
          git push origin HEAD:hotfix/1.6.2-task1-maven-multimodule
