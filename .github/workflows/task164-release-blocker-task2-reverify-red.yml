name: task164-release-blocker-task2-reverify

on:
  push:
    branches: [release/1.6.4-final-certification]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reverify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install workflow contract parser
        shell: pwsh
        run: |
          python -m pip install PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Missing or bypassed product gates must fail reverify
        id: gate_contract
        shell: pwsh
        run: |
          python ./.github/scripts/task164-release-blocker-task2-gate-contract.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Accepted Task 1 ancestry
        shell: pwsh
        run: |
          git merge-base --is-ancestor 51ad4cbc32008e388fc7a2564dbd5e518d04d9ae HEAD
          if ($LASTEXITCODE -ne 0) { throw 'not based on accepted Task 1' }

      - name: Build current official 1.6.4 release package
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Task 2 product contract reverify
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-blocker-task2-reverify-red.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fresh official Reviewer Host upgrade transaction tests
        shell: pwsh
        working-directory: .code-harness/tools-runtime
        run: |
          go test -count=1 ./internal/upgrade -run 'Test164OfficialUpgrade(InstallsReviewerHostTransactionally|RejectsUnknownReviewerHostConflictBeforeFrameworkWrite|RollsBackFrameworkAndPartialReviewerHostCommit)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK164_TASK2_REVERIFY_UPGRADE_TRANSACTION PASS'

      - name: Exact HEAD reverify
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "exact HEAD mismatch: $head != ${{ github.sha }}" }
          Write-Output "TASK164_TASK2_REVERIFY_EXACT_HEAD PASS head=$head"

  # Reverify must run the products at this exact commit, not infer success from
  # source markers or an older successful Actions run.
  product-gates:
    needs: reverify
    uses: ./.github/workflows/task164-release-blocker-task2.yml
