name: t2-exactness-fix-apply

on:
  push:
    branches: [feature/1.7-integrated-t2]
    paths:
      - '.github/workflows/t2-exactness-fix-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed T2 blocker patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          java_path = Path('.code-harness/tools-runtime/internal/nav/java_resolution_170.go')
          java = java_path.read_text(encoding='utf-8')

          java = replace_once(
              java,
              '''\t\tidx.SimpleFQCN[name] = appendUniqueString170(idx.SimpleFQCN[name], fqcn)\n\t}\n\n\tmethodRaw, err := n.runWorkspaceRawTargets(ctx, files, allMethodPatterns()...)''',
              '''\t\tidx.SimpleFQCN[name] = appendUniqueString170(idx.SimpleFQCN[name], fqcn)\n\t}\n\n\t// Rebuild identities only after every AST type is known so nested types\n\t// retain their enclosing owner instead of collapsing by simple name.\n\tidx.finalizeTypeIdentities170()\n\n\tmethodRaw, err := n.runWorkspaceRawTargets(ctx, files, allMethodPatterns()...)''',
              'finalize nested type identities',
          )

          java = replace_once(
              java,
              '''func (idx *javaIndex170) resolveTypeName170(owner *javaType170, declared string) string {\n\tdeclared = normalizeJavaType170(declared)\n\tbase := strings.TrimSuffix(declared, "[]")\n\tif base == "" {\n\t\treturn ""\n\t}\n\tif strings.Contains(base, ".") {\n\t\treturn base\n\t}\n\tif owner != nil {\n\t\tif fqcn := owner.Imports[base]; fqcn != "" {\n\t\t\treturn fqcn\n\t\t}\n\t\tif owner.Package != "" {\n\t\t\tcandidate := owner.Package + "." + base\n\t\t\tif idx.ByFQCN[candidate] != nil {\n\t\t\t\treturn candidate\n\t\t\t}\n\t\t}\n\t}\n\tif matches := idx.SimpleFQCN[base]; len(matches) == 1 {\n\t\treturn matches[0]\n\t}\n\tswitch base {\n\tcase "String", "Long", "Integer", "Boolean", "Double", "Float", "Short", "Byte", "Character", "Object":\n\t\treturn "java.lang." + base\n\t}\n\treturn base\n}''',
              '''func (idx *javaIndex170) resolveTypeName170(owner *javaType170, declared string) string {\n\treturn idx.resolveTypeNameExact170(owner, declared)\n}''',
              'route type names through nested-aware resolver',
          )

          java = replace_once(
              java,
              '''\t\townerFQCN, receiverReason := idx.resolveReceiver170(method, receiver)''',
              '''\t\townerFQCN, receiverReason := idx.resolveReceiverAt170(method, receiver, raw)''',
              'bind receiver resolution to callsite',
          )

          java = replace_once(
              java,
              '''\t\tselected, ambiguous := idx.selectOverload170(method, candidates, args)\n\t\tif selected != nil && !ambiguous {\n\t\t\tresolved.Relation.Resolution = "EXACT"\n\t\t\tresolved.Relation.Targets = []ReviewRef170{idx.methodRef170(selected, fromRef.Workspace, fromRef.Side)}\n\t\t} else {\n\t\t\tresolved.Relation.Resolution = "AMBIGUOUS"\n\t\t\tresolved.Relation.Reason = "JAVA_OVERLOAD_UNRESOLVED: multiple compatible overloads"\n\t\t\tfor _, candidate := range candidates {\n\t\t\t\tif len(candidate.Params) == len(args) {\n\t\t\t\t\tresolved.Relation.Targets = append(resolved.Relation.Targets, idx.methodRef170(candidate, fromRef.Workspace, fromRef.Side))\n\t\t\t\t}\n\t\t\t}\n\t\t\tif len(resolved.Relation.Targets) == 0 {\n\t\t\t\tfor _, candidate := range candidates {\n\t\t\t\t\tresolved.Relation.Targets = append(resolved.Relation.Targets, idx.methodRef170(candidate, fromRef.Workspace, fromRef.Side))\n\t\t\t\t}\n\t\t\t}\n\t\t}''',
              '''\t\tselection := idx.selectOverloadAt170(method, candidates, args, raw)\n\t\tswitch selection.Resolution {\n\t\tcase "EXACT":\n\t\t\tresolved.Relation.Resolution = "EXACT"\n\t\t\tresolved.Relation.Targets = []ReviewRef170{idx.methodRef170(selection.Method, fromRef.Workspace, fromRef.Side)}\n\t\tcase "AMBIGUOUS":\n\t\t\tresolved.Relation.Resolution = "AMBIGUOUS"\n\t\t\tresolved.Relation.Reason = selection.Reason\n\t\t\tfor _, candidate := range selection.Candidates {\n\t\t\t\tresolved.Relation.Targets = append(resolved.Relation.Targets, idx.methodRef170(candidate, fromRef.Workspace, fromRef.Side))\n\t\t\t}\n\t\tdefault:\n\t\t\tresolved.Relation.Resolution = "UNRESOLVED"\n\t\t\tresolved.Relation.Reason = selection.Reason\n\t\t\tif resolved.Relation.Reason == "" {\n\t\t\t\tresolved.Relation.Reason = "JAVA_OVERLOAD_UNRESOLVED: overload could not be proven"\n\t\t\t}\n\t\t\tfor _, candidate := range selection.Candidates {\n\t\t\t\tresolved.Relation.Targets = append(resolved.Relation.Targets, idx.methodRef170(candidate, fromRef.Workspace, fromRef.Side))\n\t\t\t}\n\t\t}''',
              'require supported argument typing before EXACT overload',
          )

          java_path.write_text(java, encoding='utf-8')

          spring_path = Path('.code-harness/tools-runtime/internal/nav/spring_resolution_170.go')
          spring = spring_path.read_text(encoding='utf-8')
          spring = replace_once(
              spring,
              '''\tfor _, method := range idx.Methods {\n\t\tanns := annotations170(method.Text)\n\t\tif !springHasRecognizedAnnotation170(method.Owner.Imports, anns, "Bean") {\n\t\t\tcontinue\n\t\t}\n\t\treturnType := idx.resolveTypeName170(method.Owner, method.ReturnType)''',
              '''\tfor _, method := range idx.Methods {\n\t\tanns := annotations170(method.Text)\n\t\tif !springHasRecognizedAnnotation170(method.Owner.Imports, anns, "Bean") {\n\t\t\tcontinue\n\t\t}\n\t\townerRegistered, ownerConditional := springBeanOwnerRegistered170(method.Owner)\n\t\tif !ownerRegistered {\n\t\t\tcontinue\n\t\t}\n\t\treturnType := idx.resolveTypeName170(method.Owner, method.ReturnType)''',
              'require registered owner for Bean methods',
          )
          spring = replace_once(
              spring,
              '''\t\t\tConditional: springHasCondition170(method.Owner.Imports, anns) || springHasCondition170(method.Owner.Imports, springTypeAnnotations170(idx, method.Owner.FQCN)),''',
              '''\t\t\tConditional: springHasCondition170(method.Owner.Imports, anns) || ownerConditional,''',
              'carry owner registration condition',
          )
          spring_path.write_text(spring, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\apply_t2_fix.py" -Encoding utf8
          python "$env:RUNNER_TEMP\apply_t2_fix.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- .code-harness/tools-runtime/internal/nav/java_resolution_170.go .code-harness/tools-runtime/internal/nav/spring_resolution_170.go
      - name: Commit blocker fix
        shell: pwsh
        run: |
          git config user.name "codea-harness-ci"
          git config user.email "codea-harness-ci@users.noreply.github.com"
          git add .code-harness/tools-runtime/internal/nav/java_resolution_170.go .code-harness/tools-runtime/internal/nav/spring_resolution_170.go
          if ((git diff --cached --name-only).Count -eq 0) { throw 'T2 blocker patch produced no changes' }
          git commit -m "fix(nav): close T2 exactness blockers"
          git push origin HEAD:feature/1.7-integrated-t2
