name: task160-task2-yamlconfig-verification

on:
  pull_request:
    branches: [develop]
    paths:
      - '.code-harness/**'
      - '.github/workflows/task160-task2-yamlconfig-verification.yml'

permissions:
  contents: read

jobs:
  task2-yamlconfig-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'

      - name: Task 2 requested package gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/reviewrules ./internal/reviewunit ./cmd/codea-harness-tools

      - name: Task 2 requested full test gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./...

      - name: Task 2 requested vet gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go vet ./...
