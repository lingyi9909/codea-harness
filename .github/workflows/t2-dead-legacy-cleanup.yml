name: t2-dead-legacy-cleanup

on:
  push:
    branches: [feature/1.7-integrated-t2]
    paths:
      - '.github/workflows/t2-dead-legacy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove superseded false-EXACT helper implementations
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('.code-harness/tools-runtime/internal/nav/java_resolution_170.go')
          text = path.read_text(encoding='utf-8')

          receiver_start = text.index('func (idx *javaIndex170) resolveReceiver170(')
          receiver_end = text.index('func (idx *javaIndex170) methodsForCall170(', receiver_start)
          text = text[:receiver_start] + text[receiver_end:]

          overload_start = text.index('func (idx *javaIndex170) selectOverload170(')
          overload_end = text.index('func (idx *javaIndex170) methodRef170(', overload_start)
          text = text[:overload_start] + text[overload_end:]

          path.write_text(text, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\t2_dead_legacy_cleanup.py" -Encoding utf8
          python "$env:RUNNER_TEMP\t2_dead_legacy_cleanup.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gofmt -w .code-harness/tools-runtime/internal/nav/java_resolution_170.go
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path .code-harness/tools-runtime/internal/nav/java_resolution_170.go -SimpleMatch 'func (idx *javaIndex170) resolveReceiver170(') { throw 'legacy receiver resolver remains' }
          if (Select-String -Path .code-harness/tools-runtime/internal/nav/java_resolution_170.go -SimpleMatch 'func (idx *javaIndex170) selectOverload170(') { throw 'legacy overload resolver remains' }
      - name: Commit cleanup
        shell: pwsh
        run: |
          git config user.name "codea-harness-ci"
          git config user.email "codea-harness-ci@users.noreply.github.com"
          git add .code-harness/tools-runtime/internal/nav/java_resolution_170.go
          git commit -m "refactor(nav): remove superseded T2 exactness paths"
          git push origin HEAD:feature/1.7-integrated-t2
