name: task162-hotfix-task2-apply-invocation-contract

on:
  push:
    branches: [hotfix/1.6.2-task2-invocation-contract]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix(hotfix): align Runtime invocation contracts'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.6.2-task2-invocation-contract
          fetch-depth: 0
      - name: Apply deterministic invocation contract migration
        shell: pwsh
        run: ./.github/scripts/task162-hotfix-task2-apply-invocation-contract.ps1
      - name: Commit deterministic migration
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Output 'No migration changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .code-harness
          git commit -m 'fix(hotfix): align Runtime invocation contracts'
          git push origin HEAD:hotfix/1.6.2-task2-invocation-contract
