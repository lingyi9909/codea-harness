name: t7-gofmt-once

on:
  push:
    branches: [feature/1.7-integrated-t7]
    paths:
      - '.github/workflows/t7-gofmt-once.yml'

permissions:
  contents: write

jobs:
  gofmt-once:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.10'
      - name: Format T7 Go files and commit exact output
        shell: pwsh
        run: |
          $files = @(
            '.code-harness/tools-runtime/internal/finding/knowledge_dispatch_170_test.go',
            '.code-harness/tools-runtime/internal/knowledge/knowledge_170_test.go',
            '.code-harness/tools-runtime/internal/knowledge/knowledge_limits_170_test.go',
            '.code-harness/tools-runtime/internal/knowledge/load_170.go',
            '.code-harness/tools-runtime/internal/knowledge/verify_170.go',
            '.code-harness/tools-runtime/internal/reviewrules/dispatch_knowledge_170_test.go'
          )
          gofmt -w $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check -- $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --quiet -- $files
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'TASK170_T7_GOFMT_ALREADY_CLEAN'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $files
          git commit -m 'style(t7): gofmt knowledge changes'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feature/1.7-integrated-t7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK170_T7_GOFMT_COMMITTED'
