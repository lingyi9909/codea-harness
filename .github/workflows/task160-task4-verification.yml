name: task160-task4-verification

on:
  pull_request:

permissions:
  contents: write

jobs:
  task4-gate:
    runs-on: windows-latest
    env:
      TASK4_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply Task 4 authority patch once
        run: ./.github/scripts/task160-task4-authority-patch.ps1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: Task 4 exact gate
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./internal/finding ./internal/report ./cmd/codea-harness-tools ./internal/reviewscope ./internal/reviewselection
      - name: Full regression
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./...
      - name: Vet
        working-directory: .code-harness/tools-runtime
        run: go vet ./...
