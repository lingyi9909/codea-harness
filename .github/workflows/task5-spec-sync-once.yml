name: task5-spec-sync-once

on:
  push:
    branches:
      - docs/1.5.3-chain-reliability-editing-design
    paths:
      - '.github/workflows/task5-spec-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-task5-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/1.5.3-chain-reliability-editing-design
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Patch Task 5 specification gaps
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_exact(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'marker not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              '.code-harness/tools-runtime/internal/analysis/certificate.go',
              '\tHead                      string `json:"head"`\n}',
              '\tHead                      string  `json:"head"`\n\tIntent                    *Intent `json:"intent,omitempty"`\n}'
          )

          replace_exact(
              '.code-harness/tools-runtime/internal/analysis/certify.go',
              '\t\tBaseRef: snapshot.BaseRef,\n\t\tHead: snapshot.Head,\n\t}',
              '\t\tBaseRef: snapshot.BaseRef,\n\t\tHead: snapshot.Head,\n\t\tIntent: &Intent{Mode: strings.ToUpper(strings.TrimSpace(req.Intent.Mode)), Target: strings.TrimSpace(req.Intent.Target)},\n\t}'
          )

          schema_path = Path('.code-harness/contracts/change-analysis-cert.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          schema['properties']['intent'] = {
              'type': 'object',
              'additionalProperties': False,
              'required': ['mode'],
              'properties': {
                  'mode': {'type': 'string', 'enum': ['FULL', 'LIST', 'TARGETED', 'CHAIN_MAINTENANCE']},
                  'target': {'type': 'string', 'minLength': 1}
              }
          }
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          edit_path = Path('.code-harness/tools-runtime/internal/chain/edit.go')
          s = edit_path.read_text(encoding='utf-8')
          old = '''\texisting, err := Load(chainPath)\n\tif err != nil {\n\t\tif os.IsNotExist(err) {\n\t\t\treturn EditResult{}, fmt.Errorf("CHAIN_NOT_FOUND: %s", req.ChainID)\n\t\t}\n\t\treturn EditResult{}, fmt.Errorf("CHAIN_EDIT_LOAD_FAILED: %w", err)\n\t}\n\tcandidate, err := applyEditOperations153(existing, req.Operations, evidence)'''
          new = '''\texisting, err := Load(chainPath)\n\tif err != nil {\n\t\tif os.IsNotExist(err) {\n\t\t\treturn EditResult{}, fmt.Errorf("CHAIN_NOT_FOUND: %s", req.ChainID)\n\t\t}\n\t\treturn EditResult{}, fmt.Errorf("CHAIN_EDIT_LOAD_FAILED: %w", err)\n\t}\n\tif !chainMaintenanceIntentAuthorizes153(cert.Intent, existing) {\n\t\treturn EditResult{}, fmt.Errorf("CHAIN_EDIT_ANALYSIS_INTENT_MISMATCH")\n\t}\n\tcandidate, err := applyEditOperations153(existing, req.Operations, evidence)'''
          if old not in s: raise SystemExit('edit intent insertion marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('"analysis", "edit-candidates", req.ChainID+".yaml"', '"analysis", "chain-edit-candidates", req.ChainID+".yaml"', 1)
          helper = '''\nfunc chainMaintenanceIntentAuthorizes153(intent *analysisruntime.Intent, existing Chain) bool {\n\tif intent == nil || strings.ToUpper(strings.TrimSpace(intent.Mode)) != "CHAIN_MAINTENANCE" {\n\t\treturn false\n\t}\n\ttarget := strings.TrimSpace(intent.Target)\n\tif target == "" { return false }\n\tfor _, ep := range existing.EntryPoints {\n\t\tsymbol := strings.TrimSpace(ep.Symbol)\n\t\tif target == symbol { return true }\n\t\tif i := strings.LastIndex(symbol, "."); i > 0 && target == symbol[:i] { return true }\n\t}\n\treturn false\n}\n'''
          marker = '\nfunc applyEditOperations153('
          if marker not in s: raise SystemExit('edit helper insertion marker missing')
          s = s.replace(marker, helper + marker, 1)
          edit_path.write_text(s, encoding='utf-8')

          replace_exact(
              '.code-harness/tools-runtime/internal/chain/candidate_provenance.go',
              '\tcase "edit-candidates":\n\t\tkind = "EDIT"',
              '\tcase "chain-edit-candidates":\n\t\tkind = "EDIT"'
          )

          test_path = Path('.code-harness/tools-runtime/cmd/codea-harness-tools/chain_edit_153_test.go')
          s = test_path.read_text(encoding='utf-8')
          import_old = '\t"codea-harness-tools/internal/chain"\n)'
          import_new = '\tanalysisruntime "codea-harness-tools/internal/analysis"\n\t"codea-harness-tools/internal/chain"\n)'
          if import_old not in s: raise SystemExit('chain edit analysis import marker missing')
          s = s.replace(import_old, import_new, 1)
          marker = '''func task153EditCandidatePath(runID, chainID string) string {\n\treturn filepath.Join(".code-harness", "runs", runID, "analysis", "chain-edit-candidates", chainID+".yaml")\n}\n'''
          helper = marker + '''\nfunc stampTask153ChainMaintenanceIntent(t *testing.T, runID, target string) {\n\tt.Helper()\n\tcertPath := filepath.Join(".code-harness", "runs", runID, "analysis", "change-analysis.cert.json")\n\tdata, err := os.ReadFile(certPath)\n\tif err != nil { t.Fatal(err) }\n\tvar cert analysisruntime.Certificate\n\tif err := json.Unmarshal(data, &cert); err != nil { t.Fatal(err) }\n\tcert.Intent = &analysisruntime.Intent{Mode: "CHAIN_MAINTENANCE", Target: target}\n\tcanonical, err := json.MarshalIndent(cert, "", "  ")\n\tif err != nil { t.Fatal(err) }\n\tcanonical = append(canonical, '\\n')\n\tif err := os.WriteFile(certPath, canonical, 0o644); err != nil { t.Fatal(err) }\n}\n\nfunc setupTask153MaintenanceChainForEdit(t *testing.T, runID string) (string, string) {\n\tt.Helper()\n\tprojectPath, chainID := setupTask153AcceptedChainForEdit(t, runID)\n\taccepted, err := chain.Load(projectPath)\n\tif err != nil { t.Fatal(err) }\n\tif len(accepted.EntryPoints) == 0 || strings.TrimSpace(accepted.EntryPoints[0].Symbol) == "" { t.Fatal("accepted Chain missing exact entrypoint") }\n\tstampTask153ChainMaintenanceIntent(t, runID, accepted.EntryPoints[0].Symbol)\n\treturn projectPath, chainID\n}\n'''
          if marker not in s: raise SystemExit('chain edit helper marker missing')
          s = s.replace(marker, helper, 1)
          for run_id in [
              'run-153-edit-command', 'run-153-edit-persist', 'run-153-edit-seal-tamper',
              'run-153-edit-unverified', 'run-153-edit-entrypoint-forbidden'
          ]:
              old = f'runID := "{run_id}"\n\tprojectPath, chainID := setupTask153AcceptedChainForEdit(t, runID)'
              new = f'runID := "{run_id}"\n\tprojectPath, chainID := setupTask153MaintenanceChainForEdit(t, runID)'
              if old not in s: raise SystemExit(f'positive edit fixture marker missing: {run_id}')
              s = s.replace(old, new, 1)
          test_path.write_text(s, encoding='utf-8')

          analysis_test = Path('.code-harness/tools-runtime/cmd/codea-harness-tools/analysis_certify_test.go')
          s = analysis_test.read_text(encoding='utf-8')
          old = 'BaseRef: "HEAD", IncludeWorkingTree: true, Intent: analysisruntime.Intent{Mode: "FULL"},'
          new = 'BaseRef: "HEAD", IncludeWorkingTree: true, Intent: analysisruntime.Intent{Mode: "CHAIN_MAINTENANCE", Target: "fixture-maintenance"},'
          if old not in s: raise SystemExit('analysis certify intent fixture marker missing')
          s = s.replace(old, new, 1)
          old = 'else if cert.Intent == nil || cert.Intent.Mode != "FULL" || cert.Intent.Target != "" {'
          new = 'else if cert.Intent == nil || cert.Intent.Mode != "CHAIN_MAINTENANCE" || cert.Intent.Target != "fixture-maintenance" {'
          if old not in s: raise SystemExit('analysis certify intent assertion marker missing')
          s = s.replace(old, new, 1)
          analysis_test.write_text(s, encoding='utf-8')

          contract_test = Path('.code-harness/tools-runtime/internal/chain/edit_agent_contract_153_test.go')
          s = contract_test.read_text(encoding='utf-8')
          s = s.replace('analysis/edit-candidates/<id>.yaml', 'analysis/chain-edit-candidates/<id>.yaml')
          contract_test.write_text(s, encoding='utf-8')

          for name in [
              '.code-harness/AGENTS.md',
              '.code-harness/agents/orchestrator.md',
              '.code-harness/skills/edit-chain/SKILL.md',
              '.code-harness/skills/validate-chain/SKILL.md',
          ]:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('analysis/edit-candidates', 'analysis/chain-edit-candidates')
              text = text.replace('/edit-candidates/', '/chain-edit-candidates/')
              p.write_text(text, encoding='utf-8')

          p = Path('.code-harness/skills/edit-chain/SKILL.md')
          text = p.read_text(encoding='utf-8')
          needle = '代码事实必须来自 same-run Certified ChangeAnalysis；dependency workspace 只能用于 navigation，不能成为 current Project State 写 authority。'
          repl = needle + '\n\n该 Certified ChangeAnalysis 必须由 `analysis certify` 以 `intent.mode=CHAIN_MAINTENANCE` 生成，并把 target 绑定到已解析 Chain 的 exact Controller / Controller.method EntryPoint；用户即使通过 Chain id 发起 edit，也应先解析 Chain，再用其 EntryPoint 做 maintenance analysis target。普通 FULL/LIST/TARGETED certificate 不授权 Chain edit。'
          if needle not in text: raise SystemExit('edit skill intent marker missing')
          text = text.replace(needle, repl, 1)
          p.write_text(text, encoding='utf-8')

      - name: Task 5 exact semantic Chain edit gate
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./internal/analysis ./internal/chain ./cmd/codea-harness-tools -run 'Test153.*Edit|Test153ChainEditAgentContract|Test153AnalysisCertifyPublishesCertifiedBundle'

      - name: Full Go test
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./...

      - name: Go vet
        working-directory: .code-harness/tools-runtime
        run: go vet ./...

      - name: Commit Task 5 specification GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .code-harness/contracts/change-analysis-cert.schema.json \
                  .code-harness/tools-runtime/internal/analysis/certificate.go \
                  .code-harness/tools-runtime/internal/analysis/certify.go \
                  .code-harness/tools-runtime/internal/chain/edit.go \
                  .code-harness/tools-runtime/internal/chain/candidate_provenance.go \
                  .code-harness/tools-runtime/cmd/codea-harness-tools/chain_edit_153_test.go \
                  .code-harness/tools-runtime/cmd/codea-harness-tools/analysis_certify_test.go \
                  .code-harness/tools-runtime/internal/chain/edit_agent_contract_153_test.go \
                  .code-harness/AGENTS.md \
                  .code-harness/agents/orchestrator.md \
                  .code-harness/skills/edit-chain/SKILL.md \
                  .code-harness/skills/validate-chain/SKILL.md
          git commit -m "fix: bind chain edits to maintenance analysis authority"
          git push origin HEAD:docs/1.5.3-chain-reliability-editing-design
