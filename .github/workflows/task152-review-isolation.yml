name: task152-review-isolation

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.code-harness/tools-runtime/internal/coverage/**'
      - '.code-harness/tools-runtime/internal/reviewscope/**'
      - '.code-harness/tools-runtime/internal/report/**'
      - '.code-harness/tools-runtime/internal/apply/**'
      - '.code-harness/tools-runtime/internal/chain/**'
      - '.github/workflows/task152-review-isolation.yml'

permissions:
  contents: read

jobs:
  review-isolation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Task 6 FULL TARGETED finding write isolation regressions
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./internal/coverage ./internal/reviewscope ./internal/apply ./internal/chain ./internal/report

      - name: Full Go test
        working-directory: .code-harness/tools-runtime
        run: go test -count=1 ./...

      - name: Go vet
        working-directory: .code-harness/tools-runtime
        run: go vet ./...
