name: task160-review-precision

on:
  pull_request:

jobs:
  review-precision:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: ReviewUnit gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/reviewunit
      - name: RuleDispatch gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/reviewrules
      - name: Finding and 24-case benchmark gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/finding -v
      - name: Formal report gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/report
      - name: Controlled Runtime command gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./cmd/codea-harness-tools
      - name: Full Go regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./...
      - name: Go vet
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go vet ./...
      - name: Build Windows x64 Controlled Runtime
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go build -o ../bin/codea-harness-tools.exe ./cmd/codea-harness-tools
      - name: Real Windows review precision regression
        shell: pwsh
        run: ./.github/scripts/task160-real-review-precision-regression.ps1
