name: T3 Instruction Isolation

on:
  push:
    branches: [feature/1.8-task3-primary-report]
    paths:
      - '.github/scripts/patch-review180-instructions.py'
      - '.github/workflows/t3-instruction-isolation.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip t3 patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1.8-task3-primary-report
          fetch-depth: 0
      - name: Isolate legacy Review instructions
        run: python .github/scripts/patch-review180-instructions.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No instruction changes required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .code-harness/AGENTS.md .code-harness/bootstrap.md .code-harness/agents/orchestrator.md .code-harness/skills/review-code/SKILL.md
          git commit -m "docs(review): isolate legacy review protocol [skip t3 patch]"
          git push origin HEAD:feature/1.8-task3-primary-report
