name: task163-task3-apply-active-contracts

on:
  push:
    branches:
      - hotfix/1.6.3-runtime-usability-task3
    paths:
      - .github/workflows/task163-task3-apply-active-contracts.yml

permissions:
  contents: write

jobs:
  apply-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.6.3-runtime-usability-task3
          fetch-depth: 0

      - name: Append Task 3 hard-stop contracts
        shell: pwsh
        env:
          S_AGENTS: 
          S_ORCH: 
          S_REVIEWER: 
          S_SKILL: 
        run: |
          $pairs = @(
            @('.code-harness/AGENTS.md', $env:S_AGENTS),
            @('.code-harness/agents/orchestrator.md', $env:S_ORCH),
            @('.code-harness/agents/reviewer.md', $env:S_REVIEWER),
            @('.code-harness/skills/review-code/SKILL.md', $env:S_SKILL)
          )
          foreach ($pair in $pairs) {
            $path = $pair[0]
            $text = Get-Content -Raw $path
            if ($text.Contains('TASK163_USER_SELECTION_TURN_HARD_STOP')) { continue }
            $section = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($pair[1]))
            [System.IO.File]::AppendAllText($path, $section, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Commit active contract changes
        shell: bash
        run: |
          git config user.name "Codea Task3 CI"
          git config user.email "codea-task3@example.invalid"
          git add .code-harness/AGENTS.md .code-harness/agents/orchestrator.md .code-harness/agents/reviewer.md .code-harness/skills/review-code/SKILL.md
          if git diff --cached --quiet; then
            echo "No contract changes required"
            exit 0
          fi
          git commit -m "fix: enforce multi-chain user-selection turn boundary"
          git push origin HEAD:hotfix/1.6.3-runtime-usability-task3
