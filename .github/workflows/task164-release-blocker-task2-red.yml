name: task164-release-blocker-task2-red

on:
  push:
    branches: [release/1.6.4-final-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-host-red:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - name: Exact accepted-base ancestry guard
        shell: pwsh
        run: |
          git merge-base --is-ancestor 51ad4cbc32008e388fc7a2564dbd5e518d04d9ae HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Task 2 is not based on accepted Task 1 baseline' }

      - name: Install pinned OpenCode Agent Host
        shell: pwsh
        run: |
          npm install --global opencode-ai@1.18.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (& opencode --version | Out-String).Trim()
          if ($version -notmatch '1\.18\.25') { throw "unexpected OpenCode version: $version" }

      - name: Build exact-head 1.6.4 install package
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Task 2 Reviewer host RED
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-blocker-task2-red.ps1
