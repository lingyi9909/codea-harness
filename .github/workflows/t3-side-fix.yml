name: t3-side-fix

on:
  push:
    branches: [feature/1.7-integrated-t3]
    paths:
      - '.github/workflows/t3-side-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve caller workspace and side through include graph
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('.code-harness/tools-runtime/internal/reviewcontext/mybatis_170.go')
          text = path.read_text(encoding='utf-8')
          old = 'includeRelations, includeIssues, fragments, err := resolveMyBatisIncludes170(idx, selected, stack, seenEdges)'
          new = 'includeRelations, includeIssues, fragments, err := resolveMyBatisIncludes170(idx, selected, source.Ref.Workspace, source.Ref.Side, stack, seenEdges)'
          if text.count(old) != 1:
              raise SystemExit(f'root include call match count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''func resolveMyBatisIncludes170(idx myBatisIndex170, node *myBatisNode170, stack, seenEdges map[string]bool) ([]nav.Relation170, []nav.Issue170, []*myBatisNode170, error) {\n\tworkspace := "current"\n\tside := "CURRENT"\n\tfrom := myBatisNodeRef170(node, workspace, side)'''
          new = '''func resolveMyBatisIncludes170(idx myBatisIndex170, node *myBatisNode170, workspace, side string, stack, seenEdges map[string]bool) ([]nav.Relation170, []nav.Issue170, []*myBatisNode170, error) {\n\tfrom := myBatisNodeRef170(node, workspace, side)'''
          if text.count(old) != 1:
              raise SystemExit(f'include signature match count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = 'nestedRelations, nestedIssues, nestedFragments, err := resolveMyBatisIncludes170(idx, target, stack, seenEdges)'
          new = 'nestedRelations, nestedIssues, nestedFragments, err := resolveMyBatisIncludes170(idx, target, workspace, side, stack, seenEdges)'
          if text.count(old) != 1:
              raise SystemExit(f'nested include call match count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\t3_side_fix.py" -Encoding utf8
          python "$env:RUNNER_TEMP\t3_side_fix.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gofmt -w .code-harness/tools-runtime/internal/reviewcontext/mybatis_170.go
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit side propagation fix
        shell: pwsh
        run: |
          git config user.name "codea-harness-ci"
          git config user.email "codea-harness-ci@users.noreply.github.com"
          git add .code-harness/tools-runtime/internal/reviewcontext/mybatis_170.go
          git commit -m "fix(review): preserve MyBatis relation side"
          git push origin HEAD:feature/1.7-integrated-t3
