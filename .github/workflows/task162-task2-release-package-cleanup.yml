name: task162-task2-release-package-cleanup

on:
  push:
    branches: [hotfix/1.6.2-task2-release-package-cleanup]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  task2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - name: Task 2 focused Upgrade regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/upgrade

      - name: Release Package Cleanup E2E
        shell: pwsh
        run: |
          $output = & ./.github/scripts/task162-task2-release-package-cleanup-regression.ps1 2>&1 | Tee-Object -Variable task2Output
          $text = ($task2Output | Out-String)
          if ($text -notmatch 'TASK162_TASK2_RELEASE_PACKAGE_CLEANUP_E2E PASS') {
            throw "Task 2 package cleanup E2E did not reach completion marker`n$text"
          }
          $global:LASTEXITCODE = 0

      - name: Full Go regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./...

      - name: Go vet
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go vet ./...

      - name: Upload Task 2 install package
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.2-task2-windows-x64-install
          path: codea-harness-1.6.2-windows-x64-install.zip
          if-no-files-found: error

      - name: Upload Task 2 upgrade package
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.2-task2-windows-x64-upgrade
          path: codea-harness-1.6.2-windows-x64-upgrade.zip
          if-no-files-found: error

      - name: Task 2 exact-head marker
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw "checkout is not exact head: $head" }
          Write-Output "TASK162_TASK2_EXACT_HEAD PASS head=$head"
