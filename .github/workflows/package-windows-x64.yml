name: package-windows-x64

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main, docs/1.6-review-precision]
    paths:
      - '.code-harness/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/scripts/**'
      - '.github/workflows/package-windows-x64.yml'
  push:
    branches: [develop, main, release/1.6.1-windows-tools-whitelist]
    paths:
      - '.code-harness/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/scripts/**'
      - '.github/workflows/package-windows-x64.yml'

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - name: Detect release version
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content '.code-harness/VERSION' -Raw).Trim()
          if ($version -notin @('1.6.1', '1.6.2', '1.6.3')) {
            throw "unsupported release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "PACKAGE_WINDOWS_X64_VERSION $version"

      - uses: actions/setup-python@v6
        if: steps.release.outputs.version == '1.6.2'
        with:
          python-version: '3.12'

      - name: Install pinned OpenCode Agent Host for 1.6.2
        if: steps.release.outputs.version == '1.6.2'
        shell: pwsh
        run: |
          npm install --global opencode-ai@1.18.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (& opencode --version | Out-String).Trim()
          Write-Output "OpenCode $version"
          if ($version -notmatch '1\.18\.25') { throw "unexpected OpenCode version: $version" }

      - name: Codea Harness 1.6.1 exact release certification
        if: steps.release.outputs.version == '1.6.1'
        shell: pwsh
        run: ./.github/scripts/task161-release.ps1

      - name: Real accepted 1.6.0 to 1.6.1 Runtime upgrade
        if: steps.release.outputs.version == '1.6.1'
        shell: pwsh
        run: ./.github/scripts/task161-real-160-upgrade.ps1

      - name: Upload 1.6.1 install package
        if: steps.release.outputs.version == '1.6.1'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.1-windows-x64-install
          path: codea-harness-1.6.1-windows-x64-install.zip
          if-no-files-found: error

      - name: Upload 1.6.1 upgrade package
        if: steps.release.outputs.version == '1.6.1'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.1-windows-x64-upgrade
          path: codea-harness-1.6.1-windows-x64-upgrade.zip
          if-no-files-found: error

      - name: Upload 1.6.1 release checklist
        if: steps.release.outputs.version == '1.6.1'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.1-release-checklist
          path: codea-harness-1.6.1-release-checklist.json
          if-no-files-found: error

      - name: Upload 1.6.1 enterprise whitelist evidence
        if: steps.release.outputs.version == '1.6.1'
        uses: actions/upload-artifact@v4
        with:
          name: codea-dcep-tools-whitelist
          path: codea-dcep-tools-whitelist.txt
          if-no-files-found: error

      - name: Codea Harness 1.6.2 exact release certification
        if: steps.release.outputs.version == '1.6.2' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./.github/scripts/task162-release-certification.ps1

      - name: Codea Harness 1.6.2 certified main release package
        if: steps.release.outputs.version == '1.6.2' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $integrationHead = (git rev-parse HEAD).Trim()
          $certifiedHead = 'd801d390f17d19f89dd25303583f8da2298d3f75'
          git merge-base --is-ancestor $certifiedHead $integrationHead
          $ancestorExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($ancestorExit -ne 0) {
            throw "accepted 1.6.2 certified head is not an ancestor of main integration head: certified=$certifiedHead integration=$integrationHead"
          }
          git checkout --force --detach $certifiedHead
          if ($LASTEXITCODE -ne 0) { throw "cannot checkout accepted 1.6.2 certified head: $certifiedHead" }
          Write-Output "PACKAGE_WINDOWS_X64_162_MAIN_CERTIFIED_HEAD PASS certified=$certifiedHead integration=$integrationHead"
          ./.github/scripts/task162-release-certification.ps1

      - name: Validate 1.6.2 exact-head evidence
        if: steps.release.outputs.version == '1.6.2'
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $expectedHead = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'd801d390f17d19f89dd25303583f8da2298d3f75' } else { $head }
          if ($head -ne $expectedHead) { throw "release checkout HEAD mismatch: expected=$expectedHead actual=$head" }
          $checklist = Get-Content 'codea-harness-1.6.2-release-checklist.json' -Raw | ConvertFrom-Json
          if ([string]$checklist.exactHeadSha -ne $expectedHead) { throw 'release checklist exact HEAD mismatch' }
          if ([string]$checklist.version -ne '1.6.2') { throw 'release checklist version mismatch' }
          $version = (Get-Content '.code-harness/VERSION' -Raw).Trim()
          if ($version -ne '1.6.2') { throw 'repository VERSION mismatch' }
          Write-Output "PACKAGE_WINDOWS_X64_162_EXACT_HEAD PASS head=$expectedHead"

      - name: Upload 1.6.2 install package
        if: steps.release.outputs.version == '1.6.2'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.2-windows-x64-install
          path: codea-harness-1.6.2-windows-x64-install.zip
          if-no-files-found: error

      - name: Upload 1.6.2 upgrade package
        if: steps.release.outputs.version == '1.6.2'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.2-windows-x64-upgrade
          path: codea-harness-1.6.2-windows-x64-upgrade.zip
          if-no-files-found: error

      - name: Upload 1.6.2 release checklist
        if: steps.release.outputs.version == '1.6.2'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.2-release-checklist
          path: codea-harness-1.6.2-release-checklist.json
          if-no-files-found: error

      - name: Upload 1.6.2 Runtime whitelist
        if: steps.release.outputs.version == '1.6.2'
        uses: actions/upload-artifact@v4
        with:
          name: codea-dcep-tools-whitelist
          path: codea-dcep-tools-whitelist.txt
          if-no-files-found: error

      - name: Validate 1.6.3 certified release lineage
        if: steps.release.outputs.version == '1.6.3'
        shell: pwsh
        run: |
          $integrationHead = (git rev-parse HEAD).Trim()
          $certifiedHead = '2278ad49d4534b57f3144466ffe0e65ddca7f189'
          git merge-base --is-ancestor $certifiedHead $integrationHead
          $ancestorExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($ancestorExit -ne 0) {
            throw "accepted 1.6.3 certified head is not an ancestor of integration head: certified=$certifiedHead integration=$integrationHead"
          }
          $version = (Get-Content '.code-harness/VERSION' -Raw).Trim()
          if ($version -ne '1.6.3') { throw "repository VERSION mismatch: $version" }
          Write-Output "PACKAGE_WINDOWS_X64_163_CERTIFIED_LINEAGE PASS certified=$certifiedHead integration=$integrationHead"

      - name: Download 1.6.3 certified release candidate
        if: steps.release.outputs.version == '1.6.3'
        uses: actions/download-artifact@v4
        with:
          name: codea-harness-1.6.3-release-candidate-2278ad49d4534b57f3144466ffe0e65ddca7f189
          path: task163-certified-release
          github-token: ${{ github.token }}
          run-id: 34078028987

      - name: Validate 1.6.3 certified release candidate
        if: steps.release.outputs.version == '1.6.3'
        shell: pwsh
        run: |
          $certifiedHead = '2278ad49d4534b57f3144466ffe0e65ddca7f189'
          $root = Join-Path (Get-Location).Path 'task163-certified-release'
          $checklistPath = Join-Path $root 'codea-harness-1.6.3-release-checklist.json'
          $checklist = Get-Content $checklistPath -Raw | ConvertFrom-Json
          if ([string]$checklist.status -ne 'PASS') { throw '1.6.3 certification checklist is not PASS' }
          if ([string]$checklist.version -ne '1.6.3') { throw '1.6.3 certification checklist version mismatch' }
          if ([string]$checklist.exactHeadSha -ne $certifiedHead) { throw '1.6.3 certification checklist exact HEAD mismatch' }
          foreach ($kind in @('install','upgrade')) {
            $zip = Join-Path $root "codea-harness-1.6.3-windows-x64-$kind.zip"
            if (-not (Test-Path $zip -PathType Leaf)) { throw "missing certified $kind ZIP" }
            $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedHash = [string]$checklist.artifacts.$kind.sha256
            if ($actualHash -ne $expectedHash) { throw "$kind ZIP hash mismatch" }
            $expand = Join-Path $env:RUNNER_TEMP ("task163-certified-$kind-" + [guid]::NewGuid().ToString('N'))
            try {
              Expand-Archive $zip $expand -Force
              $top = if ($kind -eq 'install') { '.code-harness' } else { '.code-harness-upgrade' }
              $manifest = Get-Content (Join-Path (Join-Path $expand $top) 'RELEASE-MANIFEST.json') -Raw | ConvertFrom-Json
              if ([string]$manifest.version -ne '1.6.3') { throw "$kind manifest version mismatch" }
              if ([string]$manifest.buildCommit -ne $certifiedHead) { throw "$kind manifest certified HEAD mismatch" }
            } finally {
              Remove-Item $expand -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $whitelist = Join-Path $root 'codea-dcep-tools-whitelist.txt'
          if (-not (Test-Path $whitelist -PathType Leaf)) { throw 'missing certified Runtime whitelist' }
          $whitelistHash = (Get-FileHash $whitelist -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($whitelistHash -ne [string]$checklist.artifacts.whitelist.sha256) { throw 'Runtime whitelist hash mismatch' }
          Write-Output "PACKAGE_WINDOWS_X64_163_CERTIFIED_ARTIFACTS PASS head=$certifiedHead"

      - name: Upload 1.6.3 install package
        if: steps.release.outputs.version == '1.6.3'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.3-windows-x64-install
          path: task163-certified-release/codea-harness-1.6.3-windows-x64-install.zip
          if-no-files-found: error

      - name: Upload 1.6.3 upgrade package
        if: steps.release.outputs.version == '1.6.3'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.3-windows-x64-upgrade
          path: task163-certified-release/codea-harness-1.6.3-windows-x64-upgrade.zip
          if-no-files-found: error

      - name: Upload 1.6.3 release checklist
        if: steps.release.outputs.version == '1.6.3'
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.3-release-checklist
          path: task163-certified-release/codea-harness-1.6.3-release-checklist.json
          if-no-files-found: error

      - name: Upload 1.6.3 Runtime whitelist
        if: steps.release.outputs.version == '1.6.3'
        uses: actions/upload-artifact@v4
        with:
          name: codea-dcep-tools-whitelist-1.6.3
          path: task163-certified-release/codea-dcep-tools-whitelist.txt
          if-no-files-found: error
