name: package-windows-x64

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.code-harness/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/package-windows-x64.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Test controlled runtime
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test selection verifier and schema
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/selection ./internal/schema
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test database config validation
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/dbconfig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test SQL safety golden cases
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/dbguard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test database runtime and evidence
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/dbmysql ./internal/dbevidence ./cmd/codea-harness-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 runtime
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-s -w" -o ../bin/codea-harness-tools.exe ./cmd/codea-harness-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vendor pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe'
          & '.code-harness/bin/ast-grep.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Code Navigation end-to-end smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'smoke/src/main/java' | Out-Null
          @'
          public interface OrderService { void approve(); }
          '@ | Set-Content 'smoke/src/main/java/OrderService.java'
          @'
          public class OrderServiceImpl implements OrderService {
              public void approve() {}
          }
          '@ | Set-Content 'smoke/src/main/java/OrderServiceImpl.java'
          $out = & '.code-harness/bin/codea-harness-tools.exe' nav find-implementations --symbol OrderService --scope smoke/src/main/java
          if ($LASTEXITCODE -ne 0) { throw 'Code Navigation runtime failed' }
          if (($out -join "`n") -notmatch 'OrderServiceImpl.java') { throw 'implementation not found by real ast-grep runtime' }
          Remove-Item -Recurse -Force smoke

      - name: Windows live upgrade lifecycle smoke
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'codea-upgrade-smoke'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item -Recurse '.code-harness' (Join-Path $root '.code-harness')
          Copy-Item -Recurse '.code-harness' (Join-Path $root '.code-harness-upgrade')

          $target = Join-Path $root '.code-harness'
          Set-Content (Join-Path $target 'VERSION') '1.1.1'
          Remove-Item (Join-Path $target 'database.template.yaml') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $target 'contracts/database-config.schema.json') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $target 'contracts/database-evidence.schema.json') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $target 'contracts/test-target-selection.schema.json') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $target 'skills/select-test-targets') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $target 'skills/query-database') -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force (Join-Path $target 'skills/stale') | Out-Null
          Set-Content (Join-Path $target 'skills/stale/SKILL.md') 'stale'

          $databaseBytes = [System.Text.UTF8Encoding]::new($false).GetBytes("version: 1`nenvironment: TEST`npassword: sentinel-secret`n")
          $databasePath = Join-Path $target 'database.yaml'
          [System.IO.File]::WriteAllBytes($databasePath, $databaseBytes)
          $databaseHash = (Get-FileHash -Algorithm SHA256 $databasePath).Hash

          @'
          version: 1
          project:
            type: maven
            root: .
            module: ""
          review:
            baseRef: origin/develop
            includeWorkingTree: true
          integrationTest:
            executable: mvn
            args: [test]
            reportDir: target/surefire-reports
            timeoutSeconds: 600
          service:
            executable: mvn
            args: [spring-boot:run]
            startupTimeoutSeconds: 120
            readiness:
              type: log
              pattern: Started
            logFile: null
          stopService:
            mode: processTree
          initialization:
            status: READY
            unresolved: []
          scope:
            sourceIncludes: [src/main/java/**]
            testIncludes: [src/test/java/**]
          write:
            allowedTestPaths: [src/test/**]
            allowedProductionPaths: [src/main/**]
            deniedPaths: []
          runs:
            directory: .code-harness/runs
          '@ | Set-Content (Join-Path $target 'harness.yaml')

          $newExe = Join-Path $root '.code-harness-upgrade/bin/codea-harness-tools.exe'
          [System.IO.File]::AppendAllText($newExe, 'CODEA-UPGRADE-SMOKE')
          $expectedHash = (Get-FileHash -Algorithm SHA256 $newExe).Hash

          Push-Location $root
          try {
            $out = & '.\.code-harness\bin\codea-harness-tools.exe' upgrade 2>&1
            if ($LASTEXITCODE -ne 0) { throw "live upgrade failed: $($out -join "`n")" }
            $text = $out -join "`n"
            if ($text -notmatch '"status": "UPGRADED"') { throw "unexpected upgrade output: $text" }
            if ($text -notmatch 'skills/stale/SKILL.md') { throw "removedFiles missing stale path: $text" }
            if ((Get-Content '.code-harness/VERSION' -Raw).Trim() -ne '1.2.0') { throw 'target version was not upgraded to 1.2.0' }
            if ((Get-FileHash -Algorithm SHA256 '.code-harness/database.yaml').Hash -ne $databaseHash) { throw 'database.yaml bytes changed during upgrade' }
            if (!(Test-Path '.code-harness/database.template.yaml')) { throw 'database.template.yaml missing after upgrade' }
            if (Test-Path '.code-harness/skills/stale/SKILL.md') { throw 'stale framework file survived replace' }
            if (Test-Path '.code-harness-upgrade') { throw 'source package was not cleaned after success' }
            if (Get-ChildItem -Force -Name '.code-harness-stage-*' -ErrorAction SilentlyContinue) { throw 'stage directory leaked' }
            if (Get-ChildItem -Force -Name '.code-harness-backup-*' -ErrorAction SilentlyContinue) { throw 'backup directory leaked' }
            $actualHash = (Get-FileHash -Algorithm SHA256 '.code-harness/bin/codea-harness-tools.exe').Hash
            if ($actualHash -ne $expectedHash) { throw 'running executable was not replaced by staged binary' }
          } finally {
            Pop-Location
          }

      - name: Assert package completeness
        shell: pwsh
        run: |
          $required = @(
            '.code-harness/bin/codea-harness-tools.exe',
            '.code-harness/bin/ast-grep.exe',
            '.code-harness/database.template.yaml',
            '.code-harness/contracts/database-config.schema.json',
            '.code-harness/contracts/database-evidence.schema.json',
            '.code-harness/contracts/test-target-selection.schema.json',
            '.code-harness/skills/select-test-targets/SKILL.md',
            '.code-harness/skills/query-database/SKILL.md'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "required package path missing: $path" }
          }
          if (Test-Path '.code-harness/database.yaml') { throw 'database.yaml must not be present in release source tree' }
          if ((Get-Content '.code-harness/VERSION' -Raw).Trim() -ne '1.2.0') { throw 'wrong version' }

      - name: Build offline package
        shell: pwsh
        run: Compress-Archive -Path '.code-harness','CHANGELOG.md','THIRD_PARTY_NOTICES.md' -DestinationPath 'codea-harness-1.2.0-windows-x64.zip' -Force

      - name: Assert offline package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'codea-harness-1.2.0-windows-x64.zip'))
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            $required = @(
              '.code-harness/database.template.yaml',
              '.code-harness/contracts/database-config.schema.json',
              '.code-harness/contracts/database-evidence.schema.json',
              '.code-harness/contracts/test-target-selection.schema.json',
              '.code-harness/skills/select-test-targets/SKILL.md',
              '.code-harness/skills/query-database/SKILL.md'
            )
            foreach ($path in $required) {
              if ($entries -notcontains $path) { throw "ZIP missing required path: $path" }
            }
            if ($entries -contains '.code-harness/database.yaml') { throw 'ZIP leaked .code-harness/database.yaml' }
          } finally {
            $archive.Dispose()
          }

      - uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.2.0-windows-x64
          path: codea-harness-1.2.0-windows-x64.zip
          if-no-files-found: error
