name: package-windows-x64

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.code-harness/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/scripts/task152-workspace-smoke.ps1'
      - '.github/scripts/task152-task5-real-business-regression.ps1'
      - '.github/workflows/package-windows-x64.yml'
  push:
    branches: [develop]
    paths:
      - '.code-harness/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/scripts/task152-workspace-smoke.ps1'
      - '.github/scripts/task152-task5-real-business-regression.ps1'
      - '.github/workflows/package-windows-x64.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: 1.5.2 exact controlled runtime release gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/workspace ./internal/nav ./internal/chain ./internal/reviewscope ./internal/coverage ./internal/report ./internal/apply ./internal/schema ./internal/upgrade ./cmd/codea-harness-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 1.5.1 chain discover NewController bootstrap regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./cmd/codea-harness-tools -run 'Test151ChainDiscoverBootstrapContractIsSelfContained|Test151DirectDiscoverSupportsFreshAddedControllerServiceMapperStack'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 runtime
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-s -w" -o ../bin/codea-harness-tools.exe ./cmd/codea-harness-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vendor pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe' -Force
          & '.code-harness/bin/ast-grep.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lightweight Code Navigation real ast-grep smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'smoke/src/main/java' | Out-Null
          @'
          public interface OrderService { void approve(); }
          '@ | Set-Content 'smoke/src/main/java/OrderService.java'
          @'
          @RestController
          public class OrderController {
              private final OrderService orderService;
              public OrderController(OrderService orderService) { this.orderService = orderService; }
              @PostMapping(value = "/approve")
              public void approve() { orderService.approve(); }
          }
          '@ | Set-Content 'smoke/src/main/java/OrderController.java'
          $info = & '.code-harness/bin/codea-harness-tools.exe' nav get-symbol-info --symbol OrderController.approve --scope smoke/src/main/java
          if ($LASTEXITCODE -ne 0 -or (($info -join "`n") -notmatch 'OrderController.approve')) { throw 'get-symbol-info smoke failed' }
          $callers = & '.code-harness/bin/codea-harness-tools.exe' nav find-callers --symbol OrderService.approve --scope smoke/src/main/java
          if ($LASTEXITCODE -ne 0 -or (($callers -join "`n") -notmatch 'CONFIRMED')) { throw 'find-callers smoke failed' }
          Remove-Item -Recurse -Force smoke

      - name: Workspace dependency Maven identity regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/workspace -run 'Maven|Verify|Workspace'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Template inheritance navigation regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:CODEA_AST_GREP_TEST_PATH = (Resolve-Path '../bin/ast-grep.exe').Path
          go test -count=1 ./internal/nav -run 'TestWorkspace|Test152|Implementation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Task 5 real dual-project business regression
        shell: pwsh
        run: |
          Remove-Item '.code-harness/runs/.gitkeep' -ErrorAction SilentlyContinue
          ./.github/scripts/task152-task5-real-business-regression.ps1

      - name: Task 6 review isolation regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/coverage ./internal/reviewscope ./internal/apply ./internal/chain ./internal/report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage formal 1.5.2 install and upgrade releases
        shell: pwsh
        run: |
          $version = (Get-Content '.code-harness/VERSION' -Raw).Trim()
          if ($version -ne '1.5.2') { throw "unexpected release version: $version" }
          $runtimeHash = (Get-FileHash -Algorithm SHA256 '.code-harness/bin/codea-harness-tools.exe').Hash.ToLowerInvariant()
          $astHash = (Get-FileHash -Algorithm SHA256 '.code-harness/bin/ast-grep.exe').Hash.ToLowerInvariant()
          $installStage = Join-Path $env:RUNNER_TEMP 'codea-release-install'
          $upgradeStage = Join-Path $env:RUNNER_TEMP 'codea-release-upgrade'
          Remove-Item -Recurse -Force $installStage,$upgradeStage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $installStage,$upgradeStage | Out-Null
          Copy-Item -Recurse '.code-harness' (Join-Path $installStage '.code-harness')
          Copy-Item -Recurse '.code-harness' (Join-Path $upgradeStage '.code-harness-upgrade')
          foreach ($releaseRoot in @((Join-Path $installStage '.code-harness'), (Join-Path $upgradeStage '.code-harness-upgrade'))) {
            foreach ($state in @('harness.yaml','project.md','database.yaml','runs','chains')) {
              Remove-Item -Recurse -Force (Join-Path $releaseRoot $state) -ErrorAction SilentlyContinue
            }
          }
          $manifest = [ordered]@{
            version = $version
            platform = 'windows'
            arch = 'x64'
            runtime = 'codea-harness-tools.exe'
            runtimeSha256 = $runtimeHash
            astGrepVersion = '0.42.1'
            astGrepSha256 = $astHash
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $installStage '.code-harness/RELEASE-MANIFEST.json'), $manifest, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $upgradeStage '.code-harness-upgrade/RELEASE-MANIFEST.json'), $manifest, [System.Text.UTF8Encoding]::new($false))
          $required = @(
            'VERSION','RELEASE-MANIFEST.json','AGENTS.md','bootstrap.md','upgrade.md',
            'harness.template.yaml','project.template.md','bin/codea-harness-tools.exe','bin/ast-grep.exe',
            'agents/orchestrator.md','agents/reviewer.md',
            'skills/analyze-change/SKILL.md','skills/discover-chain/SKILL.md','skills/validate-chain/SKILL.md',
            'contracts/harness-config.schema.json','contracts/change-analysis.schema.json','contracts/chain.schema.json','contracts/chain-validation-result.schema.json',
            'templates/chain.template.yaml','tools-runtime/internal/workspace/config.go','tools-runtime/internal/workspace/maven.go',
            'tools-runtime/internal/nav/workspace.go','tools-runtime/internal/nav/workspace_ast.go',
            'tools-runtime/internal/chain/model.go','tools-runtime/internal/reviewscope/chain_context.go',
            'tools-runtime/cmd/codea-harness-tools/chain_command.go'
          )
          foreach ($pair in @(
            @{ Root = (Join-Path $installStage '.code-harness'); Name = 'install' },
            @{ Root = (Join-Path $upgradeStage '.code-harness-upgrade'); Name = 'upgrade' }
          )) {
            foreach ($rel in $required) {
              if (!(Test-Path (Join-Path $pair.Root $rel))) { throw "$($pair.Name) release missing: $rel" }
            }
            foreach ($state in @('harness.yaml','project.md','database.yaml','runs','chains')) {
              if (Test-Path (Join-Path $pair.Root $state)) { throw "$($pair.Name) release leaked Project State: $state" }
            }
          }

      - name: Build 1.5.2 install and upgrade ZIPs
        shell: pwsh
        run: |
          $installStage = Join-Path $env:RUNNER_TEMP 'codea-release-install'
          $upgradeStage = Join-Path $env:RUNNER_TEMP 'codea-release-upgrade'
          Compress-Archive -Path (Join-Path $installStage '.code-harness') -DestinationPath 'codea-harness-1.5.2-windows-x64-install.zip' -Force
          Compress-Archive -Path (Join-Path $upgradeStage '.code-harness-upgrade') -DestinationPath 'codea-harness-1.5.2-windows-x64-upgrade.zip' -Force

      - name: Validate ZIP layouts and real accepted 1.5.1 to 1.5.2 Windows live upgrade
        shell: pwsh
        run: |
          $installExtract = Join-Path $env:RUNNER_TEMP 'codea-install-extract'
          $upgradeExtract = Join-Path $env:RUNNER_TEMP 'codea-upgrade-extract'
          Remove-Item -Recurse -Force $installExtract,$upgradeExtract -ErrorAction SilentlyContinue
          Expand-Archive 'codea-harness-1.5.2-windows-x64-install.zip' $installExtract -Force
          Expand-Archive 'codea-harness-1.5.2-windows-x64-upgrade.zip' $upgradeExtract -Force
          if (!(Test-Path (Join-Path $installExtract '.code-harness'))) { throw 'install.zip must extract directly to .code-harness/' }
          if (!(Test-Path (Join-Path $upgradeExtract '.code-harness-upgrade'))) { throw 'upgrade.zip must extract directly to .code-harness-upgrade/' }
          foreach ($releaseRoot in @((Join-Path $installExtract '.code-harness'), (Join-Path $upgradeExtract '.code-harness-upgrade'))) {
            foreach ($state in @('harness.yaml','project.md','database.yaml','runs','chains')) {
              if (Test-Path (Join-Path $releaseRoot $state)) { throw "release ZIP leaked Project State: $state" }
            }
          }

          $baseline = 'cd020fb319af95d28518b484593e2e0a0a03b7b5'
          $root = Join-Path $env:RUNNER_TEMP 'codea-real-upgrade-151-to-152'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          $baselineZip = Join-Path $env:RUNNER_TEMP 'codea-baseline-151.zip'
          git cat-file -e "$baseline^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "accepted 1.5.1 baseline commit is unavailable: $baseline" }
          git archive --format=zip --output $baselineZip $baseline .code-harness
          if ($LASTEXITCODE -ne 0) { throw 'failed to archive accepted 1.5.1 baseline' }
          Expand-Archive $baselineZip $root -Force
          $target = Join-Path $root '.code-harness'
          if ((Get-Content (Join-Path $target 'VERSION') -Raw).Trim() -ne '1.5.1') { throw 'accepted baseline archive is not VERSION=1.5.1' }

          New-Item -ItemType Directory -Force (Join-Path $target 'bin') | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $target 'bin/codea-harness-tools.exe'), [byte[]](79,76,68,45,49,46,53,46,49))
          New-Item -ItemType Directory -Force (Join-Path $target 'skills/stale-151') | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $target 'skills/stale-151/SKILL.md'), 'stale-151', [System.Text.UTF8Encoding]::new($false))

          $harnessYaml = @'
          version: 2
          project:
            type: maven
            root: .
            module: ""
          review:
            baseRef: origin/release-user-custom
            includeWorkingTree: false
          integrationTest:
            executable: mvn
            args: [test]
            reportDir: target/surefire-reports
            timeoutSeconds: 777
          service:
            executable: mvn
            args: [spring-boot:run]
            startupTimeoutSeconds: 120
            readiness:
              type: log
              pattern: Started
            logFile: null
          stopService:
            mode: processTree
          initialization:
            status: READY
            unresolved: []
          scope:
            sourceIncludes: [src/main/java/**]
            testIncludes: [src/test/java/**]
            mapperIncludes: [src/main/resources/**/*Mapper.xml]
            configIncludes: [src/main/resources/**/*.yml]
          write:
            allowedTestPaths: [src/test/**]
            allowedProductionPaths: [src/main/**]
            deniedPaths: []
          runs:
            directory: .code-harness/runs
          '@
          [System.IO.File]::WriteAllText((Join-Path $target 'harness.yaml'), $harnessYaml, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $target 'project.md'), "project-state-sentinel-151`r`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $target 'database.yaml'), "version: 1`r`nenvironment: TEST`r`npassword: sentinel-secret`r`n", [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force (Join-Path $target 'runs') | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $target 'runs/keep.bin'), [byte[]](1,2,3,4,5,6))
          New-Item -ItemType Directory -Force (Join-Path $target 'chains') | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $target 'chains/order-approve.yaml'), "# user chain`r`nversion: 1`r`nid: order-approve`r`nstatus: ACCEPTED`r`n", [System.Text.UTF8Encoding]::new($false))
          $stateHashes = @{
            harness = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'harness.yaml')).Hash
            project = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'project.md')).Hash
            database = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'database.yaml')).Hash
            runs = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'runs/keep.bin')).Hash
            chain = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'chains/order-approve.yaml')).Hash
          }

          Copy-Item -Recurse (Join-Path $upgradeExtract '.code-harness-upgrade') (Join-Path $root '.code-harness-upgrade')
          $expectedRuntimeHash = (Get-FileHash -Algorithm SHA256 (Join-Path $root '.code-harness-upgrade/bin/codea-harness-tools.exe')).Hash
          Push-Location $root
          try {
            $out = & '.\.code-harness-upgrade\bin\codea-harness-tools.exe' upgrade 2>&1
            if ($LASTEXITCODE -ne 0) { throw "real accepted 1.5.1 -> 1.5.2 live upgrade failed: $($out -join "`n")" }
            $text = $out -join "`n"
            if ($text -notmatch '"status": "UPGRADED"') { throw "unexpected upgrade output: $text" }
            if ((Get-Content '.code-harness/VERSION' -Raw).Trim() -ne '1.5.2') { throw 'target VERSION is not 1.5.2 after live upgrade' }
            if ((Get-FileHash -Algorithm SHA256 '.code-harness/harness.yaml').Hash -ne $stateHashes.harness) { throw 'harness.yaml changed during 1.5.1 -> 1.5.2 upgrade' }
            if ((Get-FileHash -Algorithm SHA256 '.code-harness/project.md').Hash -ne $stateHashes.project) { throw 'project.md changed during 1.5.1 -> 1.5.2 upgrade' }
            if ((Get-FileHash -Algorithm SHA256 '.code-harness/database.yaml').Hash -ne $stateHashes.database) { throw 'database.yaml changed during 1.5.1 -> 1.5.2 upgrade' }
            if ((Get-FileHash -Algorithm SHA256 '.code-harness/runs/keep.bin').Hash -ne $stateHashes.runs) { throw 'runs/** changed during 1.5.1 -> 1.5.2 upgrade' }
            if ((Get-FileHash -Algorithm SHA256 '.code-harness/chains/order-approve.yaml').Hash -ne $stateHashes.chain) { throw 'chains/** changed during 1.5.1 -> 1.5.2 upgrade' }
            $afterHarness = Get-Content '.code-harness/harness.yaml' -Raw
            if ($afterHarness -match '(?m)^\s*workspaceDependencies\s*:') { throw '1.5.1 -> 1.5.2 upgrade injected workspaceDependencies into existing harness.yaml' }
            if (Test-Path '.code-harness/skills/stale-151/SKILL.md') { throw 'stale 1.5.1 Framework survived live upgrade' }
            if ((Get-FileHash -Algorithm SHA256 '.code-harness/bin/codea-harness-tools.exe').Hash -ne $expectedRuntimeHash) { throw 'installed runtime does not match 1.5.2 release runtime' }
            if (!(Test-Path '.code-harness/tools-runtime/internal/workspace/maven.go')) { throw 'installed 1.5.2 missing workspace Maven verifier' }
            if (!(Test-Path '.code-harness/tools-runtime/internal/nav/workspace.go')) { throw 'installed 1.5.2 missing workspace navigation' }
            if (Test-Path '.code-harness-upgrade') { throw 'upgrade source was not cleaned' }

            $probeOut = Join-Path $env:RUNNER_TEMP 'codea-chain-validate-probe.out'
            $probeErr = Join-Path $env:RUNNER_TEMP 'codea-chain-validate-probe.err'
            $probeExe = (Resolve-Path '.\.code-harness\bin\codea-harness-tools.exe').Path
            $probe = Start-Process -FilePath $probeExe -ArgumentList @('chain','validate') -Wait -PassThru -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr
            $probeText = @((Get-Content $probeOut -ErrorAction SilentlyContinue),(Get-Content $probeErr -ErrorAction SilentlyContinue)) -join "`n"
            if ($probe.ExitCode -eq 0 -or $probeText -notmatch 'chain validate requires --id and --change-analysis') { throw "installed chain validate capability probe failed: $probeText" }
            $global:LASTEXITCODE = 0
          } finally {
            Pop-Location
          }

      - name: Upload 1.5.2 install package
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.5.2-windows-x64-install
          path: codea-harness-1.5.2-windows-x64-install.zip
          if-no-files-found: error

      - name: Upload 1.5.2 upgrade package
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.5.2-windows-x64-upgrade
          path: codea-harness-1.5.2-windows-x64-upgrade.zip
          if-no-files-found: error
