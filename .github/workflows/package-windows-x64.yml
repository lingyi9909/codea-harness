name: package-windows-x64

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.code-harness/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/package-windows-x64.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Full controlled runtime release gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Targeted 1.3.2 golden suites
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./internal/nav ./internal/schema ./internal/selection ./internal/upgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./internal/dbconfig ./internal/dbguard ./internal/dbmysql ./internal/dbevidence ./cmd/codea-harness-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 runtime
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-s -w" -o ../bin/codea-harness-tools.exe ./cmd/codea-harness-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vendor pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe'
          & '.code-harness/bin/ast-grep.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lightweight Code Navigation real ast-grep smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'smoke/src/main/java' | Out-Null
          @'
          public interface OrderService { void approve(); }
          '@ | Set-Content 'smoke/src/main/java/OrderService.java'
          @'
          public interface AuditService { void approve(); }
          '@ | Set-Content 'smoke/src/main/java/AuditService.java'
          @'
          @RestController
          public class OrderController {
              private final OrderService orderService;
              private final AuditService auditService;
              public OrderController(OrderService orderService, AuditService auditService) {
                  this.orderService = orderService;
                  this.auditService = auditService;
              }
              @PostMapping(
                  value = "/approve"
              )
              public Result<Void> approve(
                  @RequestParam("id") Long id,
                  @RequestParam(required = false) String reason) {
                  orderService.approve();
                  auditService.approve();
                  return null;
              }
          }
          '@ | Set-Content 'smoke/src/main/java/OrderController.java'

          $info = & '.code-harness/bin/codea-harness-tools.exe' nav get-symbol-info --symbol OrderController.approve --scope smoke/src/main/java
          if ($LASTEXITCODE -ne 0) { throw "get-symbol-info failed: $($info -join "`n")" }
          $infoText = $info -join "`n"
          if ($infoText -notmatch 'OrderController.approve') { throw "symbol info missing: $infoText" }
          if ($infoText -notmatch 'RequestParam') { throw "Spring parameter annotations missing: $infoText" }
          if ($infoText -notmatch '/approve') { throw "multiline PostMapping value missing: $infoText" }

          $ann = & '.code-harness/bin/codea-harness-tools.exe' nav find-by-annotation --annotation PostMapping --scope smoke/src/main/java
          if ($LASTEXITCODE -ne 0) { throw "find-by-annotation failed: $($ann -join "`n")" }
          if (($ann -join "`n") -notmatch 'OrderController.approve') { throw 'PostMapping method not found' }

          $callers = & '.code-harness/bin/codea-harness-tools.exe' nav find-callers --symbol OrderService.approve --scope smoke/src/main/java
          if ($LASTEXITCODE -ne 0) { throw "find-callers failed: $($callers -join "`n")" }
          $callerText = $callers -join "`n"
          if ($callerText -notmatch 'CONFIRMED') { throw "typed OrderService caller not confirmed: $callerText" }
          if ($callerText -match 'AuditService.*CONFIRMED') { throw "AuditService call incorrectly confirmed: $callerText" }
          Remove-Item -Recurse -Force smoke

      - name: Stage formal install and upgrade releases
        shell: pwsh
        run: |
          $version = (Get-Content '.code-harness/VERSION' -Raw).Trim()
          if ($version -ne '1.3.2') { throw "unexpected release version: $version" }

          $runtimeHash = (Get-FileHash -Algorithm SHA256 '.code-harness/bin/codea-harness-tools.exe').Hash.ToLowerInvariant()
          $astHash = (Get-FileHash -Algorithm SHA256 '.code-harness/bin/ast-grep.exe').Hash.ToLowerInvariant()

          $installStage = Join-Path $env:RUNNER_TEMP 'codea-release-install'
          $upgradeStage = Join-Path $env:RUNNER_TEMP 'codea-release-upgrade'
          Remove-Item -Recurse -Force $installStage,$upgradeStage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $installStage,$upgradeStage | Out-Null

          Copy-Item -Recurse '.code-harness' (Join-Path $installStage '.code-harness')
          Copy-Item -Recurse '.code-harness' (Join-Path $upgradeStage '.code-harness-upgrade')

          Remove-Item -Recurse -Force (Join-Path $installStage '.code-harness/runs') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $upgradeStage '.code-harness-upgrade/runs') -ErrorAction SilentlyContinue

          $manifest = [ordered]@{
            version = $version
            platform = 'windows'
            arch = 'x64'
            runtime = 'codea-harness-tools.exe'
            runtimeSha256 = $runtimeHash
            astGrepVersion = '0.42.1'
            astGrepSha256 = $astHash
          } | ConvertTo-Json

          [System.IO.File]::WriteAllText((Join-Path $installStage '.code-harness/RELEASE-MANIFEST.json'), $manifest, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $upgradeStage '.code-harness-upgrade/RELEASE-MANIFEST.json'), $manifest, [System.Text.UTF8Encoding]::new($false))

          $commonRequired = @(
            'VERSION','RELEASE-MANIFEST.json','AGENTS.md','bootstrap.md','upgrade.md',
            'harness.template.yaml','project.template.md','bin/codea-harness-tools.exe','bin/ast-grep.exe',
            'agents/api-doc-agent.md','skills/discover-api/SKILL.md','skills/generate-api-doc/SKILL.md',
            'contracts/api-doc.schema.json','contracts/review-output.schema.json','tools/README.md'
          )

          foreach ($pair in @(
            @{ Root = (Join-Path $installStage '.code-harness'); Name = 'install' },
            @{ Root = (Join-Path $upgradeStage '.code-harness-upgrade'); Name = 'upgrade' }
          )) {
            foreach ($rel in $commonRequired) {
              if (!(Test-Path (Join-Path $pair.Root $rel))) { throw "$($pair.Name) release missing: $rel" }
            }
            foreach ($dir in @('agents','skills','contracts','tools')) {
              if (@(Get-ChildItem (Join-Path $pair.Root $dir) -File -Recurse).Count -eq 0) { throw "$($pair.Name) release has empty $dir tree" }
            }
            foreach ($state in @('harness.yaml','project.md','database.yaml','runs')) {
              if (Test-Path (Join-Path $pair.Root $state)) { throw "$($pair.Name) release leaked Project State: $state" }
            }
            $m = Get-Content (Join-Path $pair.Root 'RELEASE-MANIFEST.json') -Raw | ConvertFrom-Json
            if ($m.version -ne $version -or $m.platform -ne 'windows' -or $m.arch -ne 'x64') { throw "$($pair.Name) manifest identity invalid" }
            if ($m.runtime -ne 'codea-harness-tools.exe' -or $m.astGrepVersion -ne '0.42.1') { throw "$($pair.Name) manifest tool identity invalid" }
            if ($m.runtimeSha256 -ne $runtimeHash -or $m.astGrepSha256 -ne $astHash) { throw "$($pair.Name) manifest hashes invalid" }
          }

          $bootstrap = Get-Content (Join-Path $upgradeStage '.code-harness-upgrade/upgrade.md') -Raw
          foreach ($needle in @(
            '.code-harness-upgrade/RELEASE-MANIFEST.json',
            '.code-harness-upgrade/bin/codea-harness-tools.exe',
            '.code-harness-upgrade/bin/ast-grep.exe',
            'contracts/harness-config.schema.json',
            'MANUAL_ACTION_REQUIRED',
            '不调用任何 Runtime',
            'GitHub Source Code',
            '.code-harness/bin/codea-harness-tools.exe upgrade'
          )) {
            if ($bootstrap -notmatch [regex]::Escape($needle)) { throw "upgrade bootstrap contract missing: $needle" }
          }

      - name: Build install and upgrade ZIPs
        shell: pwsh
        run: |
          $installStage = Join-Path $env:RUNNER_TEMP 'codea-release-install'
          $upgradeStage = Join-Path $env:RUNNER_TEMP 'codea-release-upgrade'
          Compress-Archive -Path (Join-Path $installStage '.code-harness') -DestinationPath 'codea-harness-1.3.2-windows-x64-install.zip' -Force
          Compress-Archive -Path (Join-Path $upgradeStage '.code-harness-upgrade') -DestinationPath 'codea-harness-1.3.2-windows-x64-upgrade.zip' -Force

      - name: Validate ZIP layouts and Windows live upgrades
        shell: pwsh
        run: |
          $installExtract = Join-Path $env:RUNNER_TEMP 'codea-install-extract'
          $upgradeExtract = Join-Path $env:RUNNER_TEMP 'codea-upgrade-extract'
          Remove-Item -Recurse -Force $installExtract,$upgradeExtract -ErrorAction SilentlyContinue
          Expand-Archive 'codea-harness-1.3.2-windows-x64-install.zip' $installExtract -Force
          Expand-Archive 'codea-harness-1.3.2-windows-x64-upgrade.zip' $upgradeExtract -Force

          if (!(Test-Path (Join-Path $installExtract '.code-harness'))) { throw 'install.zip must extract directly to .code-harness/' }
          if (!(Test-Path (Join-Path $upgradeExtract '.code-harness-upgrade'))) { throw 'upgrade.zip must extract directly to .code-harness-upgrade/' }
          if (Test-Path (Join-Path $installExtract '.code-harness-upgrade')) { throw 'install.zip contains wrong top-level harness directory' }
          if (Test-Path (Join-Path $upgradeExtract '.code-harness')) { throw 'upgrade.zip contains wrong top-level harness directory' }

          foreach ($releaseRoot in @((Join-Path $installExtract '.code-harness'), (Join-Path $upgradeExtract '.code-harness-upgrade'))) {
            foreach ($rel in @(
              'VERSION','RELEASE-MANIFEST.json','AGENTS.md','bootstrap.md','upgrade.md',
              'harness.template.yaml','project.template.md','bin/codea-harness-tools.exe','bin/ast-grep.exe',
              'agents/api-doc-agent.md','skills/discover-api/SKILL.md','skills/generate-api-doc/SKILL.md',
              'contracts/api-doc.schema.json','contracts/review-output.schema.json','tools/README.md'
            )) {
              if (!(Test-Path (Join-Path $releaseRoot $rel))) { throw "extracted release missing: $rel" }
            }
            foreach ($state in @('harness.yaml','project.md','database.yaml','runs')) {
              if (Test-Path (Join-Path $releaseRoot $state)) { throw "release ZIP leaked Project State: $state" }
            }
          }

          function Invoke-CodeaUpgradeScenario([string]$fromVersion, [string]$name) {
            $root = Join-Path $env:RUNNER_TEMP $name
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $root | Out-Null
            Copy-Item -Recurse (Join-Path $installExtract '.code-harness') (Join-Path $root '.code-harness')
            Copy-Item -Recurse (Join-Path $upgradeExtract '.code-harness-upgrade') (Join-Path $root '.code-harness-upgrade')

            $target = Join-Path $root '.code-harness'
            Set-Content (Join-Path $target 'VERSION') $fromVersion
            Remove-Item (Join-Path $target 'RELEASE-MANIFEST.json') -Force -ErrorAction SilentlyContinue
            if ($fromVersion -eq '1.2.0') {
              Remove-Item (Join-Path $target 'agents/api-doc-agent.md') -Force -ErrorAction SilentlyContinue
              Remove-Item (Join-Path $target 'skills/discover-api') -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item (Join-Path $target 'skills/generate-api-doc') -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item (Join-Path $target 'contracts/api-doc.schema.json') -Force -ErrorAction SilentlyContinue
              Remove-Item (Join-Path $target 'tools-runtime/internal/report') -Recurse -Force -ErrorAction SilentlyContinue
            }
            New-Item -ItemType Directory -Force (Join-Path $target 'skills/stale') | Out-Null
            Set-Content (Join-Path $target 'skills/stale/SKILL.md') 'stale'

            $harnessYaml = @'
          version: 1
          project:
            type: maven
            root: .
            module: ""
          review:
            baseRef: origin/develop
            includeWorkingTree: true
          integrationTest:
            executable: mvn
            args: [test]
            reportDir: target/surefire-reports
            timeoutSeconds: 600
          service:
            executable: mvn
            args: [spring-boot:run]
            startupTimeoutSeconds: 120
            readiness:
              type: log
              pattern: Started
            logFile: null
          stopService:
            mode: processTree
          initialization:
            status: READY
            unresolved: []
          scope:
            sourceIncludes: [src/main/java/**]
            testIncludes: [src/test/java/**]
          write:
            allowedTestPaths: [src/test/**]
            allowedProductionPaths: [src/main/**]
            deniedPaths: []
          runs:
            directory: .code-harness/runs
          '@
            [System.IO.File]::WriteAllText((Join-Path $target 'harness.yaml'), $harnessYaml, [System.Text.UTF8Encoding]::new($false))
            [System.IO.File]::WriteAllText((Join-Path $target 'project.md'), "project-state-sentinel-$fromVersion`n", [System.Text.UTF8Encoding]::new($false))
            New-Item -ItemType Directory -Force (Join-Path $target 'runs') | Out-Null
            [System.IO.File]::WriteAllBytes((Join-Path $target 'runs/keep.bin'), [byte[]](1,2,3,4,5))
            $databaseBytes = [System.Text.UTF8Encoding]::new($false).GetBytes("version: 1`nenvironment: TEST`npassword: sentinel-secret`n")
            [System.IO.File]::WriteAllBytes((Join-Path $target 'database.yaml'), $databaseBytes)

            $stateHashes = @{
              harness = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'harness.yaml')).Hash
              project = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'project.md')).Hash
              database = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'database.yaml')).Hash
              runs = (Get-FileHash -Algorithm SHA256 (Join-Path $target 'runs/keep.bin')).Hash
            }

            $newExe = Join-Path $root '.code-harness-upgrade/bin/codea-harness-tools.exe'
            [System.IO.File]::AppendAllText($newExe, "CODEA-UPGRADE-SMOKE-$name")
            $expectedExeHash = (Get-FileHash -Algorithm SHA256 $newExe).Hash

            Push-Location $root
            try {
              $out = & '.\.code-harness\bin\codea-harness-tools.exe' upgrade 2>&1
              if ($LASTEXITCODE -ne 0) { throw "live upgrade failed ($name): $($out -join "`n")" }
              $text = $out -join "`n"
              if ($text -notmatch '"status": "UPGRADED"') { throw "unexpected upgrade output ($name): $text" }
              if ($text -notmatch 'skills/stale/SKILL.md') { throw "removedFiles missing stale path ($name): $text" }
              if ((Get-Content '.code-harness/VERSION' -Raw).Trim() -ne '1.3.2') { throw "target version was not upgraded from $fromVersion to 1.3.2" }
              if ((Get-FileHash -Algorithm SHA256 '.code-harness/harness.yaml').Hash -ne $stateHashes.harness) { throw "harness.yaml changed ($name)" }
              if ((Get-FileHash -Algorithm SHA256 '.code-harness/project.md').Hash -ne $stateHashes.project) { throw "project.md changed ($name)" }
              if ((Get-FileHash -Algorithm SHA256 '.code-harness/database.yaml').Hash -ne $stateHashes.database) { throw "database.yaml changed ($name)" }
              if ((Get-FileHash -Algorithm SHA256 '.code-harness/runs/keep.bin').Hash -ne $stateHashes.runs) { throw "runs/** changed ($name)" }
              foreach ($path in @(
                '.code-harness/agents/api-doc-agent.md',
                '.code-harness/skills/discover-api/SKILL.md',
                '.code-harness/skills/generate-api-doc/SKILL.md',
                '.code-harness/contracts/api-doc.schema.json',
                '.code-harness/contracts/review-output.schema.json',
                '.code-harness/tools-runtime/internal/report/review.go',
                '.code-harness/tools-runtime/internal/report/apidoc.go',
                '.code-harness/tools-runtime/internal/nav/extended.go'
              )) {
                if (!(Test-Path $path)) { throw "new framework path missing after upgrade ($name): $path" }
              }
              if (Test-Path '.code-harness/skills/stale/SKILL.md') { throw "stale framework survived ($name)" }
              if (Test-Path '.code-harness-upgrade') { throw "upgrade source was not cleaned ($name)" }
              if (Get-ChildItem -Force -Name '.code-harness-stage-*' -ErrorAction SilentlyContinue) { throw "stage directory leaked ($name)" }
              if (Get-ChildItem -Force -Name '.code-harness-backup-*' -ErrorAction SilentlyContinue) { throw "backup directory leaked ($name)" }
              if ((Get-FileHash -Algorithm SHA256 '.code-harness/bin/codea-harness-tools.exe').Hash -ne $expectedExeHash) { throw "running executable was not replaced ($name)" }
            } finally {
              Pop-Location
            }
          }

          Invoke-CodeaUpgradeScenario '1.3.1' 'codea-upgrade-from-131'

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.3.2-windows-x64-install
          path: codea-harness-1.3.2-windows-x64-install.zip
          if-no-files-found: error

      - name: Upload upgrade package
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.3.2-windows-x64-upgrade
          path: codea-harness-1.3.2-windows-x64-upgrade.zip
          if-no-files-found: error
