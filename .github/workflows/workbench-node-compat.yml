name: Workbench Node 22 24 26 compatibility
on:
  pull_request:
    paths: ['web-workbench/**', '.github/workflows/workbench-node-compat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-startup:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
        node: ['22', '24', '26']
    defaults:
      run:
        working-directory: web-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web-workbench/package-lock.json
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check API and UI types
        run: |
          npm run typecheck
          npm run web:typecheck
      - name: Build React application
        run: npm run web:build
      - name: Test local startup and the root HTML / assets
        run: npm run smoke:local
      - name: Native adapter and chat contract tests
        run: |
          npm test
          npm run test:chat
