name: task6-actionlint-once

on:
  push:
    branches:
      - docs/1.5.3-chain-reliability-editing-design

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate package workflow
        run: actionlint -color .github/workflows/package-windows-x64.yml
