name: task162-review-reliability-task1-apply

on:
  push:
    branches: [hotfix/1.6.2-review-reliability-task1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.6.2-review-reliability-task1
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply minimal Task 1 implementation
        shell: pwsh
        run: python ./.github/scripts/task162-review-reliability-task1-apply-v2.py

      - name: Format Runtime sources
        shell: pwsh
        run: |
          gofmt -w ./.code-harness/tools-runtime/cmd/codea-dcep-tools/review_precision_command.go
          gofmt -w ./.code-harness/tools-runtime/cmd/codea-dcep-tools/report.go

      - name: Focused GREEN contract tests before commit
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 -run 'Test162ReviewReliabilityTask1' -v ./cmd/codea-dcep-tools

      - name: Active contract regression before commit
        shell: pwsh
        run: ./.github/scripts/task162-review-reliability-task1-contract-regression.ps1

      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name 'codea-harness-ci'
          git config user.email 'codea-harness-ci@users.noreply.github.com'
          git add -- `
            .code-harness/contracts/finding-certify-request.schema.json `
            .code-harness/contracts/report-review-request.schema.json `
            .code-harness/tools-runtime/cmd/codea-dcep-tools/review_precision_command.go `
            .code-harness/tools-runtime/cmd/codea-dcep-tools/report.go `
            .code-harness/AGENTS.md `
            .code-harness/tools/README.md `
            .code-harness/agents/orchestrator.md `
            .code-harness/agents/reviewer.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix: complete review invocation contract'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:hotfix/1.6.2-review-reliability-task1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
