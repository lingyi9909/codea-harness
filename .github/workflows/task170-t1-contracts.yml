name: task170-t1-contracts

on:
  workflow_dispatch:
  push:
    branches: [feature/1.7, feature/1.7-integrated-t1]
    paths:
      - '.code-harness/contracts/**'
      - '.code-harness/tools-runtime/internal/nav/**'
      - '.code-harness/tools-runtime/internal/reviewcontext/**'
      - '.code-harness/tools-runtime/internal/knowledge/**'
      - '.code-harness/tools-runtime/internal/finding/**'
      - '.code-harness/tools-runtime/internal/schema/**'
      - '.code-harness/tools-runtime/go.mod'
      - '.code-harness/tools-runtime/go.sum'
      - '.github/workflows/task170-t1-contracts.yml'

permissions:
  contents: read
  actions: read

jobs:
  t1-contracts:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.10'
          cache-dependency-path: .code-harness/tools-runtime/go.sum
      - name: Bootstrap existing locked modules for hosted CI
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env:
          GOTOOLCHAIN: local
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git restore --source=HEAD -- go.mod go.sum
          $moduleStatus = @(git status --short -- go.mod go.sum)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($moduleStatus.Count -ne 0) { throw "module bootstrap left locked files dirty: $($moduleStatus -join '; ')" }
          Write-Output 'TASK170_MODULE_BOOTSTRAP PASS existing-lock-only=true tracked-files-restored=true'
      - name: Verify accepted 1.6.4.final lineage and clean baseline
        shell: pwsh
        run: |
          git merge-base --is-ancestor 439d9618591657b80d4670f1d9f3b5909d378447 HEAD
          if ($LASTEXITCODE -ne 0) { throw '1.7 branch is not based on accepted 1.6.4.final' }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status = @(git status --short)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status.Count -ne 0) { throw "baseline working tree is not clean: $($status -join '; ')" }
          Write-Output "TASK170_BASELINE PASS head=$head status=clean"
      - name: Download accepted 1.6.4.final release candidate
        uses: actions/download-artifact@v4
        with:
          name: codea-harness-1.6.4-release-candidate-439d9618591657b80d4670f1d9f3b5909d378447
          path: ${{ runner.temp }}/task170-accepted-rc
          github-token: ${{ github.token }}
          repository: lingyi9909/codea-harness
          run-id: 34561342970
      - name: Provision approved pinned ast-grep test fixture
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'task170-accepted-rc'
          $installZip = Join-Path $artifactRoot 'codea-harness-1.6.4-windows-x64-install.zip'
          if (-not (Test-Path $installZip -PathType Leaf)) { throw "accepted install ZIP missing: $installZip" }
          $stage = Join-Path $env:RUNNER_TEMP 'task170-approved-install'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          Expand-Archive -Path $installZip -DestinationPath $stage -Force
          $manifestPath = Join-Path $stage '.code-harness/RELEASE-MANIFEST.json'
          $source = Join-Path $stage '.code-harness/bin/ast-grep.exe'
          if (-not (Test-Path $manifestPath -PathType Leaf)) { throw 'accepted release manifest missing' }
          if (-not (Test-Path $source -PathType Leaf)) { throw 'accepted pinned ast-grep missing' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ([string]$manifest.version -cne '1.6.4') { throw "accepted RC version mismatch: $($manifest.version)" }
          if ([string]$manifest.buildCommit -cne '439d9618591657b80d4670f1d9f3b5909d378447') { throw "accepted RC build commit mismatch: $($manifest.buildCommit)" }
          if ([string]$manifest.astGrepVersion -cne '0.42.1') { throw "accepted ast-grep version mismatch: $($manifest.astGrepVersion)" }
          $actualHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne [string]$manifest.astGrepSha256) { throw "accepted ast-grep hash mismatch: $actualHash" }
          $target = Join-Path $env:GITHUB_WORKSPACE '.code-harness/bin/ast-grep.exe'
          New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
          Copy-Item -LiteralPath $source -Destination $target -Force
          $version = (& $target --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '0\.42\.1') { throw "accepted ast-grep smoke failed: $version" }
          "CODEA_AST_GREP=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "TASK170_APPROVED_AST_GREP PASS buildCommit=$($manifest.buildCommit) sha256=$actualHash"
      - name: T1 core Test170 gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          GOPROXY: off
          GOSUMDB: off
        run: go test ./internal/nav ./internal/reviewcontext ./internal/schema -run Test170 -count=1
      - name: T1 knowledge contract Test170 gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          GOPROXY: off
          GOSUMDB: off
        run: go test ./internal/schema ./internal/knowledge ./internal/nav -run Test170 -count=1
      - name: Verify zero dependency drift after offline T1 gates
        shell: pwsh
        run: |
          git diff --exit-code -- .code-harness/tools-runtime/go.mod .code-harness/tools-runtime/go.sum
          if ($LASTEXITCODE -ne 0) { throw 'offline T1 gates changed go.mod/go.sum' }
          git diff --exit-code 439d9618591657b80d4670f1d9f3b5909d378447 HEAD -- .code-harness/tools-runtime/go.mod .code-harness/tools-runtime/go.sum
          if ($LASTEXITCODE -ne 0) { throw 'T1 committed changes to go.mod/go.sum' }
          Write-Output 'TASK170_DEPENDENCY_DRIFT PASS working-tree=clean committed=unchanged'
      - name: Full Go regression
        id: full-regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          GOPROXY: off
          GOSUMDB: off
        run: |
          go test ./... -count=1 2>&1 | Tee-Object -FilePath full-go-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload full regression evidence
        if: always() && steps.full-regression.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: task170-full-go-regression
          path: .code-harness/tools-runtime/full-go-regression.log
          if-no-files-found: error
      - name: Go vet
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          GOPROXY: off
          GOSUMDB: off
        run: go vet ./...
