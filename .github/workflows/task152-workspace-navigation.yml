name: task152-workspace-navigation

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.code-harness/**'
      - '.github/workflows/task152-workspace-navigation.yml'

permissions:
  contents: read

jobs:
  workspace-navigation-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Task 1-3 Runtime unit gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/workspace ./cmd/codea-harness-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vendor pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep-152.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep-152'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          New-Item -ItemType Directory -Force '.code-harness/bin' | Out-Null
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe' -Force
          & '.code-harness/bin/ast-grep.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: A-E real ast-grep workspace inheritance regressions
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:CODEA_AST_GREP_TEST_PATH = (Resolve-Path '../bin/ast-grep.exe').Path
          go test -count=1 ./internal/nav -run 'TestWorkspace'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 Controlled Runtime
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -o ../bin/codea-harness-tools.exe ./cmd/codea-harness-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Formal Runtime config verify to Maven VERIFIED to workspace navigation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'workspace-152-formal'
          $current = Join-Path $root 'order-service'
          $dependency = Join-Path $root 'company-framework'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $current,$dependency | Out-Null
          Copy-Item -Recurse '.code-harness' (Join-Path $current '.code-harness')

          @'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.company</groupId>
            <artifactId>order-service</artifactId>
            <version>1.0.0</version>
            <dependencies>
              <dependency>
                <groupId>com.company</groupId>
                <artifactId>company-framework</artifactId>
                <version>2.3.1</version>
              </dependency>
            </dependencies>
          </project>
          '@ | Set-Content (Join-Path $current 'pom.xml')
          @'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.company</groupId>
            <artifactId>company-framework</artifactId>
            <version>2.3.1</version>
          </project>
          '@ | Set-Content (Join-Path $dependency 'pom.xml')

          $currentJava = Join-Path $current 'src/main/java/com/company/order'
          $dependencyJava = Join-Path $dependency 'src/main/java/com/company/framework'
          New-Item -ItemType Directory -Force $currentJava,$dependencyJava | Out-Null
          @'
          package com.company.framework;
          public abstract class AbstractTemplate {
              public void execute() {
                  validate();
                  doExecute();
              }
              protected void validate() {}
              protected abstract void doExecute();
          }
          '@ | Set-Content (Join-Path $dependencyJava 'AbstractTemplate.java')
          @'
          package com.company.order;
          import com.company.framework.AbstractTemplate;
          public class XxxServiceImpl extends AbstractTemplate {
              public void submit() { execute(); }
              @Override protected void doExecute() { mapper.updateStatus(); }
          }
          '@ | Set-Content (Join-Path $currentJava 'XxxServiceImpl.java')

          @'
          version: 2
          project:
            type: maven
            root: .
            module: ""
          workspaceDependencies:
            - id: company-framework
              root: ../company-framework
              maven:
                groupId: com.company
                artifactId: company-framework
              mode: READ_ONLY
          review:
            baseRef: origin/main
            includeWorkingTree: true
          integrationTest:
            executable: mvn
            args: [test]
            reportDir: target/surefire-reports
            timeoutSeconds: 600
          service:
            executable: mvn
            args: [spring-boot:run]
            startupTimeoutSeconds: 120
            readiness:
              type: log
              pattern: Started
            logFile: null
          stopService:
            mode: processTree
          initialization:
            status: READY
            unresolved: []
          scope:
            sourceIncludes: [src/main/java/**/*.java]
            testIncludes: [src/test/java/**/*.java]
            mapperIncludes: [src/main/resources/**/*Mapper.xml]
            configIncludes: [src/main/resources/**/*.yml]
          write:
            allowedTestPaths: [src/test/java/**]
            allowedProductionPaths: [src/main/java/**]
            deniedPaths: [.git/**, .github/**, target/**, .code-harness/agents/**, .code-harness/skills/**, .code-harness/contracts/**, .code-harness/tools/**]
          runs:
            directory: .code-harness/runs
          '@ | Set-Content (Join-Path $current '.code-harness/harness.yaml')

          Push-Location $current
          try {
            $runtime = '.code-harness/bin/codea-harness-tools.exe'
            & $runtime validate --schema '.code-harness/contracts/harness-config.schema.json' --input '.code-harness/harness.yaml' --format yaml
            if ($LASTEXITCODE -ne 0) { throw 'formal harness config semantic validation failed' }

            $verified = & $runtime workspace verify --id company-framework
            if ($LASTEXITCODE -ne 0 -or (($verified -join "`n") -notmatch 'VERIFIED')) { throw "workspace Maven identity was not VERIFIED: $($verified -join ' ')" }

            $inherited = & $runtime nav workspace-inherited --workspace company-framework --from XxxServiceImpl.submit --method execute
            if ($LASTEXITCODE -ne 0 -or (($inherited -join "`n") -notmatch 'AbstractTemplate.execute')) { throw "inherited navigation failed: $($inherited -join ' ')" }

            $parentCall = & $runtime nav workspace-superclass-call --workspace company-framework --from AbstractTemplate.execute --method validate
            if ($LASTEXITCODE -ne 0 -or (($parentCall -join "`n") -notmatch 'AbstractTemplate.validate')) { throw "parent method navigation failed: $($parentCall -join ' ')" }

            $dispatch = & $runtime nav workspace-template-dispatch --workspace company-framework --from AbstractTemplate.execute --hook doExecute --concrete XxxServiceImpl
            if ($LASTEXITCODE -ne 0 -or (($dispatch -join "`n") -notmatch 'XxxServiceImpl.doExecute')) { throw "template dispatch failed: $($dispatch -join ' ')" }
          }
          finally {
            Pop-Location
          }

      - name: Formal Runtime rejects qualified helper call and ambiguous override
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'workspace-152-formal'
          $current = Join-Path $root 'order-service'
          $currentJava = Join-Path $current 'src/main/java/com/company/order'
          @'
          package com.company.order;
          import com.company.framework.AbstractTemplate;
          public class XxxServiceImpl extends AbstractTemplate {
              private Helper helper;
              public void submit() { helper.execute(); }
              @Override protected void doExecute() { mapper.updateStatus(); }
          }
          '@ | Set-Content (Join-Path $currentJava 'XxxServiceImpl.java')
          Push-Location $current
          try {
            $runtime = '.code-harness/bin/codea-harness-tools.exe'
            $falsePositive = & $runtime nav workspace-inherited --workspace company-framework --from XxxServiceImpl.submit --method execute 2>&1
            if ($LASTEXITCODE -eq 0 -or (($falsePositive -join "`n") -notmatch 'INHERITED_METHOD_NOT_FOUND')) { throw "helper.execute false-confirmed or wrong limitation: $($falsePositive -join ' ')" }

            @'
            package com.company.order;
            import com.company.framework.AbstractTemplate;
            public class AnotherServiceImpl extends AbstractTemplate {
                @Override protected void doExecute() { }
            }
            '@ | Set-Content (Join-Path $currentJava 'AnotherServiceImpl.java')
            $ambiguous = & $runtime nav workspace-template-dispatch --workspace company-framework --from AbstractTemplate.execute --hook doExecute 2>&1
            if ($LASTEXITCODE -eq 0 -or (($ambiguous -join "`n") -notmatch 'AMBIGUOUS_TEMPLATE_DISPATCH')) { throw "ambiguous template dispatch was not rejected: $($ambiguous -join ' ')" }
          }
          finally {
            Pop-Location
          }
