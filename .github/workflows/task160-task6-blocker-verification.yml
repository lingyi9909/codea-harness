name: task160-task6-blocker-verification

on:
  pull_request:

jobs:
  verify:
    if: github.head_ref == 'task160-task6-blockers'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.10'
      - name: Task 6 blocker exact gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./internal/finding ./internal/reviewrules -run 'Benchmark|TestValidity|GroundTruth|RealReviewUnit'
      - name: Full Go regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./...
      - name: Go vet
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go vet ./...
