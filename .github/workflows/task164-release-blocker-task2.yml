name: task164-release-blocker-task2

on:
  push:
    branches: [release/1.6.4-final-certification]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  reviewer-host-authority:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install workflow contract parser
        shell: pwsh
        run: |
          python -m pip install PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Required Task 2 product gates and removal negatives
        shell: pwsh
        run: |
          python ./.github/scripts/task164-release-blocker-task2-gate-contract.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact accepted-base ancestry guard
        shell: pwsh
        run: |
          git merge-base --is-ancestor 51ad4cbc32008e388fc7a2564dbd5e518d04d9ae HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Task 2 is not based on accepted Task 1 baseline' }

      - name: Install pinned OpenCode Agent Host
        shell: pwsh
        run: |
          npm install --global opencode-ai@1.18.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (& opencode --version | Out-String).Trim()
          if ($version -notmatch '1\.18\.25') { throw "unexpected OpenCode version: $version" }

      - name: Parse Task 2 E2E scripts
        shell: pwsh
        run: |
          foreach ($script in @(
            './.github/scripts/task164-release-blocker-task2-e2e.ps1',
            './.github/scripts/task164-release-blocker-task2-session-cancel-e2e.ps1',
            './.github/scripts/task164-release-blocker-task2-upgrade-e2e.ps1',
            './.github/scripts/task164-release-blocker-task2-plain-review-e2e.ps1'
          )) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
          python -m py_compile ./.github/scripts/task164-release-blocker-task2-plain-review-server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK164_TASK2_E2E_SCRIPT_PARSE PASS'

      - name: Build exact-head 1.6.4 package
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact packaged 1.6.3 upgrade and partial Host apply rollback E2E
        id: packaged_upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-blocker-task2-upgrade-e2e.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Packaged top-level harness review and disabled Reviewer E2E
        id: top_level_review
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-blocker-task2-plain-review-e2e.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Real packaged OpenCode Reviewer E2E
        id: reviewer_authority
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-blocker-task2-e2e.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Real Reviewer session cancel fail-closed E2E
        id: session_cancel
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-blocker-task2-session-cancel-e2e.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fresh Runtime authority regressions
        id: runtime_authority_regression
        shell: pwsh
        working-directory: .code-harness/tools-runtime
        run: |
          go test -count=1 ./internal/analysis/... ./internal/finding/... ./internal/changeset/... ./internal/coverage/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK164_TASK2_RUNTIME_AUTHORITY_REGRESSION PASS'

      - name: Fresh full Go regression
        id: full_go_test
        shell: pwsh
        working-directory: .code-harness/tools-runtime
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK164_TASK2_FULL_GO_TEST PASS'

      - name: Fresh go vet
        id: go_vet
        shell: pwsh
        working-directory: .code-harness/tools-runtime
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TASK164_TASK2_GO_VET PASS'

      - name: Task 2 scope and exact HEAD
        id: scope_exact_head
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/scripts/task164-release-blocker-task2-scope-self-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./.github/scripts/task164-release-blocker-task2-scope.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve top-level OpenCode session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task164-task2-entry-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task164-task2-entry-evidence/
          if-no-files-found: warn
