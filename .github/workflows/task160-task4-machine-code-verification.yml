name: task160-task4-machine-code-verification

on:
  pull_request:

jobs:
  task4-machine-code-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: Task 4 machine-code exact regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: go test -count=1 ./cmd/codea-harness-tools -run 'TestTask4(LoadCertifiedAndReportRejectSourceMutationAfterCertification|ProposalBytesMutationReturnsCertifiedFindingsStale|CertifiedFindingsHashTamperKeepsHashMismatchCode)$'
