name: task163-task1-workspace-ast-performance

on:
  workflow_dispatch:
  push:
    branches: [hotfix/1.6.3-runtime-usability-task1]
    paths:
      - '.code-harness/tools-runtime/internal/nav/**'
      - '.github/workflows/task163-task1-workspace-ast-performance.yml'
      - 'docs/superpowers/plans/2026-09-06-codea-harness-1.6.3-task1-workspace-ast-performance-plan.md'

permissions:
  contents: read

jobs:
  workspace-ast-performance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - name: Task 1 unit hardening gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          go test -count=1 ./internal/nav -run 'Test163WorkspaceAST(NarrowsConcreteClassCandidates|LargeJSONRecord|CandidateTextIsNotSemanticAuthority)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vendor pinned ast-grep Windows x64
        shell: pwsh
        run: |
          $version = '0.42.1'
          $expected = 'fe34f631bb24c08ad146f92ca2a92971a53d179461b509fd8d32dc863bff9f83'
          $zip = Join-Path $env:RUNNER_TEMP 'ast-grep-163-task1.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ast-grep-163-task1'
          $url = "https://github.com/ast-grep/ast-grep/releases/download/$version/app-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ast-grep checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          New-Item -ItemType Directory -Force '.code-harness/bin' | Out-Null
          Copy-Item (Join-Path $dir 'ast-grep.exe') '.code-harness/bin/ast-grep.exe' -Force
          & '.code-harness/bin/ast-grep.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Task 1 focused Workspace AST gate
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:CODEA_AST_GREP_TEST_PATH = (Resolve-Path '../bin/ast-grep.exe').Path
          go test -count=1 ./internal/nav -run 'Test163WorkspaceAST|TestWorkspace|Test152Nested'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full internal/nav regression
        working-directory: .code-harness/tools-runtime
        shell: pwsh
        run: |
          $env:CODEA_AST_GREP_TEST_PATH = (Resolve-Path '../bin/ast-grep.exe').Path
          go test -count=1 ./internal/nav
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact HEAD evidence
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "workflow checkout drift: head=$head github.sha=${{ github.sha }}" }
          Write-Output "TASK163_TASK1_EXACT_HEAD PASS head=$head"
