name: task162-final-tail-diagnostic

on:
  push:
    branches: [release/1.6.2-final-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-entrypoint:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - name: Prepare exact release Runtime and ast-grep
        shell: pwsh
        run: ./.github/scripts/task162-task2-package.ps1

      - name: Run standalone EntryPoint inventory
        shell: pwsh
        run: |
          & './.github/scripts/task153-task1-real-entrypoint-inventory.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnostic exact-head marker
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "checkout is not exact head: $head" }
          Write-Output "TASK162_FINAL_ENTRYPOINT_EXACT_HEAD PASS head=$head"
