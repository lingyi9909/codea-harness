name: task162-final-tail-diagnostic

on:
  push:
    branches: [release/1.6.2-final-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-gate:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gate: [entrypoint, chain, package]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - name: Prepare exact release Runtime and ast-grep
        shell: pwsh
        run: ./.github/scripts/task162-task2-package.ps1

      - name: Run final compatibility adapter
        shell: pwsh
        run: |
          $gate = '${{ matrix.gate }}'
          switch ($gate) {
            'entrypoint' { & './.github/scripts/task162-hotfix-final-entrypoint-inventory-regression.ps1' }
            'chain' { & './.github/scripts/task162-hotfix-final-chain-regression.ps1' }
            'package' { & './.github/scripts/task162-hotfix-final-package-cleanup-regression.ps1' }
            default { throw "unknown adapter gate: $gate" }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "TASK162_FINAL_ADAPTER_DIAGNOSTIC PASS gate=$gate"

      - name: Diagnostic exact-head marker
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "checkout is not exact head: $head" }
          Write-Output "TASK162_FINAL_ADAPTER_EXACT_HEAD PASS gate=${{ matrix.gate }} head=$head"
