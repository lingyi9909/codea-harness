name: task162-final-release-certification

on:
  push:
    branches: [release/1.6.2-final-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-certification:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.23.x
          cache-dependency-path: .code-harness/tools-runtime/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned OpenCode Agent Host
        shell: pwsh
        run: |
          npm install --global opencode-ai@1.18.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (& opencode --version | Out-String).Trim()
          Write-Output "OpenCode $version"
          if ($version -notmatch '1\.18\.25') { throw "unexpected OpenCode version: $version" }

      - name: Hotfix Final Certification contract
        shell: pwsh
        run: ./.github/scripts/task162-hotfix-final-certification-contract-regression.ps1

      - name: Codea Harness 1.6.2 Final Release Certification
        shell: pwsh
        run: ./.github/scripts/task162-release-certification.ps1

      - name: Validate final exact-head evidence
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "checkout is not exact head: $head" }
          $checklist = Get-Content 'codea-harness-1.6.2-release-checklist.json' -Raw | ConvertFrom-Json
          if ([string]$checklist.exactHeadSha -ne $head) { throw 'release checklist exact HEAD mismatch' }
          if ([string]$checklist.version -ne '1.6.2') { throw 'release checklist version mismatch' }
          if ([string]$checklist.acceptedHotfix.task3 -ne '4a312c4a2c85a202b740d3a1f419b2812e42f866') { throw 'release checklist accepted Task 3 mismatch' }
          foreach ($gate in @('hotfixTask1CanonicalAuthority','hotfixTask2InvocationContract','hotfixTask3RealPlainReview','postTask3CertificationScope')) {
            if ([string]$checklist.gates.$gate -ne 'PASS') { throw "release checklist hotfix gate not PASS: $gate" }
          }
          $manifest = Get-Content '.code-harness/VERSION' -Raw
          if ($manifest.Trim() -ne '1.6.2') { throw 'repository VERSION mismatch' }
          Write-Output "TASK162_FINAL_EXACT_HEAD PASS head=$head"

      - name: Upload official install package
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.2-windows-x64-install
          path: codea-harness-1.6.2-windows-x64-install.zip
          if-no-files-found: error

      - name: Upload official upgrade package
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.2-windows-x64-upgrade
          path: codea-harness-1.6.2-windows-x64-upgrade.zip
          if-no-files-found: error

      - name: Upload release checklist
        uses: actions/upload-artifact@v4
        with:
          name: codea-harness-1.6.2-release-checklist
          path: codea-harness-1.6.2-release-checklist.json
          if-no-files-found: error

      - name: Upload Runtime whitelist
        uses: actions/upload-artifact@v4
        with:
          name: codea-dcep-tools-whitelist
          path: codea-dcep-tools-whitelist.txt
          if-no-files-found: error
