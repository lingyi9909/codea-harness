name: t8-docs-once

on:
  push:
    branches: [feature/1.7-integrated-t8]
    paths:
      - '.github/workflows/t8-docs-once.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append T8 reviewer check protocol
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $reviewerB64 = ''
          $agentsB64 = ''
          $skillB64 = ''
          $targets = @(
            @{ Path = '.code-harness/agents/reviewer.md'; Marker = '## 1.7 T8 Review Evidence + Completion Protocol'; Data = $reviewerB64 },
            @{ Path = '.code-harness/AGENTS.md'; Marker = '## 1.7 T8 Reviewer Check Authority'; Data = $agentsB64 },
            @{ Path = '.code-harness/skills/review-code/SKILL.md'; Marker = '## 1.7 T8 Evidence 与 Review Check 输出'; Data = $skillB64 }
          )
          foreach ($target in $targets) {
            $current = [IO.File]::ReadAllText($target.Path)
            if (-not $current.Contains($target.Marker)) {
              $append = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($target.Data))
              [IO.File]::WriteAllText($target.Path, $current.TrimEnd() + "`n`n" + $append, $utf8)
            }
          }
          git add -- .code-harness/agents/reviewer.md .code-harness/AGENTS.md .code-harness/skills/review-code/SKILL.md
          if ((git diff --cached --name-only).Count -eq 0) { Write-Output 'TASK170_T8_DOCS_NO_CHANGES'; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(review): document task 8 evidence and completion protocol'
          git push origin HEAD:feature/1.7-integrated-t8
