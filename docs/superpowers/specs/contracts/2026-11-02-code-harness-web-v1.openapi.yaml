openapi: 3.1.0
info:
  title: Code Harness Web Workbench API
  version: 1.0.0-design
  description: 研发契约草案，尚无产品实现。Windows本地单用户、MySQL8.4、已提交GitReview。所有业务POST需operationId及CSRF。
servers:
- url: http://127.0.0.1:4176/api/v1
  description: 规划默认地址，可配置，同源静态页面
security:
- localSession: []
paths:
  /health:
    get:
      operationId: health_read
      summary: 读取脱敏健康状态
      tags:
      - health
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: 参数/游标非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 本机会话缺失或过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin/CSRF/可信根校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或非当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 状态/幂等/范围/交互冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 场景或代码范围不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 队列/请求限额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 依赖未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      description: 200 READY；503 DEGRADED/UNAVAILABLE 时仍返回 HealthResponse，不返回 Error。
      security: []
  /auth/session:
    post:
      operationId: auth_pair
      summary: 消费一次性配对码
      tags:
      - auth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: harness_session=<opaque>; HttpOnly; SameSite=Strict; Path=/; Max-Age=43200. HTTPS add
                Secure.
        '400':
          description: 参数/游标非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 本机会话缺失或过期
