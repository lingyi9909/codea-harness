            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库/执行服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 只允许同源 Origin/loopback Host；成功设置 HttpOnly SameSite=Strict cookie；不需 CSRF。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pairingCode:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
              - pairingCode
